<div id="ara-phi-projected-primes">
  <div class="viz-controls" aria-label="Corrected ruler controls">
    <label class="form-label" for="ara-proj-cell">
      Selected cell <span id="ara-proj-cell-value">2</span>
      <input id="ara-proj-cell" class="form-range" type="range" min="0" max="7" step="1" value="2">
    </label>
    <label class="form-label" for="ara-proj-rung">
      Octave rung
      <select id="ara-proj-rung" class="form-select">
        <option value="28">28 — forward to 1.618</option>
        <option value="29">29 — flipped to 0.382</option>
        <option value="38">38 — forward to 1.618</option>
        <option value="39">39 — flipped to 0.382</option>
        <option value="48">48 — forward to 1.618</option>
        <option value="49">49 — flipped to 0.382</option>
      </select>
    </label>
  </div>

  <div class="ara-proj-legend text-small" aria-label="Legend">
    <span><i class="swatch ara"></i>ARA / 2 ruler</span>
    <span><i class="swatch phi"></i>Pentagon / Phi projection</span>
    <span><i class="cross"></i>Ruler crossing</span>
    <span><i class="prime">★</i>Exact prime</span>
    <span><i class="composite"></i>Composite lane in zoom</span>
  </div>

  <div class="ara-proj-layout">
    <section class="main-wrap" aria-label="Corrected ARA and Phi ruler comparison">
      <svg id="ara-proj-main" role="img" aria-labelledby="ara-proj-main-title ara-proj-main-desc">
        <title id="ara-proj-main-title">ARA two-ruler and pentagonal Phi projection with exact primes</title>
        <desc id="ara-proj-main-desc">Every structural cell traverses the full ARA coordinate from zero to two. Over that same first traversal the pentagonal projection advances from zero to Phi, or to its mirror when orientation is flipped. Actual primes are stars on the structural ruler and ruler intersections are ringed.</desc>
      </svg>
    </section>
    <section class="zoom-wrap" aria-label="Selected cell detail">
      <svg id="ara-proj-zoom" role="img" aria-labelledby="ara-proj-zoom-title ara-proj-zoom-desc">
        <title id="ara-proj-zoom-title">Selected structural cell with prime lanes and ruler crossings</title>
        <desc id="ara-proj-zoom-desc">A zoom of one structural cell shows the zero-to-two ARA traversal, the continuing Phi projection, eight candidate lanes, actual primes, composites, and any ruler crossing.</desc>
      </svg>
    </section>
  </div>

  <div id="ara-proj-detail" class="text-small" aria-live="polite"></div>
</div>

<style>
  #ara-phi-projected-primes { width: 100%; color: var(--foreground); }
  #ara-phi-projected-primes .viz-controls { align-items: end; margin-bottom: 0.75rem; }
  #ara-phi-projected-primes .form-label { min-width: 200px; }
  #ara-phi-projected-primes .form-range { display: block; width: 220px; }
  #ara-phi-projected-primes .ara-proj-legend {
    display: flex; flex-wrap: wrap; gap: 0.55rem 1rem; margin-bottom: 0.5rem;
    color: var(--muted-foreground);
  }
  #ara-phi-projected-primes .ara-proj-legend span { display: inline-flex; align-items: center; gap: 0.35rem; }
  #ara-phi-projected-primes .swatch { display: inline-block; width: 1.5rem; height: 0; border-top: 3px solid; }
  #ara-phi-projected-primes .swatch.ara { border-color: var(--viz-series-1); }
  #ara-phi-projected-primes .swatch.phi { border-color: var(--viz-series-2); }
  #ara-phi-projected-primes .cross {
    display: inline-block; width: 0.7rem; height: 0.7rem; border: 2px solid var(--foreground); border-radius: 50%;
  }
  #ara-phi-projected-primes .prime { color: var(--viz-series-4); font-style: normal; }
  #ara-phi-projected-primes .composite {
    display: inline-block; width: 0.55rem; height: 0.55rem; border: 1px solid var(--muted-foreground); border-radius: 50%;
  }
  #ara-phi-projected-primes .ara-proj-layout {
    display: grid; grid-template-columns: minmax(0, 2.3fr) minmax(270px, 1fr); gap: 0.75rem; align-items: stretch;
  }
  #ara-phi-projected-primes .main-wrap,
  #ara-phi-projected-primes .zoom-wrap { min-width: 0; }
  #ara-phi-projected-primes svg { display: block; width: 100%; overflow: visible; }
  #ara-phi-projected-primes #ara-proj-main,
  #ara-phi-projected-primes #ara-proj-zoom { height: 410px; }
  #ara-phi-projected-primes #ara-proj-detail {
    min-height: 1.5rem; margin-top: 0.35rem; color: var(--muted-foreground); font-variant-numeric: tabular-nums;
  }
  #ara-phi-projected-primes .grid-line { stroke: var(--border); stroke-width: 1; }
  #ara-phi-projected-primes .ridge-line { stroke: var(--foreground); stroke-width: 1.25; }
  #ara-phi-projected-primes .ara-line { stroke: var(--viz-series-1); stroke-width: 2.6; fill: none; }
  #ara-phi-projected-primes .phi-line { stroke: var(--viz-series-2); stroke-width: 2.6; fill: none; }
  #ara-phi-projected-primes .projection-line { stroke: var(--muted-foreground); stroke-width: 1; stroke-dasharray: 4 4; }
  #ara-phi-projected-primes .selected-cell { fill: color-mix(in srgb, var(--viz-series-3) 10%, transparent); }
  #ara-phi-projected-primes .crossing-mark { fill: var(--background); stroke: var(--foreground); stroke-width: 2; }
  #ara-phi-projected-primes .prime-mark { fill: var(--viz-series-4); stroke: var(--background); stroke-width: 1; }
  #ara-phi-projected-primes .composite-mark { fill: var(--background); stroke: var(--muted-foreground); stroke-width: 1.2; }
  #ara-phi-projected-primes .phi-end { fill: var(--viz-series-2); stroke: var(--background); stroke-width: 1.5; }
  #ara-phi-projected-primes .ara-end { fill: var(--viz-series-1); stroke: var(--background); stroke-width: 1.5; }
  #ara-phi-projected-primes .selection-line { stroke: var(--foreground); stroke-width: 1; }
  #ara-phi-projected-primes .svg-label { fill: var(--foreground); font-size: 12px; font-weight: 400; }
  #ara-phi-projected-primes .svg-muted { fill: var(--muted-foreground); font-size: 11px; font-weight: 400; }
  #ara-phi-projected-primes .svg-prime { fill: var(--foreground); font-size: 11px; font-weight: 500; }
  @media (max-width: 620px) {
    #ara-phi-projected-primes .ara-proj-layout { grid-template-columns: 1fr; }
    #ara-phi-projected-primes #ara-proj-main { height: 375px; }
    #ara-phi-projected-primes #ara-proj-zoom { height: 350px; }
    #ara-phi-projected-primes .form-label,
    #ara-phi-projected-primes .form-range { width: 100%; min-width: 0; }
  }
</style>

<script>
(() => {
  const root = document.getElementById('ara-phi-projected-primes');
  const mainSvg = root.querySelector('#ara-proj-main');
  const zoomSvg = root.querySelector('#ara-proj-zoom');
  const cellInput = root.querySelector('#ara-proj-cell');
  const cellValue = root.querySelector('#ara-proj-cell-value');
  const rungInput = root.querySelector('#ara-proj-rung');
  const detail = root.querySelector('#ara-proj-detail');
  const NS = 'http://www.w3.org/2000/svg';
  const PHI = (1 + Math.sqrt(5)) / 2;
  const LANES = [1, 7, 11, 13, 17, 19, 23, 29];
  const MR_BASES = [2n, 325n, 9375n, 28178n, 450775n, 9780504n, 1795265022n];
  const primeCache = new Map();

  function el(name, attrs = {}, text = '') {
    const node = document.createElementNS(NS, name);
    Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, String(value)));
    if (text) node.textContent = text;
    return node;
  }
  function reset(svg) {
    Array.from(svg.children).forEach(node => { if (!['title', 'desc'].includes(node.localName)) node.remove(); });
  }
  function orientation() { return Number(rungInput.value) % 2 === 0 ? 1 : -1; }
  function mod2(value) { return ((value % 2) + 2) % 2; }
  function phiPosition(t) { return mod2(orientation() * PHI * t); }
  function starPath(cx, cy, outer = 5.8, inner = 2.6) {
    const points = [];
    for (let i = 0; i < 10; i += 1) {
      const r = i % 2 ? inner : outer;
      const a = -Math.PI / 2 + i * Math.PI / 5;
      points.push(`${(cx + r * Math.cos(a)).toFixed(2)},${(cy + r * Math.sin(a)).toFixed(2)}`);
    }
    return points.join(' ');
  }
  function modPow(base, exponent, modulus) {
    let result = 1n, b = base % modulus, e = exponent;
    while (e > 0n) {
      if (e & 1n) result = result * b % modulus;
      b = b * b % modulus;
      e >>= 1n;
    }
    return result;
  }
  function isPrime(n) {
    const key = n.toString();
    if (primeCache.has(key)) return primeCache.get(key);
    if (n < 2n) return false;
    for (const p of [2n, 3n, 5n, 7n, 11n, 13n, 17n, 19n, 23n, 29n, 31n, 37n]) {
      if (n === p) return true;
      if (n % p === 0n) { primeCache.set(key, false); return false; }
    }
    let d = n - 1n, s = 0;
    while ((d & 1n) === 0n) { d >>= 1n; s += 1; }
    for (const base of MR_BASES) {
      if (base % n === 0n) continue;
      let x = modPow(base, d, n);
      if (x === 1n || x === n - 1n) continue;
      let composite = true;
      for (let r = 1; r < s; r += 1) {
        x = x * x % n;
        if (x === n - 1n) { composite = false; break; }
      }
      if (composite) { primeCache.set(key, false); return false; }
    }
    primeCache.set(key, true);
    return true;
  }
  function firstCellBase() {
    const start = 1n << BigInt(Number(rungInput.value));
    return (start + 29n) / 30n * 30n;
  }
  function cellData(cell) {
    const base = firstCellBase() + BigInt(cell) * 30n;
    return LANES.map(residue => {
      const value = base + BigInt(residue);
      return { residue, value, prime: isPrime(value), u: residue / 30, y: residue / 15 };
    });
  }
  function branchIntervals(start, end) {
    const cuts = [start, end];
    for (let n = Math.floor(start) + 1; n < end; n += 1) cuts.push(n);
    const maxM = Math.ceil(PHI * end / 2) + 1;
    for (let m = 1; m <= maxM; m += 1) {
      const t = 2 * m / PHI;
      if (t > start && t < end) cuts.push(t);
    }
    return [...new Set(cuts.map(v => Number(v.toFixed(12))))].sort((a, b) => a - b)
      .slice(0, -1).map((a, i) => [a, [...new Set(cuts.map(v => Number(v.toFixed(12))))].sort((x, y) => x - y)[i + 1]]);
  }
  function linearBranches(start, end) {
    const cuts = [start, end];
    for (let n = Math.floor(start) + 1; n < end; n += 1) cuts.push(n);
    const maxM = Math.ceil(PHI * end / 2) + 1;
    for (let m = 1; m <= maxM; m += 1) {
      const t = 2 * m / PHI;
      if (t > start && t < end) cuts.push(t);
    }
    const ordered = [...new Set(cuts.map(v => Number(v.toFixed(12))))].sort((a, b) => a - b);
    const branches = [];
    for (let i = 0; i < ordered.length - 1; i += 1) {
      const a = ordered[i], b = ordered[i + 1], mid = (a + b) / 2;
      const cell = Math.floor(mid);
      const sSlope = 2, sIntercept = -2 * cell;
      const signed = orientation() * PHI * mid;
      const wrap = Math.floor(signed / 2);
      const pSlope = orientation() * PHI, pIntercept = -2 * wrap;
      branches.push({ a, b, sSlope, sIntercept, pSlope, pIntercept });
    }
    return branches;
  }
  function crossings(start, end) {
    const roots = [];
    linearBranches(start, end).forEach(branch => {
      const denominator = branch.sSlope - branch.pSlope;
      const t = (branch.pIntercept - branch.sIntercept) / denominator;
      if (t >= branch.a - 1e-9 && t <= branch.b + 1e-9) {
        const y = branch.sSlope * t + branch.sIntercept;
        if (y >= -1e-7 && y <= 2 + 1e-7) roots.push({ t, y: Math.max(0, Math.min(2, y)) });
      }
    });
    const unique = [];
    roots.sort((a, b) => a.t - b.t).forEach(rootPoint => {
      if (!unique.some(existing => Math.abs(existing.t - rootPoint.t) < 1e-6)) unique.push(rootPoint);
    });
    return unique;
  }
  function drawSegmented(svg, branches, xMap, yMap, kind) {
    branches.forEach(branch => {
      const slope = kind === 'ara' ? branch.sSlope : branch.pSlope;
      const intercept = kind === 'ara' ? branch.sIntercept : branch.pIntercept;
      const d = `M${xMap(branch.a).toFixed(2)},${yMap(slope * branch.a + intercept).toFixed(2)}L${xMap(branch.b).toFixed(2)},${yMap(slope * branch.b + intercept).toFixed(2)}`;
      svg.appendChild(el('path', { d, class: kind === 'ara' ? 'ara-line' : 'phi-line' }));
    });
  }

  function drawMain() {
    reset(mainSvg);
    const width = Math.max(360, Math.round(mainSvg.getBoundingClientRect().width || 720));
    const height = Math.round(mainSvg.getBoundingClientRect().height || 410);
    mainSvg.setAttribute('viewBox', `0 0 ${width} ${height}`);
    const margin = { left: 43, right: 18, top: 22, bottom: 47 };
    const plotW = width - margin.left - margin.right;
    const plotH = height - margin.top - margin.bottom;
    const xMap = t => margin.left + t / 8 * plotW;
    const yMap = value => margin.top + (2 - value) / 2 * plotH;
    const selectedCell = Number(cellInput.value);

    mainSvg.appendChild(el('rect', { x: xMap(selectedCell), y: margin.top, width: xMap(selectedCell + 1) - xMap(selectedCell), height: plotH, class: 'selected-cell' }));
    [0, 0.382, 1, PHI, 2].forEach(value => {
      mainSvg.appendChild(el('line', { x1: margin.left, y1: yMap(value), x2: width - margin.right, y2: yMap(value), class: value === 1 ? 'ridge-line' : 'grid-line' }));
      const label = Math.abs(value - PHI) < 0.001 ? 'φ 1.618' : value.toFixed(value === 0 || value === 1 || value === 2 ? 1 : 3);
      mainSvg.appendChild(el('text', { x: margin.left - 7, y: yMap(value) + 4, 'text-anchor': 'end', class: value === 1 ? 'svg-label' : 'svg-muted' }, label));
    });
    for (let cell = 0; cell <= 8; cell += 1) {
      mainSvg.appendChild(el('line', { x1: xMap(cell), y1: margin.top, x2: xMap(cell), y2: height - margin.bottom, class: 'grid-line' }));
      mainSvg.appendChild(el('text', { x: xMap(cell), y: height - 17, 'text-anchor': 'middle', class: 'svg-muted' }, String(cell)));
    }
    mainSvg.appendChild(el('text', { x: 13, y: margin.top + plotH / 2, transform: `rotate(-90 13 ${margin.top + plotH / 2})`, 'text-anchor': 'middle', class: 'svg-label' }, 'Shared ARA coordinate (0–2)'));
    mainSvg.appendChild(el('text', { x: margin.left + plotW / 2, y: height - 2, 'text-anchor': 'middle', class: 'svg-label' }, 'Complete structural cells from octave-rung start'));

    const branches = linearBranches(0, 8);
    drawSegmented(mainSvg, branches, xMap, yMap, 'ara');
    drawSegmented(mainSvg, branches, xMap, yMap, 'phi');

    crossings(0, 8).forEach(crossing => {
      mainSvg.appendChild(el('circle', { cx: xMap(crossing.t), cy: yMap(crossing.y), r: 5, class: 'crossing-mark' }));
    });
    for (let cell = 0; cell < 8; cell += 1) {
      cellData(cell).forEach(item => {
        if (!item.prime) return;
        const star = el('polygon', { points: starPath(xMap(cell + item.u), yMap(item.y)), class: 'prime-mark' });
        star.setAttribute('aria-label', `${item.value} prime`);
        mainSvg.appendChild(star);
      });
    }

    const endpointPhi = orientation() === 1 ? PHI : 2 - PHI;
    mainSvg.appendChild(el('line', { x1: xMap(1), y1: yMap(endpointPhi), x2: xMap(1), y2: yMap(2), class: 'projection-line' }));
    mainSvg.appendChild(el('circle', { cx: xMap(1), cy: yMap(2), r: 5, class: 'ara-end' }));
    mainSvg.appendChild(el('circle', { cx: xMap(1), cy: yMap(endpointPhi), r: 5, class: 'phi-end' }));
    mainSvg.appendChild(el('text', { x: xMap(1) + 7, y: yMap(2) + 13, class: 'svg-label' }, 'ARA = 2'));
    mainSvg.appendChild(el('text', { x: xMap(1) + 7, y: yMap(endpointPhi) - 7, class: 'svg-label' }, orientation() === 1 ? 'Phi = 1.618' : 'mirror = 0.382'));
  }

  function drawZoom() {
    reset(zoomSvg);
    const width = Math.max(270, Math.round(zoomSvg.getBoundingClientRect().width || 310));
    const height = Math.round(zoomSvg.getBoundingClientRect().height || 410);
    zoomSvg.setAttribute('viewBox', `0 0 ${width} ${height}`);
    const margin = { left: 39, right: 16, top: 43, bottom: 47 };
    const plotW = width - margin.left - margin.right;
    const plotH = height - margin.top - margin.bottom;
    const cell = Number(cellInput.value);
    const xMap = t => margin.left + (t - cell) * plotW;
    const yMap = value => margin.top + (2 - value) / 2 * plotH;

    [0, 1, 2].forEach(value => {
      zoomSvg.appendChild(el('line', { x1: margin.left, y1: yMap(value), x2: width - margin.right, y2: yMap(value), class: value === 1 ? 'ridge-line' : 'grid-line' }));
      zoomSvg.appendChild(el('text', { x: margin.left - 7, y: yMap(value) + 4, 'text-anchor': 'end', class: value === 1 ? 'svg-label' : 'svg-muted' }, value.toFixed(1)));
    });
    zoomSvg.appendChild(el('text', { x: width / 2, y: 18, 'text-anchor': 'middle', class: 'svg-label' }, `Cell ${cell}: exact prime positions`));
    zoomSvg.appendChild(el('text', { x: width / 2, y: height - 3, 'text-anchor': 'middle', class: 'svg-label' }, 'Position within structural 0–2 traversal'));

    const branches = linearBranches(cell, cell + 1);
    drawSegmented(zoomSvg, branches, xMap, yMap, 'ara');
    drawSegmented(zoomSvg, branches, xMap, yMap, 'phi');
    crossings(cell, cell + 1).forEach(crossing => {
      zoomSvg.appendChild(el('circle', { cx: xMap(crossing.t), cy: yMap(crossing.y), r: 6, class: 'crossing-mark' }));
      zoomSvg.appendChild(el('text', { x: xMap(crossing.t), y: yMap(crossing.y) - 10, 'text-anchor': 'middle', class: 'svg-label' }, 'cross'));
    });
    cellData(cell).forEach(item => {
      const x = xMap(cell + item.u), y = yMap(item.y);
      if (item.prime) {
        zoomSvg.appendChild(el('polygon', { points: starPath(x, y, 7, 3.1), class: 'prime-mark', 'aria-label': `${item.value} prime` }));
      } else {
        zoomSvg.appendChild(el('circle', { cx: x, cy: y, r: 4, class: 'composite-mark', 'aria-label': `${item.value} composite` }));
      }
      const labelY = item.residue > 20 ? y - 10 : y + 16;
      zoomSvg.appendChild(el('text', { x, y: labelY, 'text-anchor': 'middle', class: item.prime ? 'svg-prime' : 'svg-muted' }, String(item.residue)));
    });
    zoomSvg.appendChild(el('text', { x: margin.left, y: height - 19, class: 'svg-muted' }, 'Lane residue; stars are actual primes'));
  }

  function update() {
    const cell = Number(cellInput.value);
    const primes = cellData(cell).filter(item => item.prime).map(item => item.value.toString());
    const localCrossings = crossings(cell, cell + 1);
    const endpoint = orientation() === 1 ? PHI : 2 - PHI;
    cellValue.textContent = String(cell);
    detail.textContent = `Rung ${rungInput.value} · first-cell endpoint: ARA 2.000, pentagon projection ${endpoint.toFixed(3)} · selected cell crossings: ${localCrossings.length} · exact primes: ${primes.length ? primes.join(', ') : 'none'}`;
    drawMain();
    drawZoom();
  }

  cellInput.addEventListener('input', update);
  rungInput.addEventListener('change', update);
  const resizeObserver = new ResizeObserver(update);
  resizeObserver.observe(root);
  update();
})();
</script>
