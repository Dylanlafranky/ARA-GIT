&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;ara-prime-music-box-lab&#x27;);
  if (!root) return;

  const LIMIT = 5000;
  const SVG_NS = &#x27;http://www.w3.org/2000/svg&#x27;;
  const PRIMORIAL_RUNGS = [
    { n: 30, order: 3, factors: &#x27;2·3·5&#x27; },
    { n: 210, order: 4, factors: &#x27;2·3·5·7&#x27; },
    { n: 2310, order: 5, factors: &#x27;2·3·5·7·11&#x27; },
    { n: 30030, order: 6, factors: &#x27;2·3·5·7·11·13&#x27; }
  ];
  const state = {
    current: 510,
    selected: 510,
    span: 48,
    timer: null,
    playing: false,
    audio: null
  };

  const el = {
    play: root.querySelector(&#x27;#apsr-play&#x27;),
    step: root.querySelector(&#x27;#apsr-step&#x27;),
    reset: root.querySelector(&#x27;#apsr-reset&#x27;),
    jump: root.querySelector(&#x27;#apsr-jump&#x27;),
    go: root.querySelector(&#x27;#apsr-go&#x27;),
    speed: root.querySelector(&#x27;#apsr-speed&#x27;),
    sound: root.querySelector(&#x27;#apsr-sound&#x27;),
    window: root.querySelector(&#x27;#apsr-window&#x27;),
    windowValue: root.querySelector(&#x27;#apsr-window-value&#x27;),
    current: root.querySelector(&#x27;#apsr-current&#x27;),
    status: root.querySelector(&#x27;#apsr-status&#x27;),
    active: root.querySelector(&#x27;#apsr-active&#x27;),
    nextBirth: root.querySelector(&#x27;#apsr-next-birth&#x27;),
    voices: root.querySelector(&#x27;#apsr-voices&#x27;),
    check: root.querySelector(&#x27;#apsr-check&#x27;),
    grid: root.querySelector(&#x27;#apsr-number-grid&#x27;),
    ladderChart: root.querySelector(&#x27;#apsr-ladder-chart&#x27;),
    ladderCaption: root.querySelector(&#x27;#apsr-ladder-caption&#x27;),
    waveChart: root.querySelector(&#x27;#apsr-wave-chart&#x27;),
    waveCaption: root.querySelector(&#x27;#apsr-wave-caption&#x27;),
    factorChart: root.querySelector(&#x27;#apsr-factor-chart&#x27;),
    factorCaption: root.querySelector(&#x27;#apsr-factor-caption&#x27;),
    detail: root.querySelector(&#x27;#apsr-detail&#x27;),
    table: root.querySelector(&#x27;#apsr-collision-table&#x27;)
  };

  function addScheduled(schedule, n, p) {
    if (n &gt; LIMIT) return;
    if (!schedule.has(n)) schedule.set(n, []);
    schedule.get(n).push(p);
  }

  function buildIncrementalSieve(limit) {
    const schedule = new Map();
    const events = new Array(limit + 1);
    const primes = [];
    for (let n = 2; n &lt;= limit; n += 1) {
      const hits = schedule.get(n) ? [...new Set(schedule.get(n))].sort((a, b) =&gt; a - b) : [];
      if (hits.length === 0) {
        primes.push(n);
        addScheduled(schedule, n * n, n);
        events[n] = { n, isPrime: true, hits: [], squareHits: [], least: null };
      } else {
        schedule.delete(n);
        hits.forEach((p) =&gt; addScheduled(schedule, n + p, p));
        const squareHits = hits.filter((p) =&gt; p * p === n);
        events[n] = { n, isPrime: false, hits, squareHits, least: hits[0] };
      }
    }
    return { events, primes };
  }

  function simpleSieve(limit) {
    const prime = new Uint8Array(limit + 1);
    prime.fill(1, 2);
    for (let p = 2; p * p &lt;= limit; p += 1) {
      if (!prime[p]) continue;
      for (let n = p * p; n &lt;= limit; n += p) prime[n] = 0;
    }
    return prime;
  }

  const data = buildIncrementalSieve(LIMIT);
  const independent = simpleSieve(LIMIT);
  const SCALE = [
    { name: &#x27;C&#x27;, semitone: 0 },
    { name: &#x27;D&#x27;, semitone: 2 },
    { name: &#x27;E&#x27;, semitone: 4 },
    { name: &#x27;F&#x27;, semitone: 5 },
    { name: &#x27;G&#x27;, semitone: 7 },
    { name: &#x27;A&#x27;, semitone: 9 },
    { name: &#x27;B&#x27;, semitone: 11 }
  ];
  const primeRank = new Map(data.primes.map((p, index) =&gt; [p, index]));
  const mismatchCount = data.events.reduce((sum, event, n) =&gt; {
    if (n &lt; 2 || !event) return sum;
    return sum + (event.isPrime !== Boolean(independent[n]) ? 1 : 0);
  }, 0);

  function eventAt(n) {
    return data.events[Math.max(2, Math.min(LIMIT, n))];
  }

  function noteForPrime(p) {
    const rank = primeRank.get(p) ?? 0;
    const degree = SCALE[rank % SCALE.length];
    const octaveShift = Math.floor(rank / SCALE.length);
    const octave = 4 + octaveShift;
    const midi = 60 + octaveShift * 12 + degree.semitone;
    const frequency = 440 * (2 ** ((midi - 69) / 12));
    return { name: `${degree.name}${octave}`, frequency, midi };
  }

  function eventNotes(event) {
    return event.hits.map((p) =&gt; noteForPrime(p).name);
  }

  function primesThrough(limit) {
    return data.primes.filter((p) =&gt; p &lt;= limit);
  }

  function araPosition(n, d) {
    if (d === 1) return 0;
    if (d === n) return 2;
    return 2 * Math.log(d) / Math.log(n);
  }

  function factorPairs(n) {
    const pairs = [];
    for (let d = 2; d * d &lt;= n; d += 1) {
      if (n % d === 0) pairs.push([d, n / d]);
    }
    return pairs;
  }

  function childProduct(event) {
    return event.hits.reduce((value, p) =&gt; value * p, 1);
  }

  function nodeGeometry(n, event) {
    const voices = event.hits.length;
    const base = voices ? childProduct(event) : null;
    const primorial = PRIMORIAL_RUNGS.find((rung) =&gt; rung.n === n) || null;
    const fundamental = voices &gt;= 3 &amp;&amp; base === n;
    const repeat = voices &gt;= 3 &amp;&amp; base &lt; n &amp;&amp; n % base === 0;
    return { voices, base, primorial, fundamental, repeat };
  }

  function svgElement(name, attrs = {}) {
    const node = document.createElementNS(SVG_NS, name);
    Object.entries(attrs).forEach(([key, value]) =&gt; node.setAttribute(key, String(value)));
    return node;
  }

  function addText(svg, x, y, textValue, className, anchor = &#x27;middle&#x27;) {
    const textNode = svgElement(&#x27;text&#x27;, { x, y, class: className, &#x27;text-anchor&#x27;: anchor });
    textNode.textContent = textValue;
    svg.appendChild(textNode);
    return textNode;
  }

  function windowBounds() {
    const half = Math.floor(state.span / 2);
    let start = Math.max(2, state.current - half);
    let end = Math.min(LIMIT, start + state.span - 1);
    start = Math.max(2, end - state.span + 1);
    return { start, end };
  }

  function statusText(event) {
    const geometry = nodeGeometry(event.n, event);
    if (event.isPrime) return &#x27;quiet → prime&#x27;;
    if (event.squareHits.length) return `square ridge → composite (${event.squareHits.join(&#x27;, &#x27;)})`;
    if (geometry.primorial) return `primorial rung → ${geometry.voices}-child resonance`;
    if (geometry.fundamental) return `${geometry.voices}-child fundamental resonance`;
    if (geometry.repeat) return `${geometry.voices}-child harmonic repeat of ${geometry.base}`;
    if (event.hits.length &gt; 1) return `${event.hits.length} child waves coincide`;
    return `child p=${event.least} strikes → composite`;
  }

  function nextSquareAfter(n) {
    for (const p of data.primes) {
      if (p * p &gt; n) return { p, square: p * p };
    }
    return null;
  }

  function renderStats() {
    const event = eventAt(state.current);
    const active = primesThrough(Math.floor(Math.sqrt(state.current))).length;
    const next = nextSquareAfter(state.current);
    el.current.textContent = String(state.current);
    const notes = eventNotes(event);
    el.status.textContent = `${statusText(event)} · ${notes.length ? notes.join(&#x27; &#x27;) : &#x27;rest&#x27;}`;
    el.active.textContent = String(active);
    el.nextBirth.textContent = next &amp;&amp; next.square &lt;= LIMIT
      ? `next square ridge: ${next.p}² = ${next.square}`
      : &#x27;next square ridge: beyond range&#x27;;
    el.voices.textContent = String(event.hits.length);
    el.check.textContent = `exact check through ${LIMIT.toLocaleString()}: ${mismatchCount} mismatches`;
  }

  function tileClass(n, event) {
    const geometry = nodeGeometry(n, event);
    if (n &gt; state.current) return &#x27;apsr-future&#x27;;
    if (event.squareHits.length) return &#x27;apsr-square&#x27;;
    if (event.isPrime) return &#x27;apsr-prime&#x27;;
    if (geometry.primorial) return &#x27;apsr-primorial&#x27;;
    if (geometry.fundamental) return &#x27;apsr-resonance&#x27;;
    if (geometry.repeat) return &#x27;apsr-repeat&#x27;;
    return &#x27;apsr-hit&#x27;;
  }

  function tileLabel(n, event) {
    const geometry = nodeGeometry(n, event);
    if (n &gt; state.current) return `${n}, not yet scanned`;
    if (event.isPrime) return `${n}, quiet across active child waves, prime`;
    if (event.squareHits.length) return `${n}, prime-square ridge collision from ${event.squareHits.join(&#x27; and &#x27;)}, composite`;
    if (geometry.primorial) return `${n}, primorial rung, fundamental ${geometry.voices}-child resonance, children ${event.hits.join(&#x27;, &#x27;)}`;
    if (geometry.fundamental) return `${n}, fundamental ${geometry.voices}-child resonance, children ${event.hits.join(&#x27;, &#x27;)}`;
    if (geometry.repeat) return `${n}, harmonic repeat of ${geometry.base}, ${geometry.voices} child phases aligned`;
    return `${n}, composite, struck by prime child waves ${event.hits.join(&#x27;, &#x27;)}`;
  }

  function renderGrid() {
    const { start, end } = windowBounds();
    const fragment = document.createDocumentFragment();
    for (let n = start; n &lt;= end; n += 1) {
      const event = eventAt(n);
      const button = document.createElement(&#x27;button&#x27;);
      button.type = &#x27;button&#x27;;
      button.className = `btn viz-tile ${tileClass(n, event)}${n === state.selected ? &#x27; is-selected&#x27; : &#x27;&#x27;}`;
      button.setAttribute(&#x27;aria-label&#x27;, tileLabel(n, event));
      button.setAttribute(&#x27;aria-pressed&#x27;, n === state.selected ? &#x27;true&#x27; : &#x27;false&#x27;);
      button.dataset.n = String(n);
      button.textContent = String(n);
      fragment.appendChild(button);
    }
    el.grid.replaceChildren(fragment);
  }

  function renderLadder() {
    const width = 900;
    const height = 132;
    const left = 70;
    const right = 100;
    const axisY = 58;
    const minLog = Math.log(PRIMORIAL_RUNGS[0].n);
    const maxLog = Math.log(PRIMORIAL_RUNGS[PRIMORIAL_RUNGS.length - 1].n);
    const x = (n) =&gt; left + ((Math.log(n) - minLog) / (maxLog - minLog)) * (width - left - right);
    const svg = svgElement(&#x27;svg&#x27;, {
      viewBox: `0 0 ${width} ${height}`,
      role: &#x27;img&#x27;,
      &#x27;aria-label&#x27;: `Primorial resonance ladder with current scan at ${state.current}`
    });
    const title = svgElement(&#x27;title&#x27;);
    title.textContent = &#x27;Fundamental primorial resonance ladder&#x27;;
    svg.appendChild(title);
    const desc = svgElement(&#x27;desc&#x27;);
    desc.textContent = &#x27;Successive first full resonances occur at 30, 210, 2310 and 30030 as another prime child joins.&#x27;;
    svg.appendChild(desc);
    svg.appendChild(svgElement(&#x27;line&#x27;, { x1: left, y1: axisY, x2: width - right, y2: axisY, class: &#x27;apsr-axis&#x27; }));

    PRIMORIAL_RUNGS.forEach((rung) =&gt; {
      const px = x(rung.n);
      const reached = rung.n &lt;= state.current;
      const inRange = rung.n &lt;= LIMIT;
      svg.appendChild(svgElement(&#x27;circle&#x27;, {
        cx: px,
        cy: axisY,
        r: reached ? 8 : 6,
        class: reached ? &#x27;apsr-primorial-mark&#x27; : &#x27;apsr-repeat-mark&#x27;
      }));
      addText(svg, px, 31, rung.n.toLocaleString(), &#x27;apsr-axis-label&#x27;);
      addText(svg, px, 88, `${rung.order} children`, &#x27;apsr-axis-label&#x27;);
      addText(svg, px, 110, inRange ? rung.factors : &#x27;next outside range&#x27;, &#x27;apsr-tick-label&#x27;);
    });

    if (state.current &gt;= PRIMORIAL_RUNGS[0].n) {
      const clamped = Math.min(PRIMORIAL_RUNGS[PRIMORIAL_RUNGS.length - 1].n, state.current);
      const nowX = x(clamped);
      svg.appendChild(svgElement(&#x27;line&#x27;, { x1: nowX, y1: 38, x2: nowX, y2: 76, class: &#x27;apsr-now-line&#x27; }));
      addText(svg, nowX, 126, `scan ${state.current.toLocaleString()}`, &#x27;apsr-axis-label&#x27;);
    }

    el.ladderChart.replaceChildren(svg);
    const completed = PRIMORIAL_RUNGS.filter((rung) =&gt; rung.n &lt;= state.current).length;
    const next = PRIMORIAL_RUNGS.find((rung) =&gt; rung.n &gt; state.current);
    el.ladderCaption.textContent = next
      ? `${completed} rung${completed === 1 ? &#x27;&#x27; : &#x27;s&#x27;} reached · next ${next.order}-child closure at ${next.n.toLocaleString()}`
      : `${completed} displayed rungs reached`;
  }

  function renderWaveChart() {
    const { start, end } = windowBounds();
    const lanePrimes = data.primes.filter((p) =&gt; p &lt;= state.current &amp;&amp; p * p &lt;= end);
    const width = 900;
    const left = 98;
    const right = 18;
    const top = 26;
    const rowHeight = 22;
    const bottom = 34;
    const height = Math.max(128, top + lanePrimes.length * rowHeight + bottom);
    const plotWidth = width - left - right;
    const x = (n) =&gt; left + ((n - start) / Math.max(1, end - start)) * plotWidth;
    const svg = svgElement(&#x27;svg&#x27;, {
      viewBox: `0 0 ${width} ${height}`,
      role: &#x27;img&#x27;,
      &#x27;aria-label&#x27;: `Prime child-wave strikes from ${start} through ${end}; current scan node ${state.current}`
    });
    const title = svgElement(&#x27;title&#x27;);
    title.textContent = `Prime child waves, ${start} to ${end}`;
    svg.appendChild(title);
    const desc = svgElement(&#x27;desc&#x27;);
    desc.textContent = &#x27;Each lane is one prime period assigned to an ascending musical note. Diamonds are square activations, filled resonance marks are fundamental shared cycles, and rings are harmonic repeats.&#x27;;
    svg.appendChild(desc);

    const tickCount = Math.min(8, Math.max(3, Math.floor(state.span / 8)));
    for (let i = 0; i &lt;= tickCount; i += 1) {
      const value = Math.round(start + (i / tickCount) * (end - start));
      const px = x(value);
      svg.appendChild(svgElement(&#x27;line&#x27;, { x1: px, y1: top - 8, x2: px, y2: height - bottom + 4, class: &#x27;apsr-grid-line&#x27; }));
      addText(svg, px, height - 10, String(value), &#x27;apsr-tick-label&#x27;);
    }

    for (let n = start; n &lt;= Math.min(end, state.current); n += 1) {
      const geometry = nodeGeometry(n, eventAt(n));
      if (!geometry.fundamental) continue;
      const px = x(n);
      const lineClass = geometry.primorial ? &#x27;apsr-primorial-line&#x27; : &#x27;apsr-resonance-line&#x27;;
      svg.appendChild(svgElement(&#x27;line&#x27;, { x1: px, y1: top - 8, x2: px, y2: height - bottom + 4, class: lineClass }));
      if (n !== state.current) {
        addText(svg, px, top - 12, `${geometry.primorial ? &#x27;P&#x27; : &#x27;R&#x27;}${geometry.voices}`, &#x27;apsr-axis-label&#x27;);
      }
    }

    lanePrimes.forEach((p, index) =&gt; {
      const y = top + index * rowHeight;
      svg.appendChild(svgElement(&#x27;line&#x27;, { x1: left, y1: y, x2: width - right, y2: y, class: &#x27;apsr-wave-line&#x27; }));
      addText(svg, left - 10, y + 4, `p=${p} · ${noteForPrime(p).name}`, &#x27;apsr-lane-label&#x27;, &#x27;end&#x27;);
      let first = Math.max(p * p, Math.ceil(start / p) * p);
      for (let n = first; n &lt;= end; n += p) {
        const px = x(n);
        const isSquare = n === p * p;
        const geometry = nodeGeometry(n, eventAt(n));
        const geometryKnown = eventAt(n).hits.every((q) =&gt; q &lt;= state.current);
        if (isSquare) {
          const diamond = svgElement(&#x27;rect&#x27;, {
            x: px - 5,
            y: y - 5,
            width: 10,
            height: 10,
            class: &#x27;apsr-square-mark&#x27;,
            transform: `rotate(45 ${px} ${y})`
          });
          svg.appendChild(diamond);
        } else if (geometryKnown &amp;&amp; geometry.primorial) {
          svg.appendChild(svgElement(&#x27;rect&#x27;, { x: px - 5, y: y - 5, width: 10, height: 10, class: &#x27;apsr-primorial-mark&#x27; }));
        } else if (geometryKnown &amp;&amp; geometry.fundamental) {
          svg.appendChild(svgElement(&#x27;circle&#x27;, { cx: px, cy: y, r: 5, class: &#x27;apsr-resonance-mark&#x27; }));
        } else if (geometryKnown &amp;&amp; geometry.repeat) {
          svg.appendChild(svgElement(&#x27;circle&#x27;, { cx: px, cy: y, r: 4.5, class: &#x27;apsr-repeat-mark&#x27; }));
        } else {
          svg.appendChild(svgElement(&#x27;circle&#x27;, { cx: px, cy: y, r: 3.4, class: &#x27;apsr-hit-mark&#x27; }));
        }
        if (n === state.selected) {
          svg.appendChild(svgElement(&#x27;circle&#x27;, { cx: px, cy: y, r: 7, class: &#x27;apsr-selected-ring&#x27; }));
        }
      }
    });

    if (state.current &gt;= start &amp;&amp; state.current &lt;= end) {
      const nowX = x(state.current);
      const nowGeometry = nodeGeometry(state.current, eventAt(state.current));
      const nowPrefix = nowGeometry.primorial
        ? `P${nowGeometry.voices} · `
        : nowGeometry.fundamental
          ? `R${nowGeometry.voices} · `
          : nowGeometry.repeat
            ? `H${nowGeometry.voices} · `
            : &#x27;&#x27;;
      svg.appendChild(svgElement(&#x27;line&#x27;, { x1: nowX, y1: top - 14, x2: nowX, y2: height - bottom + 5, class: &#x27;apsr-now-line&#x27; }));
      addText(svg, nowX, 14, `${nowPrefix}now ${state.current}`, &#x27;apsr-axis-label&#x27;);
    }
    el.waveChart.replaceChildren(svg);
    const latent = data.primes.filter((p) =&gt; p &lt;= state.current &amp;&amp; p * p &gt; state.current).length;
    const firstNote = lanePrimes.length ? noteForPrime(lanePrimes[0]).name : &#x27;—&#x27;;
    const lastNote = lanePrimes.length ? noteForPrime(lanePrimes[lanePrimes.length - 1]).name : &#x27;—&#x27;;
    el.waveCaption.textContent = `${lanePrimes.length} visible periods · notes ${firstNote}–${lastNote} · ${latent} discovered children still latent above their p² boundary`;
  }

  function renderFactorChart() {
    const n = state.selected;
    const event = eventAt(n);
    const geometry = nodeGeometry(n, event);
    const pairs = factorPairs(n);
    const gates = primesThrough(Math.floor(Math.sqrt(n)));
    const width = 900;
    const height = 150;
    const left = 44;
    const right = 44;
    const axisY = 78;
    const x = (value) =&gt; left + (value / 2) * (width - left - right);
    const svg = svgElement(&#x27;svg&#x27;, {
      viewBox: `0 0 ${width} ${height}`,
      role: &#x27;img&#x27;,
      &#x27;aria-label&#x27;: `ARA factor diameter for selected node ${n}`
    });
    const title = svgElement(&#x27;title&#x27;);
    title.textContent = `Factor diameter for ${n}`;
    svg.appendChild(title);
    const desc = svgElement(&#x27;desc&#x27;);
    desc.textContent = event.isPrime
      ? &#x27;No tested prime gate collides before the factor ridge.&#x27;
      : &#x27;Interior factor collisions appear with their reflected partners across the ridge.&#x27;;
    svg.appendChild(desc);

    svg.appendChild(svgElement(&#x27;line&#x27;, { x1: left, y1: axisY, x2: width - right, y2: axisY, class: &#x27;apsr-axis&#x27; }));
    svg.appendChild(svgElement(&#x27;line&#x27;, { x1: x(1), y1: 25, x2: x(1), y2: 122, class: &#x27;apsr-ridge-line&#x27; }));
    [0, 0.5, 1, 1.5, 2].forEach((value) =&gt; {
      const px = x(value);
      svg.appendChild(svgElement(&#x27;line&#x27;, { x1: px, y1: axisY - 5, x2: px, y2: axisY + 5, class: value === 1 ? &#x27;apsr-ridge-line&#x27; : &#x27;apsr-axis&#x27; }));
      addText(svg, px, 137, value === 1 ? &#x27;1.0 ridge&#x27; : value.toFixed(1), &#x27;apsr-tick-label&#x27;);
    });

    svg.appendChild(svgElement(&#x27;circle&#x27;, { cx: x(0), cy: axisY, r: 5, class: &#x27;apsr-endpoint-mark&#x27; }));
    svg.appendChild(svgElement(&#x27;circle&#x27;, { cx: x(2), cy: axisY, r: 5, class: &#x27;apsr-endpoint-mark&#x27; }));
    addText(svg, x(0), 54, &#x27;1&#x27;, &#x27;apsr-axis-label&#x27;);
    addText(svg, x(2), 54, String(n), &#x27;apsr-axis-label&#x27;);

    gates.forEach((p, index) =&gt; {
      const value = araPosition(n, p);
      const px = x(value);
      const divides = n % p === 0;
      const cy = divides ? 78 : 92 + (index % 2) * 8;
      let collisionClass = &#x27;apsr-hit-mark&#x27;;
      if (p * p === n) collisionClass = &#x27;apsr-square-mark&#x27;;
      else if (geometry.primorial) collisionClass = &#x27;apsr-primorial-mark&#x27;;
      else if (geometry.fundamental) collisionClass = &#x27;apsr-resonance-mark&#x27;;
      else if (geometry.repeat) collisionClass = &#x27;apsr-repeat-mark&#x27;;
      svg.appendChild(svgElement(&#x27;circle&#x27;, {
        cx: px,
        cy,
        r: divides ? 5.5 : 2.5,
        class: divides ? collisionClass : &#x27;apsr-gate-mark&#x27;
      }));
      if (divides) {
        const partner = n / p;
        const partnerValue = araPosition(n, partner);
        const partnerX = x(partnerValue);
        svg.appendChild(svgElement(&#x27;line&#x27;, { x1: px, y1: 72, x2: partnerX, y2: 72, class: &#x27;apsr-axis&#x27; }));
        if (partner !== p) svg.appendChild(svgElement(&#x27;circle&#x27;, { cx: partnerX, cy: 78, r: 5.5, class: collisionClass }));
        addText(svg, px, 45, String(p), &#x27;apsr-axis-label&#x27;);
        if (partner !== p) addText(svg, partnerX, 45, String(partner), &#x27;apsr-axis-label&#x27;);
      }
    });

    el.factorChart.replaceChildren(svg);
    const childSum = event.hits.reduce((sum, p) =&gt; sum + araPosition(n, p), 0);
    if (event.isPrime) {
      el.factorCaption.textContent = `${gates.length} prime gates tested through √${n}; no interior collision`;
    } else if (geometry.primorial) {
      el.factorCaption.textContent = `primorial ${geometry.voices}-child rung · collective ARA sum ${childSum.toFixed(6)}`;
    } else if (geometry.fundamental) {
      el.factorCaption.textContent = `fundamental ${geometry.voices}-child resonance · collective ARA sum ${childSum.toFixed(6)}`;
    } else if (geometry.repeat) {
      el.factorCaption.textContent = `harmonic repeat of ${geometry.base} · collective ARA sum ${childSum.toFixed(6)}`;
    } else {
      el.factorCaption.textContent = `${pairs.length} factor-pair${pairs.length === 1 ? &#x27;&#x27; : &#x27;s&#x27;} visible; least collision p=${event.least}`;
    }
  }

  function renderDetail() {
    const n = state.selected;
    const event = eventAt(n);
    const geometry = nodeGeometry(n, event);
    const pairs = factorPairs(n);
    if (event.isPrime) {
      const square = n * n;
      el.detail.textContent = `${n} is quiet across every active child wave. It becomes a new prime identity; its p=${n} child wave first becomes relevant at ${n}² = ${square.toLocaleString()}${square &gt; LIMIT ? &#x27; (outside this instrument’s range)&#x27; : &#x27;&#x27;}.`;
    } else if (event.squareHits.length) {
      const p = event.squareHits[0];
      el.detail.textContent = `${n} is the first new strike of child p=${p}. Its factor and reflected partner meet exactly at the 1.0 square ridge.`;
    } else if (geometry.primorial) {
      el.detail.textContent = `${n} is the first ${geometry.voices}-child primorial resonance rung. Children ${event.hits.join(&#x27;, &#x27;)} phase-lock at one fundamental shared cycle and their ARA positions sum to 2.`;
    } else if (geometry.fundamental) {
      el.detail.textContent = `${n} is a fundamental ${geometry.voices}-child resonance. Children ${event.hits.join(&#x27;, &#x27;)} phase-lock for the first time as this exact set, and their ARA positions sum to 2.`;
    } else if (geometry.repeat) {
      const childSum = event.hits.reduce((sum, p) =&gt; sum + araPosition(n, p), 0);
      el.detail.textContent = `${n} is a harmonic repeat of fundamental child product ${geometry.base}. The same ${geometry.voices} phases align again, while their parent-relative ARA sum has fallen to ${childSum.toFixed(6)}.`;
    } else {
      const factorText = pairs.map(([a, b]) =&gt; `${a}×${b}`).join(&#x27;, &#x27;);
      el.detail.textContent = `${n} is struck by ${event.hits.length} active child wave${event.hits.length === 1 ? &#x27;&#x27; : &#x27;s&#x27;}: ${event.hits.join(&#x27;, &#x27;)}. Factor closure: ${factorText}.`;
    }

    const rows = [];
    const relevant = event.isPrime ? [n] : event.hits;
    relevant.forEach((p) =&gt; {
      const tr = document.createElement(&#x27;tr&#x27;);
      const first = p * p;
      const step = event.isPrime ? &#x27;latent&#x27; : String((n - first) / p);
      const position = event.isPrime ? &#x27;—&#x27; : araPosition(n, p).toFixed(6);
      let role = &#x27;periodic child collision&#x27;;
      if (event.isPrime) role = &#x27;new child; not active until p²&#x27;;
      else if (p * p === n) role = &#x27;first strike / exact 1.0 ridge&#x27;;
      else if (geometry.primorial) role = `primorial resonance voice / order ${geometry.voices}`;
      else if (geometry.fundamental) role = `fundamental resonance voice / order ${geometry.voices}`;
      else if (geometry.repeat) role = `harmonic repeat voice / base ${geometry.base}`;
      [
        { value: `p=${p}`, cls: &#x27;&#x27; },
        { value: event.isPrime ? &#x27;latent&#x27; : noteForPrime(p).name, cls: &#x27;&#x27; },
        { value: first.toLocaleString(), cls: &#x27;text-end&#x27; },
        { value: step, cls: &#x27;text-end&#x27; },
        { value: position, cls: &#x27;text-end&#x27; },
        { value: role, cls: &#x27;&#x27; }
      ].forEach(({ value, cls }) =&gt; {
        const td = document.createElement(&#x27;td&#x27;);
        if (cls) td.className = cls;
        td.textContent = value;
        tr.appendChild(td);
      });
      rows.push(tr);
    });
    if (rows.length === 0) {
      const tr = document.createElement(&#x27;tr&#x27;);
      const td = document.createElement(&#x27;td&#x27;);
      td.colSpan = 6;
      td.className = &#x27;apsr-empty-row&#x27;;
      td.textContent = &#x27;No child-wave collision at this node.&#x27;;
      tr.appendChild(td);
      rows.push(tr);
    }
    el.table.replaceChildren(...rows);
  }

  function renderAll() {
    renderStats();
    renderGrid();
    renderLadder();
    renderWaveChart();
    renderFactorChart();
    renderDetail();
  }

  function ensureAudio() {
    const AudioEngine = window.AudioContext || window.webkitAudioContext;
    if (!AudioEngine) return null;
    if (!state.audio) state.audio = new AudioEngine();
    if (state.audio.state === &#x27;suspended&#x27;) state.audio.resume();
    return state.audio;
  }

  function strikeMusicBoxNote(p, delaySeconds) {
    const context = ensureAudio();
    if (!context) return;
    const note = noteForPrime(p);
    const startAt = context.currentTime + delaySeconds;
    const stopAt = startAt + 0.72;
    const envelope = context.createGain();
    const fundamental = context.createOscillator();
    const overtone = context.createOscillator();
    const overtoneGain = context.createGain();

    fundamental.type = &#x27;sine&#x27;;
    fundamental.frequency.setValueAtTime(note.frequency, startAt);
    overtone.type = &#x27;sine&#x27;;
    overtone.frequency.setValueAtTime(note.frequency * 2.01, startAt);
    overtoneGain.gain.setValueAtTime(0.19, startAt);
    envelope.gain.setValueAtTime(0.0001, startAt);
    envelope.gain.exponentialRampToValueAtTime(0.105, startAt + 0.008);
    envelope.gain.exponentialRampToValueAtTime(0.0001, stopAt);

    fundamental.connect(envelope);
    overtone.connect(overtoneGain);
    overtoneGain.connect(envelope);
    envelope.connect(context.destination);
    fundamental.start(startAt);
    overtone.start(startAt);
    fundamental.stop(stopAt);
    overtone.stop(stopAt);

    if (!el.sound.checked || !event || event.hits.length === 0) return;
    ensureAudio();
    const arpeggioStep = Number(el.speed.value) &lt;= 100 ? 0.018 : 0.045;

  function start() {
    stop();

    state.selected = value;
    el.jump.value = String(value);
    renderAll();
    playEventNotes(eventAt(value));

    if (state.playing) stop();

  });
  el.step.addEventListener(&#x27;click&#x27;, () =&gt; {
    stop();
    advance();
  });
  el.reset.addEventListener(&#x27;click&#x27;, () =&gt; {
    stop();
    state.current = 2;
    state.selected = 2;
    el.jump.value = &#x27;2&#x27;;
    renderAll();
  });
  el.go.addEventListener(&#x27;click&#x27;, jumpToInput);
  el.jump.addEventListener(&#x27;keydown&#x27;, (event) =&gt; {
    if (event.key === &#x27;Enter&#x27;) jumpToInput();
  });
  el.speed.addEventListener(&#x27;change&#x27;, () =&gt; {
    if (state.playing) start();
  });
  el.sound.addEventListener(&#x27;change&#x27;, () =&gt; {
    if (el.sound.checked) playEventNotes(eventAt(state.selected));
  });
  el.window.addEventListener(&#x27;input&#x27;, () =&gt; {
    state.span = Number(el.window.value);
    el.windowValue.textContent = String(state.span);
    renderGrid();
    renderWaveChart();
  });
  el.grid.addEventListener(&#x27;click&#x27;, (event) =&gt; {
    const button = event.target.closest(&#x27;button[data-n]&#x27;);
    if (!button || !el.grid.contains(button)) return;
    state.selected = Number(button.dataset.n);
    renderGrid();
    renderWaveChart();
    renderFactorChart();
    renderDetail();
    playEventNotes(eventAt(state.selected));
  });

  window.__ARA_PRIME_SQUARE_RIDGE_LAB__ = {
    limit: LIMIT,
    mismatchCount,
    primeCount: data.primes.length,
    eventAt: (n) =&gt; ({ ...eventAt(n), hits: [...eventAt(n).hits], squareHits: [...eventAt(n).squareHits] }),
    araPosition,
    noteForPrime: (p) =&gt; ({ ...noteForPrime(p) })
  };

  renderAll();
})();

&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;

    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);

      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)

    );

            );

              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,

      .then(({ x, y }) =&gt; {

        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {

    }

  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;

    const trigger = getTrigger(event.target);

    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {

    }
  };

    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);

  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
