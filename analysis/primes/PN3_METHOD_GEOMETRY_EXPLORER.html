  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

      });
    });

    setLegend(series.map(item =&gt; ({ label: item.label, color: item.color, dashed: item.key === &#x27;parent&#x27; })));
    detail.textContent = state.blockMode === &#x27;redistribution&#x27;
      ? &#x27;The observed line is the redistribution the parent needed; compare its shape with the ARA and raw child lines.&#x27;
      : state.blockMode === &#x27;residual&#x27;
        ? &#x27;Zero is exact block calibration; lines below zero under-predict the observed block.&#x27;
        : &#x27;Absolute survival rate in each of 40 equal target blocks.&#x27;;
    return svg;
  }

  function signedFill(value, maximum) {
    if (!Number.isFinite(value) || maximum &lt;= 0) return { color: &#x27;var(--muted)&#x27;, opacity: 0.08 };
    const strength = clamp(Math.sqrt(Math.abs(value) / maximum), 0, 1);
    if (Math.abs(value) &lt; maximum * 0.005) return { color: &#x27;var(--muted)&#x27;, opacity: 0.10 };
    return {
      color: value &lt; 0 ? &#x27;var(--viz-series-1)&#x27; : &#x27;var(--viz-series-2)&#x27;,
      opacity: 0.12 + 0.78 * strength
    };
  }

  function renderPlane(width) {
    const projection = state.task === &#x27;edge&#x27; ? &#x27;current_next&#x27; : state.projection;
    const cells = DATA.planes[state.task][projection];
    const metrics = [
      { key: &#x27;observed_from_parent&#x27;, title: &#x27;Observed − ARA parent&#x27; },
      { key: &#x27;ara_from_parent&#x27;, title: `${LABELS[state.task].ara} − parent` },
      { key: &#x27;remaining_after_ara&#x27;, title: `Observed − ${LABELS[state.task].ara}` },
      { key: &#x27;remaining_after_established&#x27;, title: `Observed − ${LABELS[state.task].established}` }
    ];
    const columns = width &gt;= 620 ? 2 : 1;
    const rows = Math.ceil(metrics.length / columns);
    const facetWidth = width / columns;
    const facetHeight = columns === 2 ? 282 : 300;
    const height = rows * facetHeight + 28;
    const svg = makeSvg(width, height, &#x27;ARA relation-plane residuals&#x27;, &#x27;Four aligned 12 by 12 ARA relation planes comparing observed redistribution, ARA redistribution, remaining ARA error, and established-model error.&#x27;);
    const eligibleValues = metrics.flatMap(metric =&gt; cells.filter(cell =&gt; cell.count &gt;= state.minimumCount).map(cell =&gt; Math.abs(cell[metric.key])).filter(Number.isFinite));
    const maximum = Math.max(...eligibleValues, 1e-12);

    metrics.forEach((metric, metricIndex) =&gt; {
      const column = metricIndex % columns;
      const row = Math.floor(metricIndex / columns);
      const originX = column * facetWidth;
      const originY = row * facetHeight;
      const box = { left: originX + 43, right: originX + facetWidth - 18, top: originY + 31, bottom: originY + facetHeight - 42 };
      const cellWidth = (box.right - box.left) / 12;
      const cellHeight = (box.bottom - box.top) / 12;
      const title = svgEl(&#x27;text&#x27;, { class: &#x27;pn3-facet-title&#x27;, x: originX + facetWidth / 2, y: originY + 17, &#x27;text-anchor&#x27;: &#x27;middle&#x27; }, svg);
      title.textContent = metric.title;

      cells.forEach(cell =&gt; {
        const x = box.left + cell.x * cellWidth;
        const y = box.bottom - (cell.y + 1) * cellHeight;
        const display = cell.count &gt;= state.minimumCount ? signedFill(cell[metric.key], maximum) : { color: &#x27;var(--muted)&#x27;, opacity: 0.045 };
        const rect = svgEl(&#x27;rect&#x27;, {
          x, y, width: cellWidth + 0.2, height: cellHeight + 0.2,
          fill: display.color, &#x27;fill-opacity&#x27;: display.opacity
        }, svg);
        const titleNode = svgEl(&#x27;title&#x27;, {}, rect);
        titleNode.textContent = `${metric.title}; x ${cell.x0.toFixed(2)}–${cell.x1.toFixed(2)}, y ${cell.y0.toFixed(2)}–${cell.y1.toFixed(2)}; ${formatPP(cell[metric.key])}; n=${cell.count}`;
        rect.addEventListener(&#x27;mouseenter&#x27;, () =&gt; {
          detail.textContent = `ARA x ${cell.x0.toFixed(2)}–${cell.x1.toFixed(2)} · y ${cell.y0.toFixed(2)}–${cell.y1.toFixed(2)} · n=${compact(cell.count)} · observed ${formatRate(cell.actual)} · parent ${formatRate(cell.parent)} · ARA ${formatRate(cell.ara)} · raw ${formatRate(cell.raw)} · ${LABELS[state.task].established} ${formatRate(cell.established)}`;
        });
      });

      const ridgeX = box.left + 6 * cellWidth;
      const ridgeY = box.bottom - 6 * cellHeight;
      svgEl(&#x27;line&#x27;, { class: &#x27;pn3-ridge&#x27;, x1: ridgeX, x2: ridgeX, y1: box.top, y2: box.bottom }, svg);
      svgEl(&#x27;line&#x27;, { class: &#x27;pn3-ridge&#x27;, x1: box.left, x2: box.right, y1: ridgeY, y2: ridgeY }, svg);
      [0, 1, 2].forEach(value =&gt; {
        const tx = box.left + value / 2 * (box.right - box.left);
        const ty = box.bottom - value / 2 * (box.bottom - box.top);
        const xt = svgEl(&#x27;text&#x27;, { class: &#x27;pn3-tick&#x27;, x: tx, y: box.bottom + 18, &#x27;text-anchor&#x27;: &#x27;middle&#x27; }, svg);
        xt.textContent = value.toFixed(1);
        const yt = svgEl(&#x27;text&#x27;, { class: &#x27;pn3-tick&#x27;, x: box.left - 7, y: ty + 4, &#x27;text-anchor&#x27;: &#x27;end&#x27; }, svg);
        yt.textContent = value.toFixed(1);
      });
      svgEl(&#x27;line&#x27;, { class: &#x27;pn3-axis&#x27;, x1: box.left, x2: box.right, y1: box.bottom, y2: box.bottom }, svg);
      svgEl(&#x27;line&#x27;, { class: &#x27;pn3-axis&#x27;, x1: box.left, x2: box.left, y1: box.top, y2: box.bottom }, svg);
    });

    setLegend([
      { label: `Negative residual (shared scale ±${formatPP(maximum)})`, color: &#x27;var(--viz-series-1)&#x27; },
      { label: &#x27;Near zero&#x27;, color: &#x27;var(--muted)&#x27; },
      { label: &#x27;Positive residual&#x27;, color: &#x27;var(--viz-series-2)&#x27; },
      { label: &#x27;Dark cross = ARA 1.0 ridges&#x27;, color: COLORS.actual }
    ]);
    detail.textContent = `${projection === &#x27;prev_current&#x27; ? &#x27;Previous → current&#x27; : &#x27;Current → next&#x27;} ARA projection; cells below ${compact(state.minimumCount)} events are muted.`;
    return svg;
  }

  function gapSeries(rows) {
    if (state.gapMode === &#x27;rate&#x27;) {
      return [
        { key: &#x27;actual&#x27;, label: &#x27;Observed&#x27;, color: COLORS.actual, values: rows.map(row =&gt; row.actual) },
        { key: &#x27;parent&#x27;, label: &#x27;ARA parent&#x27;, color: COLORS.parent, values: rows.map(row =&gt; row.parent) },
        { key: &#x27;ara&#x27;, label: &#x27;ARA endpoints&#x27;, color: COLORS.ara, values: rows.map(row =&gt; row.ara) },
        { key: &#x27;raw&#x27;, label: &#x27;Raw edge&#x27;, color: COLORS.raw, values: rows.map(row =&gt; row.raw) },
        { key: &#x27;established&#x27;, label: &#x27;Conditional HL29&#x27;, color: COLORS.established, values: rows.map(row =&gt; row.established) }
      ];
    }
    return [
      { key: &#x27;actual&#x27;, label: &#x27;Observed − parent&#x27;, color: COLORS.actual, values: rows.map(row =&gt; row.actual - row.parent) },
      { key: &#x27;ara&#x27;, label: &#x27;ARA endpoints − parent&#x27;, color: COLORS.ara, values: rows.map(row =&gt; row.ara - row.parent) },
      { key: &#x27;raw&#x27;, label: &#x27;Raw edge − parent&#x27;, color: COLORS.raw, values: rows.map(row =&gt; row.raw - row.parent) },
      { key: &#x27;established&#x27;, label: &#x27;Conditional HL29 − parent&#x27;, color: COLORS.established, values: rows.map(row =&gt; row.established - row.parent) }
    ];
  }

  function renderGaps(width) {
    const height = 420;
    const svg = makeSvg(width, height, &#x27;Gap-class method shapes&#x27;, &#x27;Observed and predicted adjacent-prime-pair survival across p29-wheel gap classes.&#x27;);
    const box = { left: 64, right: width - 24, top: 22, bottom: height - 54 };
    const rows = DATA.gaps;
    const series = gapSeries(rows);
    const allValues = series.flatMap(item =&gt; item.values);
    const symmetric = state.gapMode !== &#x27;rate&#x27;;
    const domain = paddedDomain(allValues, symmetric);
    const maxGap = Math.max(...rows.map(row =&gt; row.gap));
    const x = linearScale(0, maxGap, box.left, box.right);
    const y = linearScale(domain[0], domain[1], box.bottom, box.top);
    const yTicks = Array.from({ length: 5 }, (_, index) =&gt; domain[0] + (domain[1] - domain[0]) * index / 4);
    const gapTicks = [0, 10, 20, 30, 40].filter(value =&gt; value &lt;= maxGap);
    if (maxGap &gt; 40) gapTicks.push(maxGap);
    drawAxes(svg, box, gapTicks, yTicks, x, y, state.gapMode === &#x27;rate&#x27; ? formatRate : formatPP, value =&gt; String(value));
    if (symmetric) svgEl(&#x27;line&#x27;, { class: &#x27;pn3-zero&#x27;, x1: box.left, x2: box.right, y1: y(0), y2: y(0) }, svg);

    series.forEach(item =&gt; {
      const points = rows.map((row, index) =&gt; [x(row.gap), y(item.values[index])]);
      svgEl(&#x27;path&#x27;, { class: &#x27;pn3-series&#x27;, d: linePath(points), stroke: item.color, &#x27;stroke-dasharray&#x27;: item.key === &#x27;parent&#x27; ? &#x27;5 4&#x27; : null }, svg);
      points.forEach((point, index) =&gt; {
        const radius = item.key === &#x27;actual&#x27; ? clamp(2 + Math.sqrt(rows[index].events) / 260, 2.2, 5.2) : 2.2;
        svgEl(&#x27;circle&#x27;, { class: &#x27;pn3-point&#x27;, cx: point[0], cy: point[1], r: radius, fill: item.color, &#x27;fill-opacity&#x27;: item.key === &#x27;actual&#x27; ? 0.9 : 0.65 }, svg);
      });
    });

    rows.forEach((row, index) =&gt; {
      const previous = index === 0 ? 0 : (rows[index - 1].gap + row.gap) / 2;
      const next = index === rows.length - 1 ? maxGap : (row.gap + rows[index + 1].gap) / 2;
      const hit = svgEl(&#x27;rect&#x27;, { class: &#x27;pn3-hit&#x27;, x: x(previous), y: box.top, width: Math.max(2, x(next) - x(previous)), height: box.bottom - box.top }, svg);
      hit.addEventListener(&#x27;mouseenter&#x27;, () =&gt; {
        detail.textContent = `Gap ${row.gap} · n=${compact(row.events)} · observed ${formatRate(row.actual)} · parent ${formatRate(row.parent)} · ARA ${formatRate(row.ara)} · raw ${formatRate(row.raw)} · HL29 ${formatRate(row.established)}`;
      });
    });

    setLegend(series.map(item =&gt; ({ label: item.label, color: item.color, dashed: item.key === &#x27;parent&#x27; })));
    detail.textContent = state.gapMode === &#x27;rate&#x27;
      ? &#x27;Point size follows event count; sparse large-gap classes are visibly noisier.&#x27;
      : &#x27;Compare the observed gap-class deformation with the redistribution proposed by ARA, raw gaps, and HL29.&#x27;;
    return svg;
  }

  function updateControls() {
    root.querySelectorAll(&#x27;[data-view]&#x27;).forEach(button =&gt; {
      const active = button.dataset.view === state.view;
      button.classList.toggle(&#x27;btn-primary&#x27;, active);
      button.setAttribute(&#x27;aria-pressed&#x27;, active ? &#x27;true&#x27; : &#x27;false&#x27;);
    });
    const parent = state.view === &#x27;parent&#x27;;
    const blocks = state.view === &#x27;blocks&#x27;;
    const plane = state.view === &#x27;plane&#x27;;
    const gaps = state.view === &#x27;gaps&#x27;;
    root.querySelector(&#x27;#pn3-scale-wrap&#x27;).hidden = !parent;
    root.querySelector(&#x27;#pn3-block-mode-wrap&#x27;).hidden = !blocks;
    root.querySelector(&#x27;#pn3-projection-wrap&#x27;).hidden = !plane;
    root.querySelector(&#x27;#pn3-count-wrap&#x27;).hidden = !plane;
    root.querySelector(&#x27;#pn3-gap-mode-wrap&#x27;).hidden = !gaps;
    if (gaps) {
      state.task = &#x27;edge&#x27;;
      taskSelect.value = &#x27;edge&#x27;;
    }
    taskSelect.disabled = gaps;
    projectionSelect.disabled = state.task === &#x27;edge&#x27;;
    if (state.task === &#x27;edge&#x27;) {
      state.projection = &#x27;current_next&#x27;;
      projectionSelect.value = &#x27;current_next&#x27;;
    }
  }

  function render() {
    updateControls();
    const width = Math.max(320, Math.round(root.getBoundingClientRect().width || 736));
    plot.innerHTML = &#x27;&#x27;;
    let svg;
    if (state.view === &#x27;parent&#x27;) svg = renderParent(width);
    else if (state.view === &#x27;blocks&#x27;) svg = renderBlocks(width);
    else if (state.view === &#x27;plane&#x27;) svg = renderPlane(width);
    else svg = renderGaps(width);
    plot.appendChild(svg);
  }

  root.querySelectorAll(&#x27;[data-view]&#x27;).forEach(button =&gt; {
    button.addEventListener(&#x27;click&#x27;, () =&gt; {
      state.view = button.dataset.view;
      render();
    });
  });
  taskSelect.addEventListener(&#x27;change&#x27;, () =&gt; { state.task = taskSelect.value; render(); });
  scaleSelect.addEventListener(&#x27;change&#x27;, () =&gt; { state.parentScale = scaleSelect.value; render(); });
  blockModeSelect.addEventListener(&#x27;change&#x27;, () =&gt; { state.blockMode = blockModeSelect.value; render(); });
  projectionSelect.addEventListener(&#x27;change&#x27;, () =&gt; { state.projection = projectionSelect.value; render(); });
  gapModeSelect.addEventListener(&#x27;change&#x27;, () =&gt; { state.gapMode = gapModeSelect.value; render(); });
  countInput.addEventListener(&#x27;input&#x27;, () =&gt; {
    state.minimumCount = Number(countInput.value);
    countValue.textContent = compact(state.minimumCount);
    render();
  });

  let resizeFrame = 0;
  if (window.ResizeObserver) {
    const observer = new ResizeObserver(() =&gt; {
      cancelAnimationFrame(resizeFrame);
      resizeFrame = requestAnimationFrame(render);
    });
    observer.observe(root);
  }
  render();
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
