<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ARA Temporal Interaction Formula Visualizer</title>
  <script src="ara_phi_distance_bk_fit_data.js"></script>
  <script src="ara_temporal_pocket_diagnostic_data.js"></script>
  <script src="ara_enso_coupled_pocket_visibility_data.js"></script>
  <script src="ara_triangle_amplitude_gate_data.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101214;
      --surface: #181c1f;
      --surface-2: #20262a;
      --line: #30383e;
      --muted: #95a1a8;
      --text: #eef3f5;
      --truth: #f4d35e;
      --persistence: #8b98a0;
      --fixed: #61d6c4;
      --learned: #6ba6ff;
      --integrated: #ff8f4d;
      --lag: #d489ff;
      --danger: #ff6b6b;
      --good: #7bd88f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    .app {
      min-height: 100vh;
      padding: 18px;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin: 0 auto 14px;
      max-width: 1480px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
      font-weight: 760;
    }

    .subtitle {
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    .formula {
      min-width: 320px;
      max-width: 650px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      color: #d9e1e5;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      line-height: 1.45;
    }

    .controls {
      position: sticky;
      top: 0;
      z-index: 5;
      display: grid;
      grid-template-columns: repeat(4, minmax(150px, max-content)) minmax(280px, 1fr);
      align-items: end;
      gap: 12px;
      max-width: 1480px;
      margin: 0 auto 14px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(24, 28, 31, 0.96);
      backdrop-filter: blur(8px);
    }

    label {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 680;
      text-transform: uppercase;
    }

    select {
      width: 100%;
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--surface-2);
      color: var(--text);
      padding: 0 10px;
      font: inherit;
      font-size: 13px;
    }

    .checks {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .check {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 34px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--surface-2);
      color: #dce3e7;
      font-size: 12px;
      text-transform: none;
      font-weight: 600;
    }

    input[type="checkbox"] {
      accent-color: var(--learned);
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 10px;
      max-width: 1480px;
      margin: 0 auto 14px;
    }

    .metric {
      min-width: 0;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
    }

    .metric b {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .metric span {
      display: block;
      margin-top: 6px;
      font-size: 18px;
      font-weight: 760;
    }

    main {
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      gap: 14px;
      max-width: 1480px;
      margin: 0 auto;
    }

    .panel {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      overflow: hidden;
    }

    .panel.wide {
      grid-column: 1 / -1;
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      padding: 11px 12px 8px;
      border-bottom: 1px solid var(--line);
    }

    h2 {
      margin: 0;
      font-size: 14px;
      line-height: 1.2;
      font-weight: 720;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px 12px;
      color: var(--muted);
      font-size: 11px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .swatch {
      width: 18px;
      height: 3px;
      border-radius: 2px;
      background: currentColor;
    }

    canvas {
      display: block;
      width: 100%;
      height: 300px;
      background: #14181b;
    }

    #deltaChart,
    #stateChart,
    #contactChart {
      height: 240px;
    }

    .readout {
      max-width: 1480px;
      margin: 14px auto 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      overflow: hidden;
    }

    .readout-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 0;
    }

    .readout-cell {
      min-width: 0;
      padding: 10px 12px;
      border-top: 1px solid var(--line);
      border-right: 1px solid var(--line);
    }

    .readout-cell:nth-child(-n+6) {
      border-top: 0;
    }

    .readout-cell b {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
    }

    .readout-cell span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-top: 5px;
      font-size: 13px;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    th,
    td {
      padding: 8px 10px;
      border-top: 1px solid var(--line);
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    th:first-child,
    td:first-child {
      text-align: left;
    }

    th {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
    }

    .score-wrap {
      overflow-x: auto;
      background: #14181b;
    }

    @media (max-width: 980px) {
      header,
      .controls {
        display: grid;
        grid-template-columns: 1fr;
      }

      .formula {
        min-width: 0;
        max-width: none;
      }

      .metrics,
      main,
      .readout-grid {
        grid-template-columns: 1fr;
      }

      .readout-cell,
      .readout-cell:nth-child(-n+6) {
        border-top: 1px solid var(--line);
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>ARA Temporal Interaction Formula</h1>
        <div class="subtitle">Strict-causal prediction traces against measured truth for ENSO, Solar, and ECG.</div>
      </div>
      <div class="formula" id="formulaText"></div>
    </header>

    <section class="controls" aria-label="visualizer controls">
      <label>
        System
        <select id="datasetSelect"></select>
      </label>
      <label>
        Horizon
        <select id="horizonSelect"></select>
      </label>
      <label>
        Delta Focus
        <select id="focusSelect"></select>
      </label>
      <label>
        Window
        <select id="rangeSelect">
          <option value="all">All test points</option>
          <option value="120">Last 120 points</option>
          <option value="80">Last 80 points</option>
          <option value="40">Last 40 points</option>
        </select>
      </label>
      <div class="checks" id="modelChecks"></div>
    </section>

    <section class="metrics" id="metrics"></section>

    <main>
      <section class="panel wide">
        <div class="panel-head">
          <h2>Ours Vs Truth</h2>
          <div class="legend" id="mainLegend"></div>
        </div>
        <canvas id="mainChart"></canvas>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>Delta Transport</h2>
          <div class="legend" id="deltaLegend"></div>
        </div>
        <canvas id="deltaChart"></canvas>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>Formula State</h2>
          <div class="legend" id="stateLegend"></div>
        </div>
        <canvas id="stateChart"></canvas>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>Wave Contacts</h2>
          <div class="legend" id="contactLegend"></div>
        </div>
        <canvas id="contactChart"></canvas>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>Scores</h2>
        </div>
        <div class="score-wrap" id="scores"></div>
      </section>
    </main>

    <section class="readout">
      <div class="panel-head">
        <h2>Selected State</h2>
      </div>
      <div class="readout-grid" id="readout"></div>
    </section>
  </div>

  <script>
    const fitData = window.ARA_PHI_DISTANCE_BK_FIT;
    const pocketData = window.ARA_TEMPORAL_POCKET_DIAGNOSTIC;
    const ensoCoupledData = window.ARA_ENSO_COUPLED_POCKET_VISIBILITY;
    const triangleAmpData = window.ARA_TRIANGLE_AMPLITUDE_GATE;

    const COLORS = {
      truth: '#f4d35e',
      persistence: '#8b98a0',
      fixedPi: '#61d6c4',
      learned: '#6ba6ff',
      integrated: '#ff8f4d',
      lag: '#d489ff',
      triangle: '#00d1ff',
      triangleAbs: '#ff4d8d',
      triangleBreath: '#2de38f',
      triangleBreathAbs: '#b388ff',
      pocket: '#ff6b6b',
      contact: '#7bd88f',
      closure: '#ffd166',
      phi: '#94d2bd',
      friction: '#bde0fe',
      deltaTruth: '#f4d35e'
    };

    const MODEL_META = [
      {
        id: 'fixed_1_plus_pi_leak_phi_distance_decoder',
        label: '1+pi+phi drag',
        color: COLORS.fixedPi,
        visible: true
      },
      {
        id: 'learned_bk_phi_distance_decoder',
        label: 'learned drag/cancel',
        color: COLORS.learned,
        visible: true
      },
      {
        id: 'integrated_gate_decoder',
        label: 'integrated gate',
        color: COLORS.integrated,
        visible: true,
        derived: true
      },
      {
        id: 'lag_ridge',
        label: 'lag ridge',
        color: COLORS.lag,
        visible: false
      },
      {
        id: 'triangle_gate_learned_bk',
        label: 'triangle amp gate',
        color: COLORS.triangle,
        visible: true
      },
      {
        id: 'triangle_abs_ridge_with_learned_direction',
        label: 'triangle abs+dir',
        color: COLORS.triangleAbs,
        visible: false
      },
      {
        id: 'triangle_breath_gate_learned_bk',
        label: 'triangle breath gate',
        color: COLORS.triangleBreath,
        visible: true
      },
      {
        id: 'triangle_breath_abs_ridge_with_learned_direction',
        label: 'triangle breath abs',
        color: COLORS.triangleBreathAbs,
        visible: false
      },
      {
        id: 'mean_friction_decoder',
        label: 'mean friction',
        color: '#a0c4ff',
        visible: false
      },
      {
        id: 'one_plus_pi_floor_bk_decoder',
        label: 'pi floor B+k',
        color: '#f7aef8',
        visible: false
      }
    ];

    const state = {
      dataset: null,
      horizon: null,
      focus: 'integrated_gate_decoder',
      range: 'all',
      hoverIndex: null,
      visible: Object.fromEntries(MODEL_META.map((m) => [m.id, m.visible]))
    };

    const els = {
      dataset: document.getElementById('datasetSelect'),
      horizon: document.getElementById('horizonSelect'),
      focus: document.getElementById('focusSelect'),
      range: document.getElementById('rangeSelect'),
      checks: document.getElementById('modelChecks'),
      metrics: document.getElementById('metrics'),
      scores: document.getElementById('scores'),
      readout: document.getElementById('readout'),
      formula: document.getElementById('formulaText'),
      mainLegend: document.getElementById('mainLegend'),
      deltaLegend: document.getElementById('deltaLegend'),
      stateLegend: document.getElementById('stateLegend'),
      contactLegend: document.getElementById('contactLegend'),
      mainChart: document.getElementById('mainChart'),
      deltaChart: document.getElementById('deltaChart'),
      stateChart: document.getElementById('stateChart'),
      contactChart: document.getElementById('contactChart')
    };

    function finite(value) {
      return Number.isFinite(value);
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function fmt(value, digits = 3) {
      if (!finite(value)) return 'n/a';
      const abs = Math.abs(value);
      if (abs >= 1000) return value.toFixed(0);
      if (abs >= 100) return value.toFixed(1);
      if (abs >= 10) return value.toFixed(2);
      return value.toFixed(digits);
    }

    function pct(value) {
      if (!finite(value)) return 'n/a';
      return `${(value * 100).toFixed(1)}%`;
    }

    function datasetLabel(id) {
      if (id === 'ENSO_NINO34') return 'ENSO NINO3.4';
      if (id === 'Solar_SILSO') return 'Solar SILSO';
      if (id === 'ECG_NSR001_RR') return 'ECG NSR001 RR';
      return id;
    }

    function horizonLabel(dataset, horizon) {
      if (dataset === 'ENSO_NINO34' || dataset === 'Solar_SILSO') return `${horizon} months`;
      if (dataset === 'ECG_NSR001_RR') return `${horizon} x 10s`;
      return String(horizon);
    }

    function horizonsFor(dataset) {
      return fitData.datasets[dataset].config.horizons;
    }

    function modelPoints(dataset, horizon, model) {
      if (model === 'integrated_gate_decoder') return [];
      const trianglePoints = (((triangleAmpData || {}).datasets || {})[dataset] || {}).points || {};
      if (trianglePoints[model]) return trianglePoints[model][String(horizon)] || [];
      return (((fitData.datasets[dataset].points || {})[model] || {})[String(horizon)] || []);
    }

    function modelScore(dataset, horizon, model) {
      if (model === 'integrated_gate_decoder') return null;
      const triangleScores = (((triangleAmpData || {}).datasets || {})[dataset] || {}).scores || {};
      if (triangleScores[model]) return triangleScores[model][String(horizon)] || null;
      return (((fitData.datasets[dataset].scores || {})[model] || {})[String(horizon)] || null);
    }

    function availableModels(dataset, horizon) {
      return MODEL_META.filter((m) => m.derived || modelPoints(dataset, horizon, m.id).length);
    }

    function rowKey(row) {
      return `${row.origin}|${row.date}`;
    }

    function mapByKey(rows) {
      const byKey = new Map();
      const byDate = new Map();
      rows.forEach((row) => {
        byKey.set(rowKey(row), row);
        byDate.set(row.date, row);
      });
      return { byKey, byDate };
    }

    function quantile(values, q) {
      const clean = values.filter(finite).sort((a, b) => a - b);
      if (!clean.length) return 0;
      const pos = (clean.length - 1) * q;
      const base = Math.floor(pos);
      const rest = pos - base;
      const next = clean[base + 1];
      return finite(next) ? clean[base] + rest * (next - clean[base]) : clean[base];
    }

    function normalizeByQ95(value, q95) {
      if (!finite(value) || !q95) return 0;
      return clamp(value / q95, 0, 1);
    }

    function buildMergedRows() {
      const dataset = state.dataset;
      const horizon = state.horizon;
      const base = modelPoints(dataset, horizon, 'learned_bk_phi_distance_decoder').length
        ? modelPoints(dataset, horizon, 'learned_bk_phi_distance_decoder')
        : modelPoints(dataset, horizon, 'fixed_1_plus_pi_leak_phi_distance_decoder');

      const pocketRows = (((pocketData.datasets[dataset] || {}).rows || {})[String(horizon)] || []);
      const pocketMaps = mapByKey(pocketRows);
      const ensoRows = dataset === 'ENSO_NINO34'
        ? ((ensoCoupledData.rows || {})[String(horizon)] || [])
        : [];
      const ensoMaps = mapByKey(ensoRows);
      const triangleRows = (((triangleAmpData || {}).datasets || {})[dataset] || {}).feature_rows || {};
      const triangleMaps = mapByKey(triangleRows[String(horizon)] || []);

      const modelMaps = {};
      availableModels(dataset, horizon)
        .filter((m) => !m.derived)
        .forEach((m) => {
          modelMaps[m.id] = mapByKey(modelPoints(dataset, horizon, m.id));
        });

      let rows = base.map((point) => {
        const key = rowKey(point);
        const pocket = pocketMaps.byKey.get(key) || pocketMaps.byDate.get(point.date) || null;
        const enso = ensoMaps.byKey.get(key) || ensoMaps.byDate.get(point.date) || null;
        const triangleAmp = triangleMaps.byKey.get(key) || triangleMaps.byDate.get(point.date) || null;
        const models = {};

        Object.entries(modelMaps).forEach(([modelId, maps]) => {
          const modelPoint = maps.byKey.get(key) || maps.byDate.get(point.date);
          models[modelId] = modelPoint ? modelPoint.pred : null;
        });

        return {
          origin: point.origin,
          date: point.date,
          actual: point.actual,
          persistence: point.persistence,
          ara: point.ara,
          phiDistance: point.phi_distance,
          B: point.B,
          k: point.k,
          learnedFriction: point.learned_friction,
          meanFriction: point.mean_friction,
          retroFlow: point.retro_flow,
          retroFriction: point.retro_friction,
          pocket,
          enso,
          triangleAmp,
          models
        };
      });

      attachIntegratedGate(rows);

      if (state.range !== 'all') {
        const keep = Number(state.range);
        rows = rows.slice(Math.max(0, rows.length - keep));
      }

      return rows;
    }

    function attachIntegratedGate(rows) {
      const pocketRaw = rows.map((row) => {
        const source = row.pocket;
        if (source && finite(source.pocket_strength)) return source.pocket_strength;
        if (finite(row.k)) return Math.max(0, -row.k);
        return 0;
      });
      const antiRaw = rows.map((row) => row.pocket ? row.pocket.anti_phase_energy : 0);
      const contactRaw = rows.map((row) => row.pocket ? row.pocket.gear_contact_energy : 0);
      const releaseRaw = rows.map((row) => row.pocket ? row.pocket.release_transition_gate : 0);
      const wrapRaw = rows.map((row) => row.pocket ? row.pocket.wrap_gate : 0);

      const qPocket = quantile(pocketRaw, 0.95) || 1;
      const qAnti = quantile(antiRaw, 0.95) || 1;
      const qContact = quantile(contactRaw, 0.95) || 1;

      rows.forEach((row, index) => {
        const learned = row.models.learned_bk_phi_distance_decoder;
        const fixedPi = row.models.fixed_1_plus_pi_leak_phi_distance_decoder;
        const learnedDelta = finite(learned) ? learned - row.persistence : null;
        const fixedDelta = finite(fixedPi) ? fixedPi - row.persistence : null;
        const baseDelta = finite(learnedDelta) && finite(fixedDelta)
          ? 0.58 * learnedDelta + 0.42 * fixedDelta
          : (finite(learnedDelta) ? learnedDelta : fixedDelta);

        const pocketNorm = normalizeByQ95(pocketRaw[index], qPocket);
        const antiNorm = normalizeByQ95(antiRaw[index], qAnti);
        const contactNorm = normalizeByQ95(contactRaw[index], qContact);
        const releaseGate = clamp(releaseRaw[index] || 0, 0, 1);
        const wrapGate = clamp(wrapRaw[index] || 0, 0, 1);
        const contactGate = clamp((antiNorm + contactNorm + releaseGate + wrapGate) / 4, 0, 1);
        const closure = row.enso && finite(row.enso.nino_soi_coupling_completeness)
          ? clamp(row.enso.nino_soi_coupling_completeness, 0, 1)
          : 0;
        const visibility = state.dataset === 'ENSO_NINO34' ? 1 - closure : 1;
        const pocketGain = 1 + 0.45 * pocketNorm * contactGate * visibility;
        const closureDamping = 0.35 * closure * pocketNorm;
        const gate = clamp(pocketGain - closureDamping, 0.15, 1.65);
        const integratedDelta = finite(baseDelta) ? baseDelta * gate : null;

        row.integrated = finite(integratedDelta) ? row.persistence + integratedDelta : null;
        row.integratedDelta = integratedDelta;
        row.integratedGate = gate;
        row.pocketNorm = pocketNorm;
        row.contactGate = contactGate;
        row.couplingClosure = closure;
        row.visibleCoupling = visibility;
        row.truthDelta = row.actual - row.persistence;
        row.truthMove = Math.abs(row.truthDelta);
      });
    }

    function computeScore(rows, modelId) {
      const pairs = rows
        .map((row) => {
          const pred = modelId === 'integrated_gate_decoder' ? row.integrated : row.models[modelId];
          return { pred, actual: row.actual, persistence: row.persistence };
        })
        .filter((row) => finite(row.pred) && finite(row.actual) && finite(row.persistence));
      if (!pairs.length) return null;

      const mae = pairs.reduce((sum, row) => sum + Math.abs(row.pred - row.actual), 0) / pairs.length;
      const pMae = pairs.reduce((sum, row) => sum + Math.abs(row.persistence - row.actual), 0) / pairs.length;
      const predMean = pairs.reduce((sum, row) => sum + row.pred, 0) / pairs.length;
      const actualMean = pairs.reduce((sum, row) => sum + row.actual, 0) / pairs.length;
      let cov = 0;
      let predVar = 0;
      let actualVar = 0;
      let directionHits = 0;
      pairs.forEach((row) => {
        cov += (row.pred - predMean) * (row.actual - actualMean);
        predVar += (row.pred - predMean) ** 2;
        actualVar += (row.actual - actualMean) ** 2;
        const predDelta = row.pred - row.persistence;
        const truthDelta = row.actual - row.persistence;
        if (Math.sign(predDelta) === Math.sign(truthDelta)) directionHits += 1;
      });
      const corr = predVar && actualVar ? cov / Math.sqrt(predVar * actualVar) : null;
      return {
        n: pairs.length,
        mae,
        persistence_mae: pMae,
        mae_lift_vs_persistence: pMae ? (pMae - mae) / pMae : null,
        corr,
        direction: directionHits / pairs.length
      };
    }

    function makeSeries(rows) {
      const visibleModels = availableModels(state.dataset, state.horizon).filter((m) => state.visible[m.id]);
      const main = [
        {
          id: 'truth',
          label: 'truth',
          color: COLORS.truth,
          width: 2.4,
          values: rows.map((row) => row.actual)
        },
        {
          id: 'persistence',
          label: 'persistence',
          color: COLORS.persistence,
          width: 1.5,
          dash: [5, 5],
          values: rows.map((row) => row.persistence)
        },
        ...visibleModels.map((m) => ({
          id: m.id,
          label: m.label,
          color: m.color,
          width: m.id === 'integrated_gate_decoder' ? 2.2 : 1.8,
          values: rows.map((row) => m.derived ? row.integrated : row.models[m.id])
        }))
      ];

      const focusMeta = MODEL_META.find((m) => m.id === state.focus) || MODEL_META[0];
      const delta = [
        {
          id: 'truth_delta',
          label: 'truth delta',
          color: COLORS.deltaTruth,
          width: 2.3,
          values: rows.map((row) => row.truthDelta)
        },
        {
          id: 'focus_delta',
          label: `${focusMeta.label} delta`,
          color: focusMeta.color,
          width: 2.2,
          values: rows.map((row) => {
            const pred = state.focus === 'integrated_gate_decoder' ? row.integrated : row.models[state.focus];
            return finite(pred) ? pred - row.persistence : null;
          })
        },
        {
          id: 'zero',
          label: 'baseline',
          color: '#56616a',
          width: 1,
          dash: [2, 4],
          values: rows.map(() => 0)
        }
      ];

      const moveQ = quantile(rows.map((row) => row.truthMove), 0.95) || 1;
      const stateSeries = [
        {
          id: 'phi_distance',
          label: '|ARA-phi|',
          color: COLORS.phi,
          width: 1.8,
          values: rows.map((row) => clamp(row.phiDistance || 0, 0, 2))
        },
        {
          id: 'pocket',
          label: 'pocket',
          color: COLORS.pocket,
          width: 1.8,
          values: rows.map((row) => row.pocketNorm)
        },
        {
          id: 'gate',
          label: 'integrated gate',
          color: COLORS.integrated,
          width: 2.1,
          values: rows.map((row) => row.integratedGate)
        },
        {
          id: 'triangle_pull',
          label: 'triangle pull',
          color: COLORS.triangle,
          width: 1.9,
          values: rows.map((row) => row.triangleAmp ? row.triangleAmp.triangle_pull : null)
        },
        {
          id: 'breath_pull',
          label: 'breath pull',
          color: COLORS.triangleBreath,
          width: 1.9,
          values: rows.map((row) => row.triangleAmp ? row.triangleAmp.breath_pull : null)
        },
        {
          id: 'breath_expansion',
          label: 'breath expansion',
          color: COLORS.triangleBreathAbs,
          width: 1.4,
          dash: [3, 5],
          values: rows.map((row) => row.triangleAmp ? row.triangleAmp.breath_expansion_gate : null)
        },
        {
          id: 'truth_move',
          label: 'truth move',
          color: COLORS.truth,
          width: 1.7,
          dash: [4, 4],
          values: rows.map((row) => normalizeByQ95(row.truthMove, moveQ))
        }
      ];

      const contactSeries = [
        {
          id: 'contact',
          label: 'gear/contact',
          color: COLORS.contact,
          width: 1.9,
          values: rows.map((row) => row.contactGate)
        },
        {
          id: 'visibility',
          label: state.dataset === 'ENSO_NINO34' ? 'NINO/SOI visibility' : 'visible coupling',
          color: COLORS.fixedPi,
          width: 1.9,
          values: rows.map((row) => row.visibleCoupling)
        },
        {
          id: 'closure',
          label: state.dataset === 'ENSO_NINO34' ? 'closure' : 'closure',
          color: COLORS.closure,
          width: 1.5,
          dash: [3, 5],
          values: rows.map((row) => row.couplingClosure)
        },
        {
          id: 'third_corner',
          label: 'third corner',
          color: COLORS.triangle,
          width: 1.8,
          values: rows.map((row) => row.triangleAmp ? row.triangleAmp.third_corner : null)
        },
        {
          id: 'pair_edge',
          label: 'pair edge',
          color: COLORS.triangleAbs,
          width: 1.6,
          dash: [2, 5],
          values: rows.map((row) => row.triangleAmp ? row.triangleAmp.pair_edge : null)
        },
        {
          id: 'truth_move',
          label: 'truth move',
          color: COLORS.truth,
          width: 1.7,
          dash: [4, 4],
          values: rows.map((row) => normalizeByQ95(row.truthMove, moveQ))
        }
      ];

      return { main, delta, stateSeries, contactSeries };
    }

    function chartCanvas(canvas) {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.floor(rect.width * dpr));
      canvas.height = Math.max(1, Math.floor(rect.height * dpr));
      const ctx = canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return { ctx, width: rect.width, height: rect.height };
    }

    function drawChart(canvas, rows, series, options = {}) {
      const { ctx, width, height } = chartCanvas(canvas);
      const margin = { left: 58, right: 18, top: 18, bottom: 34 };
      const plotW = Math.max(10, width - margin.left - margin.right);
      const plotH = Math.max(10, height - margin.top - margin.bottom);
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = '#14181b';
      ctx.fillRect(0, 0, width, height);

      const values = series.flatMap((s) => s.values.filter(finite));
      if (options.includeZero) values.push(0);
      if (!values.length || !rows.length) {
        drawNoData(ctx, width, height);
        return;
      }

      let min = Math.min(...values);
      let max = Math.max(...values);
      if (min === max) {
        min -= 1;
        max += 1;
      }
      const pad = (max - min) * 0.08;
      min -= pad;
      max += pad;

      const xAt = (i) => margin.left + (rows.length <= 1 ? 0 : (i / (rows.length - 1)) * plotW);
      const yAt = (v) => margin.top + (1 - (v - min) / (max - min)) * plotH;

      drawGrid(ctx, margin, plotW, plotH, min, max, width, height, yAt);

      series.forEach((s) => {
        ctx.save();
        ctx.strokeStyle = s.color;
        ctx.lineWidth = s.width || 1.5;
        ctx.setLineDash(s.dash || []);
        ctx.beginPath();
        let moved = false;
        s.values.forEach((value, i) => {
          if (!finite(value)) {
            moved = false;
            return;
          }
          const x = xAt(i);
          const y = yAt(value);
          if (!moved) {
            ctx.moveTo(x, y);
            moved = true;
          } else {
            ctx.lineTo(x, y);
          }
        });
        ctx.stroke();
        ctx.restore();
      });

      if (finite(state.hoverIndex) && rows[state.hoverIndex]) {
        const i = clamp(state.hoverIndex, 0, rows.length - 1);
        const x = xAt(i);
        ctx.save();
        ctx.strokeStyle = '#dce3e766';
        ctx.lineWidth = 1;
        ctx.setLineDash([3, 4]);
        ctx.beginPath();
        ctx.moveTo(x, margin.top);
        ctx.lineTo(x, margin.top + plotH);
        ctx.stroke();
        ctx.restore();

        series.forEach((s) => {
          const value = s.values[i];
          if (!finite(value)) return;
          ctx.fillStyle = s.color;
          ctx.beginPath();
          ctx.arc(x, yAt(value), 3.5, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      drawXAxis(ctx, rows, margin, plotW, height, xAt);
    }

    function drawNoData(ctx, width, height) {
      ctx.fillStyle = '#95a1a8';
      ctx.font = '13px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('No data for this view', width / 2, height / 2);
    }

    function drawGrid(ctx, margin, plotW, plotH, min, max, width, height, yAt) {
      ctx.save();
      ctx.strokeStyle = '#30383e';
      ctx.lineWidth = 1;
      ctx.fillStyle = '#95a1a8';
      ctx.font = '11px ui-monospace, SFMono-Regular, Consolas, monospace';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';

      for (let t = 0; t <= 4; t += 1) {
        const value = min + ((max - min) * t) / 4;
        const y = yAt(value);
        ctx.beginPath();
        ctx.moveTo(margin.left, y);
        ctx.lineTo(margin.left + plotW, y);
        ctx.stroke();
        ctx.fillText(fmt(value, 2), margin.left - 8, y);
      }

      ctx.strokeStyle = '#4b555d';
      ctx.strokeRect(margin.left, margin.top, plotW, plotH);
      ctx.restore();
    }

    function drawXAxis(ctx, rows, margin, plotW, height, xAt) {
      if (!rows.length) return;
      const ticks = rows.length > 3 ? [0, Math.floor((rows.length - 1) / 2), rows.length - 1] : rows.map((_, i) => i);
      ctx.save();
      ctx.fillStyle = '#95a1a8';
      ctx.font = '11px ui-monospace, SFMono-Regular, Consolas, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ticks.forEach((i) => {
        const label = String(rows[i].date);
        ctx.fillText(label, xAt(i), height - margin.bottom + 12);
      });
      ctx.restore();
    }

    function setLegend(el, series) {
      el.innerHTML = series.map((s) => `
        <span class="legend-item" style="color:${s.color}">
          <span class="swatch"></span>
          <span>${s.label}</span>
        </span>
      `).join('');
    }

    function metricTile(label, value, color) {
      return `<div class="metric"><b>${label}</b><span style="color:${color || 'var(--text)'}">${value}</span></div>`;
    }

    function updateMetrics(rows) {
      const focusScore = computeScore(rows, state.focus);
      const integratedScore = computeScore(rows, 'integrated_gate_decoder');
      const source = rows.length ? rows[Math.min(rows.length - 1, state.hoverIndex ?? rows.length - 1)] : null;
      const piLeak = fitData.pi_leak_energy;
      const phi = fitData.phi;
      els.metrics.innerHTML = [
        metricTile('System', datasetLabel(state.dataset)),
        metricTile('Horizon', horizonLabel(state.dataset, state.horizon)),
        metricTile('Focus MAE', focusScore ? fmt(focusScore.mae, 3) : 'n/a'),
        metricTile('Focus Lift', focusScore ? pct(focusScore.mae_lift_vs_persistence) : 'n/a', focusScore && focusScore.mae_lift_vs_persistence >= 0 ? 'var(--good)' : 'var(--danger)'),
        metricTile('Integrated Corr', integratedScore ? fmt(integratedScore.corr, 3) : 'n/a'),
        metricTile('Pi leak / Phi', `${fmt(piLeak, 5)} / ${fmt(phi, 5)}`)
      ].join('');

      els.formula.innerHTML = [
        `drag = B + k x |ARA - &phi;|`,
        `pi energy leak = (&pi; - 3) / &pi; = ${fmt(piLeak, 6)}`,
        `integrated gate = base_delta x [pocket x contact x visibility - closure damping]`,
        `triangle amp = delta x topographic pull; breath gate adds pull phase/velocity`,
        source ? `selected gate = ${fmt(source.integratedGate, 3)}, visibility = ${fmt(source.visibleCoupling, 3)}` : ''
      ].filter(Boolean).join('<br>');
    }

    function updateScores(rows) {
      const models = availableModels(state.dataset, state.horizon);
      const rowsHtml = models.map((m) => {
        const score = m.derived ? computeScore(rows, m.id) : (modelScore(state.dataset, state.horizon, m.id) || computeScore(rows, m.id));
        if (!score) return '';
        return `
          <tr>
            <td>${m.label}</td>
            <td>${score.n}</td>
            <td>${fmt(score.mae, 3)}</td>
            <td>${fmt(score.persistence_mae, 3)}</td>
            <td>${pct(score.mae_lift_vs_persistence)}</td>
            <td>${fmt(score.corr, 3)}</td>
            <td>${pct(score.direction)}</td>
          </tr>
        `;
      }).join('');
      els.scores.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Trace</th>
              <th>n</th>
              <th>MAE</th>
              <th>Persist MAE</th>
              <th>Lift</th>
              <th>Corr</th>
              <th>Dir</th>
            </tr>
          </thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      `;
    }

    function updateReadout(rows) {
      if (!rows.length) {
        els.readout.innerHTML = '';
        return;
      }
      const index = clamp(state.hoverIndex ?? rows.length - 1, 0, rows.length - 1);
      const row = rows[index];
      const focusPred = state.focus === 'integrated_gate_decoder' ? row.integrated : row.models[state.focus];
      const cells = [
        ['Date', row.date],
        ['Truth', fmt(row.actual, 4)],
        ['Persistence', fmt(row.persistence, 4)],
        ['Focus Pred', fmt(focusPred, 4)],
        ['Truth Delta', fmt(row.truthDelta, 4)],
        ['Focus Delta', finite(focusPred) ? fmt(focusPred - row.persistence, 4) : 'n/a'],
        ['ARA', fmt(row.ara, 4)],
        ['|ARA-phi|', fmt(row.phiDistance, 4)],
        ['B', fmt(row.B, 4)],
        ['k', fmt(row.k, 4)],
        ['Pocket', fmt(row.pocketNorm, 4)],
        ['Contact', fmt(row.contactGate, 4)],
        ['Tri pull', row.triangleAmp ? fmt(row.triangleAmp.triangle_pull, 4) : 'n/a'],
        ['Breath pull', row.triangleAmp ? fmt(row.triangleAmp.breath_pull, 4) : 'n/a'],
        ['Breath phase', row.triangleAmp ? fmt(row.triangleAmp.breath_phase, 4) : 'n/a'],
        ['Breath gate', row.triangleAmp ? fmt(row.triangleAmp.breath_expansion_gate, 4) : 'n/a'],
        ['Third corner', row.triangleAmp ? fmt(row.triangleAmp.third_corner, 4) : 'n/a'],
        ['Pair edge', row.triangleAmp ? fmt(row.triangleAmp.pair_edge, 4) : 'n/a'],
        ['Closure', fmt(row.couplingClosure, 4)],
        ['Visibility', fmt(row.visibleCoupling, 4)],
        ['Gate', fmt(row.integratedGate, 4)],
        ['Integrated', fmt(row.integrated, 4)],
        ['Anti-phase', row.pocket ? fmt(row.pocket.anti_phase_energy, 4) : 'n/a'],
        ['Gear contact', row.pocket ? fmt(row.pocket.gear_contact_energy, 4) : 'n/a']
      ];
      els.readout.innerHTML = cells.map(([label, value]) => `
        <div class="readout-cell">
          <b>${label}</b>
          <span>${value}</span>
        </div>
      `).join('');
    }

    function drawAll() {
      const rows = buildMergedRows();
      if (state.hoverIndex !== null) {
        state.hoverIndex = clamp(state.hoverIndex, 0, Math.max(0, rows.length - 1));
      }
      const series = makeSeries(rows);
      drawChart(els.mainChart, rows, series.main, {});
      drawChart(els.deltaChart, rows, series.delta, { includeZero: true });
      drawChart(els.stateChart, rows, series.stateSeries, { includeZero: true });
      drawChart(els.contactChart, rows, series.contactSeries, { includeZero: true });
      setLegend(els.mainLegend, series.main);
      setLegend(els.deltaLegend, series.delta);
      setLegend(els.stateLegend, series.stateSeries);
      setLegend(els.contactLegend, series.contactSeries);
      updateMetrics(rows);
      updateScores(rows);
      updateReadout(rows);
    }

    function populateSelectors() {
      const datasets = Object.keys(fitData.datasets);
      state.dataset = datasets[0];
      state.horizon = horizonsFor(state.dataset)[0];

      els.dataset.innerHTML = datasets.map((id) => `<option value="${id}">${datasetLabel(id)}</option>`).join('');
      els.dataset.value = state.dataset;
      populateHorizons();
      populateFocus();
      populateChecks();
    }

    function populateHorizons() {
      const horizons = horizonsFor(state.dataset);
      if (!horizons.includes(Number(state.horizon))) {
        state.horizon = horizons[0];
      }
      els.horizon.innerHTML = horizons.map((h) => `<option value="${h}">${horizonLabel(state.dataset, h)}</option>`).join('');
      els.horizon.value = String(state.horizon);
    }

    function populateFocus() {
      const models = availableModels(state.dataset, state.horizon);
      if (!models.some((m) => m.id === state.focus)) state.focus = 'integrated_gate_decoder';
      els.focus.innerHTML = models.map((m) => `<option value="${m.id}">${m.label}</option>`).join('');
      els.focus.value = state.focus;
    }

    function populateChecks() {
      const models = availableModels(state.dataset, state.horizon);
      els.checks.innerHTML = models.map((m) => `
        <label class="check" style="border-color:${m.color}66">
          <input type="checkbox" value="${m.id}" ${state.visible[m.id] ? 'checked' : ''}>
          <span>${m.label}</span>
        </label>
      `).join('');
      els.checks.querySelectorAll('input').forEach((input) => {
        input.addEventListener('change', () => {
          state.visible[input.value] = input.checked;
          drawAll();
        });
      });
    }

    function onPointerMove(event) {
      const rows = buildMergedRows();
      if (!rows.length) return;
      const rect = event.currentTarget.getBoundingClientRect();
      const marginLeft = 58;
      const marginRight = 18;
      const plotW = Math.max(10, rect.width - marginLeft - marginRight);
      const x = clamp(event.clientX - rect.left - marginLeft, 0, plotW);
      state.hoverIndex = clamp(Math.round((x / plotW) * (rows.length - 1)), 0, rows.length - 1);
      drawAll();
    }

    function onPointerLeave() {
      state.hoverIndex = null;
      drawAll();
    }

    function bindEvents() {
      els.dataset.addEventListener('change', () => {
        state.dataset = els.dataset.value;
        state.horizon = horizonsFor(state.dataset)[0];
        state.hoverIndex = null;
        populateHorizons();
        populateFocus();
        populateChecks();
        drawAll();
      });
      els.horizon.addEventListener('change', () => {
        state.horizon = Number(els.horizon.value);
        state.hoverIndex = null;
        populateFocus();
        populateChecks();
        drawAll();
      });
      els.focus.addEventListener('change', () => {
        state.focus = els.focus.value;
        drawAll();
      });
      els.range.addEventListener('change', () => {
        state.range = els.range.value;
        state.hoverIndex = null;
        drawAll();
      });
      [els.mainChart, els.deltaChart, els.stateChart, els.contactChart].forEach((canvas) => {
        canvas.addEventListener('mousemove', onPointerMove);
        canvas.addEventListener('mouseleave', onPointerLeave);
      });
      window.addEventListener('resize', drawAll);
    }

    populateSelectors();
    bindEvents();
    drawAll();
  </script>
</body>
</html>
