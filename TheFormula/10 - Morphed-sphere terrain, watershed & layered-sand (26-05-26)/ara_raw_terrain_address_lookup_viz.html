<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARA Raw Terrain Address Lookup</title>
  <script src="ara_raw_terrain_address_lookup_result.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090d12;
      --panel: #141a22;
      --line: #2b3542;
      --text: #e8f2ff;
      --muted: #91a4b8;
      --truth: #f6f7fb;
      --current: #6f7b8a;
      --wobble: #8f7cff;
      --average: #52d273;
      --raw1: #28e0cf;
      --raw3: #f6ad3c;
      --contact: #ff5c6c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
    }
    main {
      display: grid;
      grid-template-rows: auto minmax(460px, 1fr) auto;
      gap: 12px;
      min-height: 100vh;
      padding: 12px;
    }
    .bar, .chart, .card, .legend {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }
    .bar, .cards, .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    .bar {
      justify-content: space-between;
      padding: 10px 12px;
    }
    .group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .label {
      color: #9fd1ff;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    button, .toggle {
      border: 1px solid #334050;
      border-radius: 8px;
      background: #1b2330;
      color: var(--text);
      padding: 8px 10px;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
    }
    button.active {
      border-color: #9cff38;
      color: #9cff38;
      box-shadow: inset 0 0 0 1px rgba(156, 255, 56, .28);
    }
    .toggle {
      display: inline-flex;
      gap: 7px;
      align-items: center;
      user-select: none;
    }
    .toggle input { accent-color: #9cff38; }
    .chart {
      position: relative;
      overflow: hidden;
      min-height: 460px;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .cards { align-items: stretch; }
    .card {
      min-width: 170px;
      flex: 1;
      padding: 12px;
    }
    .name {
      color: #9fd1ff;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .value {
      margin-top: 6px;
      font-size: 24px;
      font-weight: 850;
      line-height: 1.05;
    }
    .sub {
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
    }
    .legend { padding: 10px 12px; }
    .item {
      display: inline-flex;
      gap: 7px;
      align-items: center;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }
    .swatch {
      width: 14px;
      height: 4px;
      border-radius: 999px;
      background: currentColor;
    }
  </style>
</head>
<body>
  <main>
    <section class="bar">
      <div class="group" id="horizonButtons"><span class="label">Horizon</span></div>
      <div class="group">
        <label class="toggle"><input type="checkbox" data-model="wobble" checked> Wobble</label>
        <label class="toggle"><input type="checkbox" data-model="average" checked> Averaged roll</label>
        <label class="toggle"><input type="checkbox" data-model="raw1" checked> Raw top-1</label>
        <label class="toggle"><input type="checkbox" data-model="raw3"> Raw top-3</label>
        <label class="toggle"><input type="checkbox" data-model="contact"> Contact top-1</label>
        <label class="toggle"><input type="checkbox" id="readyOnly" checked> Ready only</label>
      </div>
    </section>

    <section class="chart"><canvas id="chart"></canvas></section>

    <section>
      <div class="cards" id="cards"></div>
      <div class="legend">
        <span class="item" style="color: var(--truth)"><span class="swatch"></span> Truth</span>
        <span class="item" style="color: var(--current)"><span class="swatch"></span> Current/persistence</span>
        <span class="item" style="color: var(--wobble)"><span class="swatch"></span> Wobble surface</span>
        <span class="item" style="color: var(--average)"><span class="swatch"></span> Averaged learned roll</span>
        <span class="item" style="color: var(--raw1)"><span class="swatch"></span> Raw address top-1</span>
        <span class="item" style="color: var(--raw3)"><span class="swatch"></span> Raw address top-3 weighted</span>
        <span class="item" style="color: var(--contact)"><span class="swatch"></span> Contact address top-1</span>
      </div>
    </section>
  </main>

  <script>
    const DATA = window.ARA_RAW_TERRAIN_ADDRESS;
    const horizons = DATA.horizons_months.map(String);
    const state = {
      horizon: horizons.includes("12") ? "12" : horizons[0],
      readyOnly: true,
      models: { wobble: true, average: true, raw1: true, raw3: false, contact: false }
    };
    const modelDefs = [
      { key: "wobble", field: "wobble_surface_analog", metric: "wobble_surface_analog", color: "#8f7cff", width: 1.8 },
      { key: "average", field: "roll_learned_average", metric: "roll_learned_average", color: "#52d273", width: 1.7 },
      { key: "raw1", field: "raw_address_top1", metric: "raw_address_top1", color: "#28e0cf", width: 2.2 },
      { key: "raw3", field: "raw_address_top3_weighted", metric: "raw_address_top3_weighted", color: "#f6ad3c", width: 1.8 },
      { key: "contact", field: "contact_address_top1", metric: "contact_address_top1", color: "#ff5c6c", width: 1.6 }
    ];
    const buttons = document.getElementById("horizonButtons");
    for (const h of horizons) {
      const button = document.createElement("button");
      button.textContent = `${h}m`;
      button.type = "button";
      button.addEventListener("click", () => {
        state.horizon = h;
        render();
      });
      buttons.appendChild(button);
    }
    document.querySelectorAll("[data-model]").forEach((input) => {
      input.addEventListener("change", () => {
        state.models[input.dataset.model] = input.checked;
        render();
      });
    });
    document.getElementById("readyOnly").addEventListener("change", (event) => {
      state.readyOnly = event.target.checked;
      render();
    });
    function isReady(row) {
      return row.raw_address_top1_distance !== null && row.raw_address_top1_distance !== undefined;
    }
    function rowsForView() {
      const rows = DATA.viz_records[state.horizon] || [];
      return state.readyOnly ? rows.filter(isReady) : rows;
    }
    function metric(name, model) {
      const bag = state.readyOnly ? DATA.ready_point_scores : DATA.point_scores;
      return bag[model]?.[state.horizon]?.[name];
    }
    function direction(model) {
      const bag = state.readyOnly ? DATA.ready_direction_scores : DATA.direction_scores;
      return bag[model]?.[state.horizon]?.accuracy;
    }
    function ampRatio(model) {
      const bag = state.readyOnly ? DATA.ready_amplitude : DATA.amplitude;
      return bag[model]?.[state.horizon]?.std_ratio;
    }
    function diag(name) {
      return DATA.diagnostics[state.horizon]?.[name];
    }
    function fmt(value, digits = 3) {
      return Number.isFinite(value) ? value.toFixed(digits) : "n/a";
    }
    function renderCards() {
      const cards = document.getElementById("cards");
      const items = [
        ["Ready", diag("ready_fraction"), "Rows with a causal raw address", 3],
        ["Top-1 dist", diag("mean_top1_distance"), "Mean surface-address distance", 3],
        ["Raw corr", metric("corr", "raw_address_top1"), "Top-1 raw terrain shape", 3],
        ["Raw amp", ampRatio("raw_address_top1"), "Predicted delta std / truth", 3],
        ["Avg amp", ampRatio("roll_learned_average"), "Averaged roll amplitude", 3],
        ["Raw MAE", metric("mae", "raw_address_top1"), "Top-1 native-unit error", 3]
      ];
      cards.innerHTML = "";
      for (const [name, value, sub, digits] of items) {
        const el = document.createElement("article");
        el.className = "card";
        el.innerHTML = `<div class="name">${name}</div><div class="value">${fmt(value, digits)}</div><div class="sub">${sub}</div>`;
        cards.appendChild(el);
      }
    }
    function drawPath(ctx, rows, field, color, width, x, y, dash) {
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      if (dash) ctx.setLineDash(dash);
      ctx.beginPath();
      let started = false;
      rows.forEach((row, i) => {
        const value = row[field];
        if (!Number.isFinite(value)) return;
        const xx = x(i);
        const yy = y(value);
        if (!started) {
          ctx.moveTo(xx, yy);
          started = true;
        } else {
          ctx.lineTo(xx, yy);
        }
      });
      ctx.stroke();
      ctx.restore();
    }
    function drawPoints(ctx, rows, field, color, x, y) {
      ctx.save();
      ctx.fillStyle = color;
      rows.forEach((row, i) => {
        const value = row[field];
        if (!Number.isFinite(value)) return;
        ctx.beginPath();
        ctx.arc(x(i), y(value), 2.2, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.restore();
    }
    function draw() {
      const canvas = document.getElementById("chart");
      const ctx = canvas.getContext("2d");
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(720, Math.round(rect.width * dpr));
      canvas.height = Math.max(460, Math.round(rect.height * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const w = rect.width;
      const h = rect.height;
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = "#090d12";
      ctx.fillRect(0, 0, w, h);
      const rows = rowsForView();
      if (!rows.length) return;
      const active = modelDefs.filter((def) => state.models[def.key]);
      const values = rows
        .flatMap((row) => [row.actual, row.current, ...active.map((def) => row[def.field])])
        .filter(Number.isFinite);
      let minY = Math.min(-2.2, ...values);
      let maxY = Math.max(2.2, ...values);
      const padY = (maxY - minY) * 0.08 || 1;
      minY -= padY;
      maxY += padY;
      const margin = { left: 56, right: 22, top: 30, bottom: 52 };
      const plotW = w - margin.left - margin.right;
      const plotH = h - margin.top - margin.bottom;
      const x = (i) => margin.left + (rows.length <= 1 ? 0 : i / (rows.length - 1)) * plotW;
      const y = (v) => margin.top + (1 - (v - minY) / (maxY - minY)) * plotH;
      ctx.lineWidth = 1;
      ctx.strokeStyle = "#25303b";
      ctx.fillStyle = "#8ea3b8";
      ctx.font = "12px ui-sans-serif, system-ui";
      ctx.textAlign = "left";
      for (let tick = Math.ceil(minY); tick <= Math.floor(maxY); tick += 1) {
        const yy = y(tick);
        ctx.beginPath();
        ctx.moveTo(margin.left, yy);
        ctx.lineTo(w - margin.right, yy);
        ctx.stroke();
        ctx.fillText(String(tick), 18, yy + 4);
      }
      ctx.strokeStyle = "#8792a0";
      ctx.beginPath();
      ctx.moveTo(margin.left, y(0));
      ctx.lineTo(w - margin.right, y(0));
      ctx.stroke();
      drawPath(ctx, rows, "actual", "#f6f7fb", 2.4, x, y);
      drawPath(ctx, rows, "current", "#6f7b8a", 1.2, x, y, [4, 6]);
      active.forEach((def) => drawPath(ctx, rows, def.field, def.color, def.width, x, y));
      active.forEach((def) => {
        if (def.key === "raw1") drawPoints(ctx, rows, def.field, def.color, x, y);
      });
      ctx.fillStyle = "#8ea3b8";
      ctx.textAlign = "center";
      const every = Math.max(1, Math.ceil(rows.length / 6));
      rows.forEach((row, i) => {
        if (i % every !== 0 && i !== rows.length - 1) return;
        ctx.fillText(row.origin.slice(0, 4), x(i), h - 22);
      });
      ctx.textAlign = "left";
      ctx.fillStyle = "#91a4b8";
      ctx.fillText(`h=${state.horizon}m, ${state.readyOnly ? "ready-only" : "all rows"}`, margin.left, 20);
    }
    function render() {
      document.querySelectorAll("#horizonButtons button").forEach((button) => {
        button.classList.toggle("active", button.textContent === `${state.horizon}m`);
      });
      document.getElementById("readyOnly").checked = state.readyOnly;
      renderCards();
      draw();
    }
    window.addEventListener("resize", render);
    render();
  </script>
</body>
</html>
