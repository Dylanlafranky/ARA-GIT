<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARA Closed Cutoff Run</title>
  <script src="ara_layered_sand_closed_cutoff_result.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080d12;
      --panel: #141b24;
      --line: #2d3948;
      --text: #edf6ff;
      --muted: #9ab0c7;
      --truth: #f7f8fb;
      --base: #6d7a8b;
      --fit: #d7ff4f;
      --manual: #ff8f5a;
      --wave: #4db6ff;
      --corr: #c084fc;
      --formula: #55e0a3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
    }
    main {
      display: grid;
      grid-template-rows: auto minmax(480px, 1fr) auto;
      gap: 12px;
      min-height: 100vh;
      padding: 12px;
    }
    .bar, .chart, .card, .legend {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }
    .bar, .legend, .cards {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    .bar {
      justify-content: space-between;
      padding: 10px 12px;
    }
    .group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .label, .name {
      color: #9fd1ff;
      font-size: 12px;
      font-weight: 850;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    button, .toggle {
      border: 1px solid #344254;
      border-radius: 8px;
      background: #1b2431;
      color: var(--text);
      padding: 8px 10px;
      font: inherit;
      font-weight: 760;
      cursor: pointer;
    }
    button.active {
      border-color: #9cff38;
      color: #9cff38;
      box-shadow: inset 0 0 0 1px rgba(156,255,56,.25);
    }
    .toggle {
      display: inline-flex;
      gap: 7px;
      align-items: center;
      user-select: none;
    }
    .toggle input { accent-color: #9cff38; }
    .chart {
      position: relative;
      min-height: 480px;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .cards { align-items: stretch; }
    .card {
      min-width: 170px;
      flex: 1;
      padding: 12px;
    }
    .value {
      margin-top: 6px;
      font-size: 25px;
      font-weight: 880;
      line-height: 1.05;
    }
    .sub {
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
    }
    .legend { padding: 10px 12px; }
    .item {
      display: inline-flex;
      gap: 7px;
      align-items: center;
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
    }
    .swatch {
      width: 14px;
      height: 4px;
      border-radius: 999px;
      background: currentColor;
    }
  </style>
</head>
<body>
  <main>
    <section class="bar">
      <div class="group" id="cutoffButtons"><span class="label">Cutoff</span></div>
      <div class="group">
        <label class="toggle"><input type="checkbox" data-model="base_formula"> Base</label>
        <label class="toggle"><input type="checkbox" data-model="fitted_formula" checked> Fitted</label>
        <label class="toggle"><input type="checkbox" data-model="manual_screenshot"> Manual</label>
        <label class="toggle"><input type="checkbox" data-model="wavecycle_screenshot"> Wavecycle</label>
        <label class="toggle"><input type="checkbox" data-model="best_corr_fit" checked> Best corr</label>
        <label class="toggle"><input type="checkbox" data-model="persistence"> Persistence</label>
      </div>
    </section>

    <section class="chart"><canvas id="chart"></canvas></section>

    <section>
      <div class="cards" id="cards"></div>
      <div class="legend">
        <span class="item" style="color: var(--truth)"><span class="swatch"></span> Truth</span>
        <span class="item" style="color: var(--formula)"><span class="swatch"></span> Base</span>
        <span class="item" style="color: var(--fit)"><span class="swatch"></span> Fitted</span>
        <span class="item" style="color: var(--manual)"><span class="swatch"></span> Manual</span>
        <span class="item" style="color: var(--wave)"><span class="swatch"></span> Wavecycle</span>
        <span class="item" style="color: var(--corr)"><span class="swatch"></span> Best corr</span>
        <span class="item" style="color: var(--base)"><span class="swatch"></span> Persistence</span>
      </div>
    </section>
  </main>

  <script>
    const DATA = window.ARA_LAYERED_SAND_CLOSED_CUTOFF;
    const cutoffs = DATA.cutoffs;
    const state = {
      cutoff: cutoffs.includes("2017-01-01") ? "2017-01-01" : cutoffs[0],
      models: {
        base_formula: false,
        fitted_formula: true,
        manual_screenshot: false,
        wavecycle_screenshot: false,
        best_corr_fit: true,
        persistence: false
      }
    };
    const modelDefs = [
      { key: "base_formula", label: "Base", color: "#55e0a3", width: 1.8 },
      { key: "fitted_formula", label: "Fitted", color: "#d7ff4f", width: 2.1 },
      { key: "manual_screenshot", label: "Manual", color: "#ff8f5a", width: 1.9 },
      { key: "wavecycle_screenshot", label: "Wavecycle", color: "#4db6ff", width: 1.9 },
      { key: "best_corr_fit", label: "Best corr", color: "#c084fc", width: 2.1 },
      { key: "persistence", label: "Persistence", color: "#6d7a8b", width: 1.5, dash: [7, 6] }
    ];
    function rows() {
      return DATA.results[state.cutoff]?.records || [];
    }
    function score(key, window = "all") {
      return DATA.results[state.cutoff]?.evaluations?.[window]?.[key] || {};
    }
    function mean(values) {
      return values.length ? values.reduce((sum, value) => sum + value, 0) / values.length : NaN;
    }
    function corr(xs, ys) {
      const mx = mean(xs);
      const my = mean(ys);
      const vx = xs.map((x) => x - mx);
      const vy = ys.map((y) => y - my);
      const denom = Math.sqrt(vx.reduce((s, x) => s + x * x, 0) * vy.reduce((s, y) => s + y * y, 0));
      return denom > 1e-12 ? vx.reduce((s, x, i) => s + x * vy[i], 0) / denom : NaN;
    }
    function fmt(value, digits = 3) {
      return Number.isFinite(value) ? value.toFixed(digits) : "n/a";
    }
    function buildButtons() {
      const wrap = document.getElementById("cutoffButtons");
      cutoffs.forEach((cutoff) => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = cutoff.slice(0, 4);
        button.addEventListener("click", () => {
          state.cutoff = cutoff;
          render();
        });
        wrap.appendChild(button);
      });
    }
    function activeModels() {
      return modelDefs.filter((model) => state.models[model.key]);
    }
    function drawLine(ctx, dataRows, field, x, y, color, width, dash = []) {
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.setLineDash(dash);
      ctx.beginPath();
      let started = false;
      dataRows.forEach((row, index) => {
        if (!Number.isFinite(row[field])) {
          started = false;
          return;
        }
        const px = x(index);
        const py = y(row[field]);
        if (!started) {
          ctx.moveTo(px, py);
          started = true;
        } else {
          ctx.lineTo(px, py);
        }
      });
      ctx.stroke();
      ctx.restore();
    }
    function drawChart() {
      const canvas = document.getElementById("chart");
      const rect = canvas.getBoundingClientRect();
      const scale = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.floor(rect.width * scale));
      canvas.height = Math.max(1, Math.floor(rect.height * scale));
      const ctx = canvas.getContext("2d");
      ctx.setTransform(scale, 0, 0, scale, 0, 0);
      const width = rect.width;
      const height = rect.height;
      const pad = { left: 56, right: 24, top: 28, bottom: 52 };
      const dataRows = rows();
      const fields = ["actual", ...activeModels().map((model) => model.key)];
      const values = dataRows.flatMap((row) => fields.map((field) => row[field]).filter(Number.isFinite));
      let minY = Math.min(-1, ...values);
      let maxY = Math.max(1, ...values);
      const span = Math.max(0.1, maxY - minY);
      minY -= 0.08 * span;
      maxY += 0.08 * span;
      const plotW = width - pad.left - pad.right;
      const plotH = height - pad.top - pad.bottom;
      const x = (index) => pad.left + (dataRows.length <= 1 ? 0 : index / (dataRows.length - 1) * plotW);
      const y = (value) => pad.top + (maxY - value) / (maxY - minY) * plotH;
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = "#080d12";
      ctx.fillRect(0, 0, width, height);
      ctx.font = "12px ui-sans-serif, system-ui";
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      for (let i = 0; i <= 6; i += 1) {
        const value = minY + i / 6 * (maxY - minY);
        const py = y(value);
        ctx.strokeStyle = "rgba(255,255,255,.12)";
        ctx.beginPath();
        ctx.moveTo(pad.left, py);
        ctx.lineTo(width - pad.right, py);
        ctx.stroke();
        ctx.fillStyle = "#9ab0c7";
        ctx.fillText(value.toFixed(1), pad.left - 10, py);
      }
      ctx.strokeStyle = "rgba(255,255,255,.34)";
      ctx.beginPath();
      ctx.moveTo(pad.left, y(0));
      ctx.lineTo(width - pad.right, y(0));
      ctx.stroke();
      const tickEvery = Math.max(1, Math.floor(dataRows.length / 7));
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      dataRows.forEach((row, index) => {
        if (index % tickEvery !== 0 && index !== dataRows.length - 1) return;
        const px = x(index);
        ctx.strokeStyle = "rgba(255,255,255,.06)";
        ctx.beginPath();
        ctx.moveTo(px, pad.top);
        ctx.lineTo(px, height - pad.bottom);
        ctx.stroke();
        ctx.fillStyle = "#9ab0c7";
        ctx.fillText(row.date.slice(0, 4), px, height - pad.bottom + 14);
      });
      drawLine(ctx, dataRows, "actual", x, y, "#f7f8fb", 2.5);
      activeModels().forEach((model) => {
        drawLine(ctx, dataRows, model.key, x, y, model.color, model.width, model.dash || []);
      });
      ctx.save();
      ctx.translate(18, pad.top + plotH / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.fillStyle = "#9ab0c7";
      ctx.font = "700 13px ui-sans-serif, system-ui";
      ctx.textAlign = "center";
      ctx.fillText("NINO", 0, 0);
      ctx.restore();
      ctx.fillStyle = "#9ab0c7";
      ctx.textAlign = "center";
      ctx.fillText(`Closed run after ${state.cutoff}`, pad.left + plotW / 2, height - 18);
    }
    function renderCards() {
      const selected = activeModels()[0] || modelDefs[1];
      const s = score(selected.key);
      const p = score("persistence");
      const allRows = rows();
      const actual = allRows.map((row) => row.actual).filter(Number.isFinite);
      const items = [
        ["Model", selected.label, "Selected closed path", null],
        ["MAE", s.mae, "All post-cutoff months", 3],
        ["Corr", s.corr, "All post-cutoff months", 3],
        ["Direction", s.direction_from_cutoff, "Versus cutoff level", 3],
        ["Amp", s.amp_ratio, "Delta std / truth delta", 3],
        ["Persist MAE", p.mae, "Flat cutoff baseline", 3],
        ["Months", allRows.length, "Autonomous forecast length", 0],
        ["Truth std", actual.length ? Math.sqrt(mean(actual.map((v) => (v - mean(actual)) ** 2))) : NaN, "Observed future spread", 3]
      ];
      document.getElementById("cards").innerHTML = items.map(([name, value, sub, digits]) => `
        <article class="card">
          <div class="name">${name}</div>
          <div class="value">${typeof value === "string" ? value : fmt(value, digits ?? 3)}</div>
          <div class="sub">${sub}</div>
        </article>
      `).join("");
    }
    function render() {
      document.querySelectorAll("#cutoffButtons button").forEach((button) => {
        button.classList.toggle("active", button.textContent === state.cutoff.slice(0, 4));
      });
      document.querySelectorAll("[data-model]").forEach((input) => {
        state.models[input.dataset.model] = input.checked;
      });
      renderCards();
      drawChart();
    }
    buildButtons();
    document.querySelectorAll("[data-model]").forEach((input) => input.addEventListener("change", render));
    window.addEventListener("resize", drawChart);
    render();
  </script>
</body>
</html>
