<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ARA Sphere Atlas</title>
  <script src="./ara_sphere_atlas_data.js"></script>
  <style>
    :root {
      --bg: #090b10;
      --panel: #12161d;
      --panel2: #171d26;
      --line: #29313d;
      --text: #e9edf3;
      --muted: #9aa7b7;
      --gold: #f2c14e;
      --teal: #35d0ba;
      --blue: #6aa8ff;
      --red: #ff6b6b;
      --green: #7bd88f;
      --violet: #b79cff;
      --orange: #f59f65;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    button, select {
      font: inherit;
    }

    .app {
      height: 100vh;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
    }

    .stage {
      position: relative;
      min-width: 0;
      background: #090b10;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .topbar {
      position: absolute;
      inset: 14px 14px auto 14px;
      display: grid;
      grid-template-columns: minmax(280px, 1fr) auto;
      gap: 12px;
      align-items: start;
      pointer-events: none;
    }

    .title-block,
    .toolbar,
    .panel {
      background: rgba(18, 22, 29, 0.90);
      border: 1px solid rgba(116, 137, 164, 0.22);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(12px);
    }

    .title-block {
      border-radius: 8px;
      padding: 12px 14px;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.15;
      font-weight: 760;
      letter-spacing: 0;
    }

    .axis-key {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .axis-key b {
      color: var(--text);
      font-weight: 700;
    }

    .pills {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .pill {
      min-height: 24px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 12px;
      color: var(--text);
      white-space: nowrap;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--teal);
    }

    .toolbar {
      pointer-events: auto;
      border-radius: 8px;
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(3, minmax(110px, 1fr));
      gap: 8px;
      width: min(760px, 54vw);
    }

    .control {
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    .control label {
      color: var(--muted);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0;
      font-weight: 700;
    }

    select {
      width: 100%;
      min-height: 34px;
      color: var(--text);
      background: var(--panel2);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 8px;
    }

    .toggle-row {
      position: absolute;
      left: 14px;
      bottom: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      pointer-events: auto;
    }

    button {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 10px;
      color: var(--text);
      background: rgba(23, 29, 38, 0.92);
      cursor: pointer;
      white-space: nowrap;
    }

    button.active {
      border-color: rgba(242, 193, 78, 0.7);
      color: var(--gold);
      background: rgba(242, 193, 78, 0.1);
    }

    .side {
      min-width: 0;
      height: 100vh;
      overflow: auto;
      padding: 14px;
      background: #0d1016;
      border-left: 1px solid var(--line);
    }

    .panel {
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .panel h2 {
      margin: 0 0 10px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0;
      color: var(--muted);
    }

    .metric-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .metric {
      min-width: 0;
      padding: 9px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 7px;
      background: rgba(255,255,255,0.035);
    }

    .metric .k,
    .kv .key {
      color: var(--muted);
      font-size: 11px;
    }

    .metric .v {
      margin-top: 2px;
      font-weight: 700;
      font-size: 17px;
      font-variant-numeric: tabular-nums;
    }

    .detail-name {
      font-size: 18px;
      line-height: 1.2;
      font-weight: 750;
      margin-bottom: 4px;
    }

    .detail-sub {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 10px;
    }

    .kv {
      display: grid;
      grid-template-columns: 118px 1fr;
      gap: 8px;
      padding: 5px 0;
      border-top: 1px solid rgba(255,255,255,0.06);
    }

    .kv .val {
      font-size: 12px;
      color: var(--text);
      min-width: 0;
      word-break: break-word;
      font-variant-numeric: tabular-nums;
    }

    .legend-row {
      display: grid;
      grid-template-columns: 12px 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 5px 0;
      color: var(--muted);
      font-size: 12px;
    }

    .swatch {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .tooltip {
      position: fixed;
      display: none;
      pointer-events: none;
      z-index: 10;
      max-width: 320px;
      padding: 9px 10px;
      border-radius: 8px;
      background: rgba(12, 15, 20, 0.95);
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow: 0 14px 38px rgba(0,0,0,0.34);
      font-size: 12px;
    }

    .tooltip .t-name {
      font-weight: 750;
      margin-bottom: 4px;
    }

    .tooltip .t-line {
      color: var(--muted);
      margin-top: 2px;
    }

    @media (max-width: 980px) {
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(0, 1fr) 270px;
      }

      .side {
        height: 270px;
        border-left: 0;
        border-top: 1px solid var(--line);
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }

      .toolbar {
        width: min(100%, calc(100vw - 28px));
        grid-template-columns: repeat(2, minmax(120px, 1fr));
      }
    }
  </style>
</head>
<body>
<div class="app">
  <main class="stage" id="stage">
    <canvas id="canvas"></canvas>
    <div class="topbar">
      <section class="title-block">
        <h1>ARA Sphere Atlas</h1>
        <div class="axis-key"><b>Latitude:</b> ARA 0-2 · <b>Longitude:</b> phase degrees · <b>Surface:</b> local wobble displacement</div>
        <div class="pills" id="summaryPills"></div>
      </section>
      <section class="toolbar">
        <div class="control">
          <label for="horizonSelect">Horizon</label>
          <select id="horizonSelect"></select>
        </div>
        <div class="control">
          <label for="phaseSelect">Longitude</label>
          <select id="phaseSelect">
            <option value="clock">Home-cycle degrees</option>
            <option value="wobble">Wobble-vector degrees</option>
            <option value="flow">Flow-direction degrees</option>
            <option value="torsion">Torsion degrees</option>
          </select>
        </div>
        <div class="control">
          <label for="colorSelect">Color</label>
          <select id="colorSelect">
            <option value="layer">Path layer</option>
            <option value="nino">NINO value</option>
            <option value="error">Forecast error</option>
            <option value="torsion">Torsion</option>
          </select>
        </div>
        <div class="control">
          <label for="wobbleSelect">Wobble</label>
          <select id="wobbleSelect">
            <option value="0.00">Flat surface</option>
            <option value="0.10">Subtle</option>
            <option value="0.18" selected>Mapped</option>
            <option value="0.30">Exaggerated</option>
          </select>
        </div>
        <div class="control">
          <label for="trailSelect">Trail</label>
          <select id="trailSelect">
            <option value="all" selected>Full path</option>
            <option value="recent">Recent window</option>
            <option value="transitions">Transitions</option>
          </select>
        </div>
        <div class="control">
          <label for="pointSelect">Points</label>
          <select id="pointSelect">
            <option value="all" selected>All</option>
            <option value="thin">Thin</option>
            <option value="events">Events</option>
          </select>
        </div>
      </section>
    </div>
    <div class="toggle-row">
      <button id="currentBtn" class="active">Current</button>
      <button id="truthBtn" class="active">Truth</button>
      <button id="surfaceBtn" class="active">Wobble Surface</button>
      <button id="terrainBtn">Terrain Level</button>
      <button id="errorBtn" class="active">Error Links</button>
      <button id="arrowsBtn" class="active">Wobble Arrows</button>
      <button id="orbitBtn">Orbit</button>
      <button id="resetBtn">Reset</button>
    </div>
    <div class="tooltip" id="tooltip"></div>
  </main>

  <aside class="side">
    <section class="panel">
      <h2>Forecast Score</h2>
      <div class="metric-grid" id="metricGrid"></div>
    </section>
    <section class="panel">
      <h2>Selected Slice</h2>
      <div id="details"></div>
    </section>
    <section class="panel">
      <h2>Bands</h2>
      <div id="legendList"></div>
    </section>
  </aside>
</div>

<script>
const DATA = window.ARA_SPHERE_ATLAS;
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const stage = document.getElementById("stage");
const tooltip = document.getElementById("tooltip");

let width = 0;
let height = 0;
let dpr = 1;
let yaw = -0.82;
let pitch = 0.34;
let zoom = 1.0;
let autoOrbit = false;
let show = {
  current: true,
  truth: true,
  surface: true,
  terrain: false,
  errors: true,
  arrows: true,
};
let isDragging = false;
let lastMouse = null;
let hovered = null;
let selected = null;
let projected = [];

const pathColors = {
  current: "#35d0ba",
  truth: "#e9edf3",
  surface: "#f2c14e",
  terrain: "#7bd88f",
  error: "rgba(255,107,107,0.42)",
  arrow: "rgba(183,156,255,0.62)",
};

const bandColors = {
  pole: "rgba(233,237,243,0.22)",
  mirror: "rgba(255,107,107,0.46)",
  quarter: "rgba(245,159,101,0.44)",
  balance: "rgba(53,208,186,0.54)",
  phi: "rgba(242,193,78,0.62)",
};

function fmt(value, digits = 3) {
  const v = Number(value);
  if (!Number.isFinite(v)) return "n/a";
  return v.toFixed(digits);
}

function titleCase(value) {
  return String(value || "").replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
}

function initControls() {
  const horizon = document.getElementById("horizonSelect");
  DATA.horizons_months.forEach(h => {
    const option = document.createElement("option");
    option.value = String(h);
    option.textContent = `${h} months`;
    if (h === 12) option.selected = true;
    horizon.appendChild(option);
  });
  ["horizonSelect", "phaseSelect", "colorSelect", "wobbleSelect", "trailSelect", "pointSelect"].forEach(id => {
    document.getElementById(id).addEventListener("input", () => {
      selected = null;
      hovered = null;
      render();
      renderSide();
    });
  });
  wireToggle("currentBtn", "current");
  wireToggle("truthBtn", "truth");
  wireToggle("surfaceBtn", "surface");
  wireToggle("terrainBtn", "terrain");
  wireToggle("errorBtn", "errors");
  wireToggle("arrowsBtn", "arrows");
  document.getElementById("orbitBtn").onclick = () => {
    autoOrbit = !autoOrbit;
    document.getElementById("orbitBtn").classList.toggle("active", autoOrbit);
  };
  document.getElementById("resetBtn").onclick = () => {
    yaw = -0.82;
    pitch = 0.34;
    zoom = 1.0;
    selected = null;
    hovered = null;
    render();
    renderSide();
  };
}

function wireToggle(id, key) {
  document.getElementById(id).onclick = () => {
    show[key] = !show[key];
    document.getElementById(id).classList.toggle("active", show[key]);
    render();
    renderSide();
  };
}

function rows() {
  const horizon = document.getElementById("horizonSelect").value;
  let out = DATA.records_by_horizon[horizon] || [];
  const trail = document.getElementById("trailSelect").value;
  if (trail === "recent") out = out.slice(Math.max(0, out.length - 42));
  if (trail === "transitions") {
    out = out.filter(r => Math.abs(r.actual - r.current) >= 0.5 || Math.abs(r.error.wobble_surface) >= 0.75);
  }
  return out;
}

function activeLayers() {
  const layers = [];
  if (show.current) layers.push("current");
  if (show.truth) layers.push("truth");
  if (show.surface) layers.push("surface");
  if (show.terrain) layers.push("terrain");
  return layers;
}

function layerValue(row, layer) {
  if (layer === "current") return row.current;
  if (layer === "truth") return row.actual;
  if (layer === "surface") return row.wobble_surface_analog;
  if (layer === "terrain") return row.terrain_level_analog;
  return row.current;
}

function layerAra(row, layer) {
  if (layer === "current") return row.ara_current;
  if (layer === "truth") return row.ara_actual;
  if (layer === "surface") return row.ara_wobble_surface;
  if (layer === "terrain") return row.ara_terrain_level;
  return row.ara_current;
}

function phaseBase(row) {
  const mode = document.getElementById("phaseSelect").value;
  if (mode === "clock") return row.phase_clock_origin;
  if (mode === "wobble") return row.phase_wobble_origin;
  if (mode === "flow") return row.phase_flow_origin;
  if (mode === "torsion") return row.phase_torsion_origin;
  return row.phase_clock_origin;
}

function phaseFor(row, layer) {
  if (document.getElementById("phaseSelect").value === "clock") {
    return layer === "current" ? row.phase_clock_origin : row.phase_clock_target;
  }
  const base = phaseBase(row);
  return layer === "current" ? base : (base + row.phase_horizon_offset) % 360;
}

function araY(ara) {
  return 1 - Math.max(0, Math.min(2, Number(ara)));
}

function norm(v) {
  const length = Math.hypot(v.x, v.y, v.z) || 1;
  return { x: v.x / length, y: v.y / length, z: v.z / length };
}

function spherePoint(row, layer, withWobble = true) {
  const ara = layerAra(row, layer);
  const lon = phaseFor(row, layer) * Math.PI / 180;
  const y = araY(ara);
  const ring = Math.sqrt(Math.max(0, 1 - y * y));
  const base = { x: ring * Math.cos(lon), y, z: ring * Math.sin(lon) };
  if (!withWobble) return base;

  const amount = Number(document.getElementById("wobbleSelect").value);
  if (!amount) return base;

  const normal = norm(base);
  const east = { x: -Math.sin(lon), y: 0, z: Math.cos(lon) };
  const north = norm({ x: -y * Math.cos(lon), y: ring, z: -y * Math.sin(lon) });
  const wobble = row.wobble || {};
  const torsion = Number(wobble.torsion || 0);
  const lateral = Number(wobble.x || 0) + 0.18 * torsion;
  const bank = Number(wobble.y || 0);
  const lift = Number(wobble.z || 0);
  return {
    x: base.x + amount * (east.x * lateral + north.x * bank + normal.x * lift),
    y: base.y + amount * (east.y * lateral + north.y * bank + normal.y * lift),
    z: base.z + amount * (east.z * lateral + north.z * bank + normal.z * lift),
  };
}

function rotate(p) {
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  const x1 = p.x * cy - p.z * sy;
  const z1 = p.x * sy + p.z * cy;
  const y2 = p.y * cp - z1 * sp;
  const z2 = p.y * sp + z1 * cp;
  return { x: x1, y: y2, z: z2 };
}

function project(p) {
  const rp = rotate(p);
  const depth = 3.05 - rp.z;
  const scale = Math.min(width, height) * 0.39 * zoom / Math.max(0.45, depth);
  return {
    x: width * 0.5 + rp.x * scale,
    y: height * 0.53 - rp.y * scale,
    z: rp.z,
    scale,
  };
}

function colorFor(row, layer) {
  const mode = document.getElementById("colorSelect").value;
  if (mode === "layer") return pathColors[layer] || "#e9edf3";
  if (mode === "nino") return valueColor(layerValue(row, layer), -2.2, 2.2);
  if (mode === "error") return valueColor(row.error.wobble_surface, -1.6, 1.6);
  if (mode === "torsion") return valueColor(row.wobble.torsion, -1.0, 1.0);
  return pathColors[layer] || "#e9edf3";
}

function valueColor(value, min, max) {
  const t = Math.max(0, Math.min(1, (Number(value) - min) / (max - min)));
  const stops = [
    [0.00, [106, 168, 255]],
    [0.50, [233, 237, 243]],
    [1.00, [255, 107, 107]],
  ];
  const a = t < 0.5 ? stops[0] : stops[1];
  const b = t < 0.5 ? stops[1] : stops[2];
  const local = t < 0.5 ? t * 2 : (t - 0.5) * 2;
  const rgb = [0, 1, 2].map(i => Math.round(a[1][i] + (b[1][i] - a[1][i]) * local));
  return `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
}

function line3(points, color, widthPx = 1.5, dash = null) {
  if (points.length < 2) return;
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = widthPx;
  ctx.lineJoin = "round";
  ctx.lineCap = "round";
  if (dash) ctx.setLineDash(dash);
  ctx.beginPath();
  points.forEach((p, i) => {
    const q = project(p);
    if (i === 0) ctx.moveTo(q.x, q.y);
    else ctx.lineTo(q.x, q.y);
  });
  ctx.stroke();
  ctx.restore();
}

function drawSphere() {
  const equator = [];
  for (let i = 0; i <= 240; i++) {
    const lon = (i / 240) * Math.PI * 2;
    equator.push({ x: Math.cos(lon), y: 0, z: Math.sin(lon) });
  }
  line3(equator, "rgba(255,255,255,0.16)", 1.2);

  for (let deg = 0; deg < 360; deg += 30) {
    const lon = deg * Math.PI / 180;
    const pts = [];
    for (let j = 0; j <= 120; j++) {
      const y = -1 + (j / 120) * 2;
      const r = Math.sqrt(Math.max(0, 1 - y * y));
      pts.push({ x: r * Math.cos(lon), y, z: r * Math.sin(lon) });
    }
    line3(pts, deg % 90 === 0 ? "rgba(106,168,255,0.18)" : "rgba(106,168,255,0.08)", 1);
  }

  DATA.ara_bands.forEach(band => {
    const y = araY(band.value);
    const r = Math.sqrt(Math.max(0, 1 - y * y));
    const pts = [];
    for (let i = 0; i <= 240; i++) {
      const lon = (i / 240) * Math.PI * 2;
      pts.push({ x: r * Math.cos(lon), y, z: r * Math.sin(lon) });
    }
    const color = bandColors[band.kind] || "rgba(255,255,255,0.22)";
    line3(pts, color, band.kind === "phi" || band.kind === "balance" ? 2.1 : 1.3);
    const labelPoint = project({ x: r, y, z: 0 });
    labelText(band.label, labelPoint.x + 8, labelPoint.y, color, "left");
  });
}

function labelText(text, x, y, color, align = "center") {
  if (x < 12 || x > width - 12 || y < 12 || y > height - 12) return;
  ctx.save();
  ctx.font = "700 11px Inter, system-ui, sans-serif";
  ctx.textAlign = align;
  ctx.textBaseline = "middle";
  ctx.lineWidth = 4;
  ctx.strokeStyle = "rgba(9,11,16,0.78)";
  ctx.fillStyle = color;
  ctx.strokeText(text, x, y);
  ctx.fillText(text, x, y);
  ctx.restore();
}

function drawPaths() {
  projected = [];
  const dataRows = rows();
  const pointMode = document.getElementById("pointSelect").value;
  const layers = activeLayers();

  if (show.errors && show.truth && show.surface) {
    dataRows.forEach(row => {
      const a = spherePoint(row, "truth");
      const b = spherePoint(row, "surface");
      const err = Math.abs(row.error.wobble_surface);
      if (err > 0.55) line3([a, b], `rgba(255,107,107,${Math.min(0.62, 0.16 + err * 0.18)})`, 1.1);
    });
  }

  layers.forEach(layer => {
    const pts = dataRows.map(row => spherePoint(row, layer));
    line3(pts, pathColors[layer] || "#e9edf3", layer === "truth" ? 2.8 : 2.1, layer === "current" ? [7, 6] : null);
  });

  layers.forEach(layer => {
    dataRows.forEach((row, index) => {
      if (pointMode === "thin" && index % 3 !== 0) return;
      const event = Math.abs(row.actual - row.current) >= 0.5 || Math.abs(row.error.wobble_surface) >= 0.75;
      if (pointMode === "events" && !event) return;
      const p3 = spherePoint(row, layer);
      const p = project(p3);
      const radius = event ? 5.2 : 3.5;
      const color = colorFor(row, layer);
      ctx.save();
      ctx.globalAlpha = p.z < -0.85 ? 0.48 : 1;
      ctx.beginPath();
      ctx.arc(p.x, p.y, radius + 3, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(0,0,0,0.26)";
      ctx.fill();
      ctx.beginPath();
      ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.strokeStyle = row.id === selected?.id && layer === selected?.layer ? "#ffffff" : "rgba(255,255,255,0.34)";
      ctx.lineWidth = row.id === selected?.id && layer === selected?.layer ? 2.4 : 1;
      ctx.stroke();
      ctx.restore();
      projected.push({ id: row.id, layer, row, x: p.x, y: p.y, radius: radius + 5 });
    });
  });

  if (show.arrows) {
    dataRows.forEach((row, index) => {
      if (index % 4 !== 0) return;
      const start = spherePoint(row, "current");
      const wob = row.wobble;
      const end = {
        x: start.x + 0.05 * Number(wob.x_v3 || 0),
        y: start.y + 0.05 * Number(wob.y_v3 || 0),
        z: start.z + 0.05 * Number(wob.z_v3 || 0),
      };
      line3([start, end], pathColors.arrow, 1.2);
    });
  }
}

function render() {
  ctx.clearRect(0, 0, width, height);
  ctx.fillStyle = "#090b10";
  ctx.fillRect(0, 0, width, height);
  drawSphere();
  drawPaths();
  renderSummaryPills();
}

function renderSummaryPills() {
  const el = document.getElementById("summaryPills");
  const r = rows();
  const araVals = r.map(row => row.ara_current);
  el.innerHTML = `
    <span class="pill"><span class="dot" style="background:var(--teal)"></span>${r.length} slices</span>
    <span class="pill"><span class="dot" style="background:var(--gold)"></span>ARA ${fmt(Math.min(...araVals), 3)}-${fmt(Math.max(...araVals), 3)}</span>
    <span class="pill"><span class="dot" style="background:var(--violet)"></span>${document.getElementById("phaseSelect").selectedOptions[0].textContent}</span>
  `;
}

function renderSide() {
  renderMetrics();
  renderDetails();
  renderLegend();
}

function scoreFor(model) {
  const h = document.getElementById("horizonSelect").value;
  return DATA.point_scores[model]?.[h] || {};
}

function renderMetrics() {
  const score = scoreFor("wobble_surface_analog");
  const pers = scoreFor("persistence");
  document.getElementById("metricGrid").innerHTML = `
    <div class="metric"><div class="k">Surface MAE</div><div class="v">${fmt(score.mae)}</div></div>
    <div class="metric"><div class="k">Persistence MAE</div><div class="v">${fmt(pers.mae)}</div></div>
    <div class="metric"><div class="k">Corr</div><div class="v">${fmt(score.corr)}</div></div>
    <div class="metric"><div class="k">Turn</div><div class="v">${fmt(score.turn_accuracy)}</div></div>
    <div class="metric"><div class="k">Trans MAE</div><div class="v">${fmt(score.transition_mae)}</div></div>
    <div class="metric"><div class="k">Horizon</div><div class="v">${document.getElementById("horizonSelect").value}m</div></div>
  `;
}

function renderDetails() {
  const el = document.getElementById("details");
  const item = selected || hovered;
  if (!item) {
    el.innerHTML = `<div class="detail-sub">No slice selected.</div>`;
    return;
  }
  const row = item.row;
  const layer = item.layer;
  el.innerHTML = `
    <div class="detail-name" style="color:${pathColors[layer] || "#e9edf3"}">${titleCase(layer)} / ${row.target}</div>
    <div class="detail-sub">origin ${row.origin}</div>
    ${kv("Value", fmt(layerValue(row, layer)))}
    ${kv("ARA", fmt(layerAra(row, layer)))}
    ${kv("Longitude", `${fmt(phaseFor(row, layer), 1)} deg`)}
    ${kv("Current", fmt(row.current))}
    ${kv("Truth", fmt(row.actual))}
    ${kv("Surface pred", fmt(row.wobble_surface_analog))}
    ${kv("Surface error", fmt(row.error.wobble_surface))}
    ${kv("Wobble x/y/z", `${fmt(row.wobble.x)} / ${fmt(row.wobble.y)} / ${fmt(row.wobble.z)}`)}
    ${kv("Velocity x/y/z", `${fmt(row.wobble.x_v3)} / ${fmt(row.wobble.y_v3)} / ${fmt(row.wobble.z_v3)}`)}
    ${kv("Torsion", fmt(row.wobble.torsion))}
    ${kv("Spin N/S", `${fmt(row.wobble.nino_spin)} / ${fmt(row.wobble.soi_spin)}`)}
  `;
}

function kv(key, value) {
  return `<div class="kv"><div class="key">${key}</div><div class="val">${value}</div></div>`;
}

function renderLegend() {
  const rows = DATA.ara_bands.map(b => {
    const color = bandColors[b.kind] || "rgba(255,255,255,0.22)";
    return `<div class="legend-row"><span class="swatch" style="background:${color}"></span><span>${b.label}</span><span>${fmt(b.value, 3)}</span></div>`;
  }).join("");
  const paths = [
    ["Current", pathColors.current],
    ["Truth", pathColors.truth],
    ["Wobble surface", pathColors.surface],
    ["Terrain level", pathColors.terrain],
  ].map(([name, color]) => `<div class="legend-row"><span class="swatch" style="background:${color}"></span><span>${name}</span><span></span></div>`).join("");
  document.getElementById("legendList").innerHTML = rows + paths;
}

function resize() {
  const rect = stage.getBoundingClientRect();
  dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  width = Math.floor(rect.width);
  height = Math.floor(rect.height);
  canvas.width = Math.floor(width * dpr);
  canvas.height = Math.floor(height * dpr);
  canvas.style.width = width + "px";
  canvas.style.height = height + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  render();
}

function updateHover(event) {
  const rect = canvas.getBoundingClientRect();
  const x = event.clientX - rect.left;
  const y = event.clientY - rect.top;
  let best = null;
  let bestD = Infinity;
  projected.forEach(p => {
    const d = Math.hypot(p.x - x, p.y - y) - p.radius;
    if (d < bestD) { bestD = d; best = p; }
  });
  hovered = best && bestD < 8 ? best : null;
  if (hovered) {
    const row = hovered.row;
    tooltip.innerHTML = `
      <div class="t-name" style="color:${pathColors[hovered.layer] || "#e9edf3"}">${titleCase(hovered.layer)} / ${row.target}</div>
      <div class="t-line">ARA ${fmt(layerAra(row, hovered.layer))} · ${fmt(phaseFor(row, hovered.layer), 1)} deg</div>
      <div class="t-line">truth ${fmt(row.actual)} · surface ${fmt(row.wobble_surface_analog)} · err ${fmt(row.error.wobble_surface)}</div>
    `;
    tooltip.style.display = "block";
    tooltip.style.left = Math.min(event.clientX + 14, window.innerWidth - 340) + "px";
    tooltip.style.top = Math.max(12, event.clientY - 18) + "px";
  } else {
    tooltip.style.display = "none";
  }
  render();
  renderDetails();
}

canvas.addEventListener("mousedown", event => {
  isDragging = true;
  lastMouse = { x: event.clientX, y: event.clientY };
});

window.addEventListener("mousemove", event => {
  if (isDragging && lastMouse) {
    yaw += (event.clientX - lastMouse.x) * 0.006;
    pitch += (event.clientY - lastMouse.y) * 0.006;
    pitch = Math.max(-1.28, Math.min(1.28, pitch));
    lastMouse = { x: event.clientX, y: event.clientY };
    render();
  } else if (event.target === canvas) {
    updateHover(event);
  }
});

window.addEventListener("mouseup", () => {
  isDragging = false;
  lastMouse = null;
});

canvas.addEventListener("mouseleave", () => {
  hovered = null;
  tooltip.style.display = "none";
  render();
  renderDetails();
});

canvas.addEventListener("click", () => {
  if (hovered) {
    selected = hovered;
    render();
    renderSide();
  }
});

canvas.addEventListener("wheel", event => {
  event.preventDefault();
  zoom *= Math.exp(-event.deltaY * 0.001);
  zoom = Math.max(0.42, Math.min(3.2, zoom));
  render();
}, { passive: false });

function animate() {
  if (autoOrbit) {
    yaw += 0.003;
    render();
  }
  requestAnimationFrame(animate);
}

initControls();
resize();
renderSide();
window.addEventListener("resize", resize);
requestAnimationFrame(animate);
</script>
</body>
</html>
