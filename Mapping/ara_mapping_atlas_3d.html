<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARA Mapping Atlas 3D</title>
<style>
:root {
  --bg: #090b10;
  --panel: #12161d;
  --panel2: #171d26;
  --line: #29313d;
  --text: #e9edf3;
  --muted: #9aa7b7;
  --gold: #f2c14e;
  --teal: #35d0ba;
  --blue: #6aa8ff;
  --red: #ff6b6b;
  --green: #7bd88f;
  --violet: #b79cff;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  overflow: hidden;
}
button, select, input {
  font: inherit;
}
.app {
  height: 100vh;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 360px;
}
.stage {
  position: relative;
  min-width: 0;
  background:
    radial-gradient(circle at 15% 12%, rgba(53, 208, 186, 0.08), transparent 26%),
    radial-gradient(circle at 75% 72%, rgba(242, 193, 78, 0.07), transparent 28%),
    #090b10;
}
canvas {
  width: 100%;
  height: 100%;
  display: block;
}
.topbar {
  position: absolute;
  inset: 14px 14px auto 14px;
  display: grid;
  grid-template-columns: minmax(260px, 1fr) auto;
  gap: 12px;
  align-items: start;
  pointer-events: none;
}
.title-block,
.toolbar,
.panel {
  background: rgba(18, 22, 29, 0.88);
  border: 1px solid rgba(116, 137, 164, 0.22);
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
  backdrop-filter: blur(12px);
}
.title-block {
  border-radius: 8px;
  padding: 12px 14px;
}
h1 {
  margin: 0;
  font-size: 18px;
  line-height: 1.15;
  letter-spacing: 0;
}
.axis-key {
  margin-top: 6px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.35;
}
.axis-key b {
  color: var(--text);
  font-weight: 700;
}
.meta {
  margin-top: 6px;
  color: var(--muted);
  font-size: 12px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 24px;
  padding: 2px 8px;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);
  color: var(--text);
  white-space: nowrap;
}
.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--teal);
}
.toolbar {
  pointer-events: auto;
  border-radius: 8px;
  padding: 10px;
  display: grid;
  grid-template-columns: repeat(3, minmax(88px, 1fr));
  gap: 8px;
  width: min(620px, 48vw);
}
.control {
  display: grid;
  gap: 4px;
  min-width: 0;
}
.control label {
  color: var(--muted);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
select,
input[type="search"] {
  width: 100%;
  min-height: 34px;
  color: var(--text);
  background: var(--panel2);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 6px 8px;
}
.toggle-row {
  position: absolute;
  left: 14px;
  bottom: 14px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  pointer-events: auto;
}
button {
  min-height: 34px;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 6px 10px;
  color: var(--text);
  background: rgba(23, 29, 38, 0.92);
  cursor: pointer;
}
button.active {
  border-color: rgba(242, 193, 78, 0.7);
  color: var(--gold);
  background: rgba(242, 193, 78, 0.1);
}
.side {
  min-width: 0;
  height: 100vh;
  overflow: auto;
  padding: 14px;
  background: #0d1016;
  border-left: 1px solid var(--line);
}
.panel {
  border-radius: 8px;
  padding: 12px;
  margin-bottom: 12px;
}
.panel h2 {
  margin: 0 0 10px;
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
}
.metric-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.metric {
  min-width: 0;
  padding: 9px;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 7px;
  background: rgba(255,255,255,0.035);
}
.metric .k {
  color: var(--muted);
  font-size: 11px;
}
.metric .v {
  margin-top: 2px;
  font-weight: 700;
  font-size: 17px;
}
.detail-name {
  font-size: 18px;
  line-height: 1.2;
  font-weight: 750;
  margin-bottom: 4px;
}
.detail-sub {
  color: var(--muted);
  font-size: 12px;
  margin-bottom: 10px;
}
.kv {
  display: grid;
  grid-template-columns: 112px minmax(0, 1fr);
  gap: 7px;
  padding: 5px 0;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  font-size: 12px;
}
.kv:last-child { border-bottom: 0; }
.kv .key { color: var(--muted); }
.kv .val {
  overflow-wrap: anywhere;
  text-align: right;
}
.relation {
  display: grid;
  gap: 4px;
  padding: 8px;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 7px;
  background: rgba(255,255,255,0.035);
  margin-bottom: 7px;
  cursor: pointer;
}
.relation:hover {
  border-color: rgba(106, 168, 255, 0.45);
}
.relation .kind {
  font-size: 11px;
  color: var(--gold);
  text-transform: uppercase;
  letter-spacing: 0.07em;
}
.relation .ends {
  font-size: 12px;
  line-height: 1.35;
}
.relation .score {
  color: var(--muted);
  font-size: 11px;
}
.legend-list {
  display: grid;
  gap: 6px;
}
.legend-row {
  display: grid;
  grid-template-columns: 12px 1fr auto;
  gap: 7px;
  align-items: center;
  font-size: 12px;
}
.legend-row .swatch {
  width: 10px;
  height: 10px;
  border-radius: 50%;
}
.legend-row .count {
  color: var(--muted);
}
.tooltip {
  position: absolute;
  min-width: 220px;
  max-width: 320px;
  z-index: 12;
  display: none;
  pointer-events: none;
  padding: 10px 12px;
  border-radius: 7px;
  color: var(--text);
  background: rgba(10, 13, 18, 0.96);
  border: 1px solid rgba(255,255,255,0.18);
  box-shadow: 0 14px 36px rgba(0,0,0,0.42);
  font-size: 12px;
}
.tooltip .t-name {
  font-weight: 750;
  font-size: 13px;
  margin-bottom: 4px;
}
.tooltip .t-line {
  color: var(--muted);
  margin-top: 2px;
}
.empty {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.45;
}
@media (max-width: 980px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100vh; grid-template-columns: 1fr; }
  .stage { height: 68vh; min-height: 520px; }
  .side { height: auto; border-left: 0; border-top: 1px solid var(--line); }
  .topbar { grid-template-columns: 1fr; }
  .toolbar { width: auto; grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>
<div class="app">
  <main class="stage" id="stage">
    <canvas id="canvas"></canvas>
    <div class="topbar">
      <section class="title-block">
        <h1>ARA Mapping Atlas 3D</h1>
        <div class="axis-key">
          <b>X</b> period phi-rung / <b>Y</b> fixed ARA position with quarter markers, phi, and &gt;2 pinned to diagnostic rail / <b>Z</b> log10 weight: Action/pi, fitted amplitude, or state energy
        </div>
        <div class="meta" id="summaryPills"></div>
      </section>
      <section class="toolbar">
        <div class="control">
          <label for="layerFilter">Layer</label>
          <select id="layerFilter"></select>
        </div>
        <div class="control">
          <label for="classFilter">ARA Class</label>
          <select id="classFilter"></select>
        </div>
        <div class="control">
          <label for="domainFilter">Scale</label>
          <select id="domainFilter"></select>
        </div>
        <div class="control">
          <label for="relationFilter">Relations</label>
          <select id="relationFilter">
            <option value="all">All</option>
            <option value="catalog">Catalog</option>
            <option value="derived">Derived</option>
            <option value="off">Off</option>
          </select>
        </div>
        <div class="control">
          <label for="colorMode">Color</label>
          <select id="colorMode">
            <option value="class">ARA class</option>
            <option value="layer">Layer</option>
            <option value="domain">Scale</option>
            <option value="system">System</option>
          </select>
        </div>
        <div class="control">
          <label for="searchInput">Search</label>
          <input id="searchInput" type="search" placeholder="system or node">
        </div>
      </section>
    </div>
    <div class="toggle-row">
      <button id="ringsBtn" class="active">Rings</button>
      <button id="linksBtn" class="active">Links</button>
      <button id="trianglesBtn" class="active">Triangles</button>
      <button id="labelsBtn">Labels</button>
      <button id="orbitBtn">Orbit</button>
      <button id="resetBtn">Reset</button>
    </div>
    <div class="tooltip" id="tooltip"></div>
  </main>
  <aside class="side">
    <section class="panel">
      <h2>Atlas</h2>
      <div class="metric-grid" id="metricGrid"></div>
    </section>
    <section class="panel">
      <h2>Selected Node</h2>
      <div id="details"></div>
    </section>
    <section class="panel">
      <h2>Nearby Relations</h2>
      <div id="relationList"></div>
    </section>
    <section class="panel">
      <h2>Legend</h2>
      <div class="legend-list" id="legendList"></div>
    </section>
  </aside>
</div>

<script src="ara_mapping_atlas_data.js"></script>
<script>
const DATA = window.ARA_MAPPING_ATLAS;
const PHI = DATA.phi;
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const stage = document.getElementById("stage");
const tooltip = document.getElementById("tooltip");

let width = 0;
let height = 0;
let dpr = 1;
let yaw = -0.72;
let pitch = 0.45;
let zoom = 1.0;
let autoOrbit = false;
let showRings = true;
let showLinks = true;
let showTriangles = true;
let showLabels = false;
let isDragging = false;
let lastMouse = null;
let hoveredId = null;
let selectedId = null;
let highlightedRelation = null;
let highlightedTriangle = null;
let projectedNodes = [];

const nodes = DATA.nodes.map(n => ({...n}));
const nodeById = new Map(nodes.map(n => [n.id, n]));
const relations = DATA.relations.filter(r => nodeById.has(r.from) && nodeById.has(r.to));
const triangles = (DATA.triangles || []).filter(t => t.nodes.every(id => nodeById.has(id)));

const classColors = {
  snap: "#ff6b6b",
  consumer: "#f59f65",
  balance_clock: "#6aa8ff",
  shock_absorber: "#35d0ba",
  engine_phi: "#f2c14e",
  donor_wall: "#ff9f1c",
  resonant_pair: "#7bd88f",
  coupled_extreme: "#b79cff",
  overflow: "#d36fff",
  unknown: "#9aa7b7"
};
const layerColors = {
  catalog: "#6aa8ff",
  measured_fit: "#f2c14e",
  state_geometry: "#35d0ba",
  mapped_extension: "#ffb86b"
};
const domainColors = {
  quantum_atomic: "#b79cff",
  micro_fast: "#ef7a85",
  human_fast: "#6aa8ff",
  daily_biological: "#7bd88f",
  earth_climate: "#f2c14e",
  geological: "#f59f65",
  cosmic: "#d36fff"
};
const relationColors = {
  handoff: "rgba(123,216,143,0.34)",
  feeder: "rgba(106,168,255,0.30)",
  counter_pair: "rgba(255,107,107,0.46)",
  same_rung_match: "rgba(242,193,78,0.20)",
  vertical_ara_match: "rgba(53,208,186,0.18)",
  boundary_match: "rgba(183,156,255,0.18)",
  mapped_vertical_partner: "rgba(255,184,107,0.34)",
  mapped_feeder: "rgba(106,168,255,0.34)",
  mapped_forcing_gate: "rgba(183,156,255,0.34)",
  mapped_counter_pair: "rgba(255,107,107,0.38)",
  mapped_balance_gate: "rgba(53,208,186,0.30)",
  mapped_rung_collapse: "rgba(248,81,73,0.42)",
  mapped_arc_progression: "rgba(123,216,143,0.30)",
  mapped_scale_ladder_step: "rgba(255,255,255,0.24)",
  mapped_compound_decomposition: "rgba(255,184,107,0.44)",
  mapped_coupled_subsystem_pair: "rgba(183,156,255,0.40)"
};

function fmt(value, digits = 3) {
  if (value === null || value === undefined || Number.isNaN(value)) return "n/a";
  const v = Number(value);
  if (!Number.isFinite(v)) return "n/a";
  if (Math.abs(v) >= 1e5 || Math.abs(v) < 1e-3 && v !== 0) return v.toExponential(2);
  return v.toFixed(digits);
}

function fmtPeriod(seconds) {
  const s = Number(seconds);
  if (s < 1e-15) return fmt(s * 1e18, 1) + " as";
  if (s < 1e-12) return fmt(s * 1e15, 1) + " fs";
  if (s < 1e-9) return fmt(s * 1e12, 1) + " ps";
  if (s < 1e-6) return fmt(s * 1e9, 1) + " ns";
  if (s < 1e-3) return fmt(s * 1e6, 1) + " us";
  if (s < 1) return fmt(s * 1e3, 1) + " ms";
  if (s < 60) return fmt(s, 2) + " s";
  if (s < 3600) return fmt(s / 60, 2) + " min";
  if (s < 86400) return fmt(s / 3600, 2) + " hr";
  if (s < 365.25 * 86400) return fmt(s / 86400, 2) + " d";
  if (s < 1e6 * 365.25 * 86400) return fmt(s / (365.25 * 86400), 2) + " yr";
  return fmt(s / (1e6 * 365.25 * 86400), 2) + " Myr";
}

function titleCase(value) {
  return String(value || "unknown").replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
}

function hashColor(text) {
  let h = 0;
  for (let i = 0; i < text.length; i++) h = (h * 31 + text.charCodeAt(i)) >>> 0;
  const hue = h % 360;
  return `hsl(${hue} 72% 62%)`;
}

function nodeColor(n) {
  const mode = document.getElementById("colorMode").value;
  if (mode === "layer") return layerColors[n.layer] || "#9aa7b7";
  if (mode === "domain") return domainColors[n.scale_domain] || "#9aa7b7";
  if (mode === "system") return hashColor(n.system);
  return classColors[n.ara_class] || "#9aa7b7";
}

function araView(ara) {
  if (ara === null || ara === undefined || !Number.isFinite(Number(ara))) return 1;
  const a = Number(ara);
  return Math.max(0, Math.min(2, a));
}

function makeOptions(selectId, values, labels, allLabel) {
  const el = document.getElementById(selectId);
  el.innerHTML = "";
  const all = document.createElement("option");
  all.value = "all";
  all.textContent = allLabel || "All";
  el.appendChild(all);
  values.forEach(v => {
    const opt = document.createElement("option");
    opt.value = v;
    opt.textContent = labels ? labels(v) : titleCase(v);
    el.appendChild(opt);
  });
}

function initControls() {
  const layers = [...new Set(nodes.map(n => n.layer))].sort();
  const classes = [...new Set(nodes.map(n => n.ara_class))].sort();
  const domains = [...new Set(nodes.map(n => n.scale_domain))].sort();
  makeOptions("layerFilter", layers, titleCase, "All layers");
  makeOptions("classFilter", classes, titleCase, "All classes");
  makeOptions("domainFilter", domains, titleCase, "All scales");
  ["layerFilter", "classFilter", "domainFilter", "relationFilter", "colorMode", "searchInput"].forEach(id => {
    document.getElementById(id).addEventListener("input", () => {
      selectedId = selectedId && visibleNodes().some(n => n.id === selectedId) ? selectedId : null;
      highlightedRelation = null;
      highlightedTriangle = null;
      render();
      renderSide();
    });
  });
  document.getElementById("ringsBtn").onclick = () => toggleButton("ringsBtn", "showRings");
  document.getElementById("linksBtn").onclick = () => toggleButton("linksBtn", "showLinks");
  document.getElementById("trianglesBtn").onclick = () => toggleButton("trianglesBtn", "showTriangles");
  document.getElementById("labelsBtn").onclick = () => toggleButton("labelsBtn", "showLabels");
  document.getElementById("orbitBtn").onclick = () => toggleButton("orbitBtn", "autoOrbit");
  document.getElementById("resetBtn").onclick = () => {
    yaw = -0.72; pitch = 0.45; zoom = 1; selectedId = null; highlightedRelation = null; highlightedTriangle = null;
    render(); renderSide();
  };
}

function toggleButton(id, variableName) {
  if (variableName === "showRings") showRings = !showRings;
  if (variableName === "showLinks") showLinks = !showLinks;
  if (variableName === "showTriangles") showTriangles = !showTriangles;
  if (variableName === "showLabels") showLabels = !showLabels;
  if (variableName === "autoOrbit") autoOrbit = !autoOrbit;
  const active = {showRings, showLinks, showTriangles, showLabels, autoOrbit}[variableName];
  document.getElementById(id).classList.toggle("active", active);
  render();
  renderSide();
}

function visibleNodes() {
  const layer = document.getElementById("layerFilter").value;
  const klass = document.getElementById("classFilter").value;
  const domain = document.getElementById("domainFilter").value;
  const query = document.getElementById("searchInput").value.trim().toLowerCase();
  return nodes.filter(n => {
    if (layer !== "all" && n.layer !== layer) return false;
    if (klass !== "all" && n.ara_class !== klass) return false;
    if (domain !== "all" && n.scale_domain !== domain) return false;
    if (query) {
      const hay = `${n.name} ${n.system_label} ${n.system} ${n.ara_class} ${n.scale_domain}`.toLowerCase();
      if (!hay.includes(query)) return false;
    }
    return true;
  });
}

function visibleRelations(vNodes) {
  if (!showLinks) return [];
  const mode = document.getElementById("relationFilter").value;
  if (mode === "off") return [];
  const ids = new Set(vNodes.map(n => n.id));
  return relations.filter(r => {
    if (!ids.has(r.from) || !ids.has(r.to)) return false;
    if (mode === "catalog" && r.source !== "original_catalogue") return false;
    if (mode === "derived" && r.source === "original_catalogue") return false;
    return true;
  });
}

function visibleTriangles(vNodes) {
  if (!showTriangles) return [];
  const ids = new Set(vNodes.map(n => n.id));
  return triangles.filter(t => t.nodes.every(id => ids.has(id)));
}

function ranges(vNodes) {
  const vals = (keyFn) => vNodes.map(keyFn).filter(v => Number.isFinite(v));
  const x = vals(n => n.period_phi_rung);
  const z = vals(n => n.weight_log10);
  function padRange(arr, pad = 0.08) {
    let min = Math.min(...arr), max = Math.max(...arr);
    if (!Number.isFinite(min) || !Number.isFinite(max)) return [0, 1];
    if (Math.abs(max - min) < 1e-9) { min -= 1; max += 1; }
    const p = (max - min) * pad;
    return [min - p, max + p];
  }
  return { x: padRange(x), y: [0, 2], z: padRange(z) };
}

function norm(value, range) {
  return ((value - range[0]) / (range[1] - range[0]) - 0.5) * 2;
}

function dataPoint(n, r) {
  return {
    x: norm(n.period_phi_rung, r.x),
    y: norm(araView(n.ara), r.y),
    z: norm(n.weight_log10, r.z)
  };
}

function rotate(p) {
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  const x1 = p.x * cy - p.z * sy;
  const z1 = p.x * sy + p.z * cy;
  const y2 = p.y * cp - z1 * sp;
  const z2 = p.y * sp + z1 * cp;
  return {x: x1, y: y2, z: z2};
}

function project(p) {
  const rp = rotate(p);
  const depth = 3.4 - rp.z;
  const scale = Math.min(width, height) * 0.36 * zoom / Math.max(0.35, depth);
  return {
    x: width * 0.5 + rp.x * scale,
    y: height * 0.53 - rp.y * scale,
    z: rp.z,
    scale
  };
}

function drawLine3D(a, b, color, widthPx = 1, dash = null) {
  const pa = project(a), pb = project(b);
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = widthPx;
  if (dash) ctx.setLineDash(dash);
  ctx.beginPath();
  ctx.moveTo(pa.x, pa.y);
  ctx.lineTo(pb.x, pb.y);
  ctx.stroke();
  ctx.restore();
}

function drawText(text, x, y, color = "rgba(233,237,243,0.78)", size = 11, align = "center") {
  ctx.save();
  ctx.font = `${size}px Inter, system-ui, sans-serif`;
  ctx.fillStyle = color;
  ctx.textAlign = align;
  ctx.textBaseline = "middle";
  ctx.fillText(text, x, y);
  ctx.restore();
}

function drawAxisLabel(text, point, color, align = "center") {
  const p = project(point);
  if (p.x < 18 || p.x > width - 18 || p.y < 18 || p.y > height - 18) return;
  ctx.save();
  ctx.font = "700 12px Inter, system-ui, sans-serif";
  ctx.textAlign = align;
  ctx.textBaseline = "middle";
  ctx.lineJoin = "round";
  ctx.lineWidth = 4;
  ctx.strokeStyle = "rgba(9,11,16,0.82)";
  ctx.fillStyle = color;
  ctx.strokeText(text, p.x, p.y);
  ctx.fillText(text, p.x, p.y);
  ctx.restore();
}

function araMarkerStyle(marker) {
  if (marker.kind === "phi" || marker.name === "phi") {
    return { color: "rgba(242,193,78,0.52)", width: 2.2, font: 10 };
  }
  if (marker.kind === "balance" || marker.name === "balance") {
    return { color: "rgba(53,208,186,0.46)", width: 1.8, font: 10 };
  }
  if (marker.name === "anti_phi_quarter" || marker.name === "lower_wall") {
    return { color: "rgba(255,107,107,0.42)", width: 1.6, font: 10 };
  }
  if (marker.kind === "terminal") {
    return { color: "rgba(233,237,243,0.24)", width: 1.3, font: 10 };
  }
  return { color: "rgba(183,156,255,0.22)", width: 1, font: 9 };
}

function drawGrid(r) {
  if (!showRings) return;
  const xMin = Math.ceil(r.x[0] / 10) * 10;
  const xMax = Math.floor(r.x[1] / 10) * 10;
  for (let k = xMin; k <= xMax; k += 10) {
    const x = norm(k, r.x);
    drawLine3D({x, y:-1, z:-1}, {x, y:1, z:-1}, "rgba(106,168,255,0.14)", 1);
    drawLine3D({x, y:-1, z:-1}, {x, y:-1, z:1}, "rgba(106,168,255,0.08)", 1);
    const p = project({x, y:-1.08, z:-1});
    if (p.x > 28 && p.x < width - 28 && p.y > 28 && p.y < height - 28) {
      drawText(`phi^${k}`, p.x, p.y, "rgba(154,167,183,0.62)", 10);
    }
  }
  const araMarkers = DATA.ara_axis_markers || DATA.ara_boundaries;
  araMarkers.forEach(b => {
    const yVal = araView(b.value);
    if (yVal < r.y[0] || yVal > r.y[1]) return;
    const y = norm(yVal, r.y);
    const style = araMarkerStyle(b);
    drawLine3D({x:-1, y, z:-1}, {x:1, y, z:-1}, style.color, style.width);
    const p = project({x:-1.05, y, z:-1});
    if (p.x > 20 && p.y > 20 && p.y < height - 20) {
      drawText(b.label || b.name, p.x, p.y, style.color, style.font, "right");
    }
  });
  drawLine3D({x:-1,y:-1,z:-1}, {x:1,y:-1,z:-1}, "rgba(233,237,243,0.26)", 1.5);
  drawLine3D({x:-1,y:-1,z:-1}, {x:-1,y:1,z:-1}, "rgba(233,237,243,0.26)", 1.5);
  drawLine3D({x:-1,y:-1,z:-1}, {x:-1,y:-1,z:1}, "rgba(233,237,243,0.26)", 1.5);
  drawAxisLabel("X: period phi-rung", {x:1.12,y:-1.08,z:-1}, "rgba(106,168,255,0.92)");
  drawAxisLabel("Y: ARA position (0-2 full axis)", {x:-1.08,y:1.1,z:-1}, "rgba(242,193,78,0.92)", "right");
  drawAxisLabel("Z: log10 weight", {x:-1.08,y:-1.08,z:1.12}, "rgba(183,156,255,0.92)", "right");
}

function relationAllowedForHeavyDraw(rel) {
  if (rel.source === "original_catalogue") return true;
  if (highlightedRelation && highlightedRelation.id === rel.id) return true;
  if (selectedId && (rel.from === selectedId || rel.to === selectedId)) return true;
  return rel.score >= 0.72;
}

function drawRelations(vRelations, r) {
  if (!showLinks) return;
  vRelations.forEach(rel => {
    if (!relationAllowedForHeavyDraw(rel)) return;
    const a = nodeById.get(rel.from), b = nodeById.get(rel.to);
    const color = highlightedRelation && highlightedRelation.id === rel.id
      ? "rgba(255,255,255,0.78)"
      : (relationColors[rel.type] || "rgba(255,255,255,0.16)");
    const widthPx = highlightedRelation && highlightedRelation.id === rel.id ? 2.8 : (rel.source === "original_catalogue" ? 1.2 : 0.8);
    drawLine3D(dataPoint(a, r), dataPoint(b, r), color, widthPx, rel.source === "original_catalogue" ? null : [5, 5]);
  });
}

function trianglePalette(t, isHighlighted, touchesSelected) {
  const bridge = t.type === "state_bridge_face";
  const baseFill = bridge ? "53,208,186" : "242,193,78";
  const baseStroke = bridge ? "53,208,186" : "242,193,78";
  return {
    fill: isHighlighted
      ? `rgba(${baseFill},0.28)`
      : touchesSelected
        ? `rgba(${baseFill},0.18)`
        : `rgba(${baseFill},0.10)`,
    stroke: isHighlighted
      ? "rgba(255,255,255,0.78)"
      : touchesSelected
        ? `rgba(${baseStroke},0.62)`
        : `rgba(${baseStroke},0.38)`,
    text: bridge ? "rgba(53,208,186,0.86)" : "rgba(242,193,78,0.82)",
    label: bridge ? "k-bridge" : "triangle"
  };
}

function drawTriangles(vTriangles, r) {
  if (!showTriangles) return;
  const sorted = vTriangles.slice().sort((a, b) => {
    const za = a.nodes.reduce((sum, id) => sum + project(dataPoint(nodeById.get(id), r)).z, 0) / a.nodes.length;
    const zb = b.nodes.reduce((sum, id) => sum + project(dataPoint(nodeById.get(id), r)).z, 0) / b.nodes.length;
    return za - zb;
  });
  sorted.forEach(t => {
    const pts = t.nodes.map(id => project(dataPoint(nodeById.get(id), r)));
    if (pts.length < 3) return;
    const isHighlighted = highlightedTriangle && highlightedTriangle.id === t.id;
    const touchesSelected = selectedId && t.nodes.includes(selectedId);
    const style = trianglePalette(t, isHighlighted, touchesSelected);
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.closePath();
    ctx.fillStyle = style.fill;
    ctx.strokeStyle = style.stroke;
    ctx.lineWidth = isHighlighted ? 2.4 : 1.3;
    ctx.fill();
    ctx.stroke();
    const cx = pts.reduce((sum, p) => sum + p.x, 0) / pts.length;
    const cy = pts.reduce((sum, p) => sum + p.y, 0) / pts.length;
    if (showLabels || isHighlighted || touchesSelected) {
      drawText(style.label, cx, cy, style.text, 10);
    }
    ctx.restore();
  });
}

function drawNodes(vNodes, r) {
  projectedNodes = [];
  const pts = vNodes.map(n => {
    const p = project(dataPoint(n, r));
    const isSelected = n.id === selectedId;
    const isHovered = n.id === hoveredId;
    const layerBoost = n.layer === "state_geometry" ? 1.2 : (n.layer === "measured_fit" ? 1.1 : 1.0);
    const radius = (isSelected ? 8.5 : isHovered ? 7.2 : 4.6) * layerBoost;
    return {n, p, radius};
  }).sort((a, b) => a.p.z - b.p.z);

  pts.forEach(({n, p, radius}) => {
    const color = nodeColor(n);
    const isTriangleDimmed = highlightedTriangle && !highlightedTriangle.nodes.includes(n.id);
    const isRelationDimmed = highlightedRelation && n.id !== highlightedRelation.from && n.id !== highlightedRelation.to;
    const isDimmed = isTriangleDimmed || isRelationDimmed;
    ctx.save();
    ctx.globalAlpha = isDimmed ? 0.22 : 1;
    ctx.beginPath();
    ctx.arc(p.x, p.y, radius + 5, 0, Math.PI * 2);
    ctx.fillStyle = color.replace(")", " / 0.10)").replace("hsl", "hsl");
    if (!color.startsWith("hsl")) ctx.fillStyle = hexToRgba(color, 0.12);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.lineWidth = n.id === selectedId ? 2.6 : 1;
    ctx.strokeStyle = n.id === selectedId ? "#ffffff" : "rgba(255,255,255,0.32)";
    ctx.stroke();
    ctx.restore();

    if (showLabels || n.id === selectedId || n.id === hoveredId) {
      drawText(n.name, p.x + radius + 8, p.y, "rgba(233,237,243,0.84)", 11, "left");
    }
    projectedNodes.push({id: n.id, x: p.x, y: p.y, radius});
  });
}

function hexToRgba(hex, alpha) {
  if (!hex || !hex.startsWith("#")) return `rgba(255,255,255,${alpha})`;
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return `rgba(${r},${g},${b},${alpha})`;
}

function render() {
  ctx.clearRect(0, 0, width, height);
  const vNodes = visibleNodes();
  const r = ranges(vNodes.length ? vNodes : nodes);
  const vRelations = visibleRelations(vNodes);
  const vTriangles = visibleTriangles(vNodes);
  drawGrid(r);
  drawTriangles(vTriangles, r);
  drawRelations(vRelations, r);
  drawNodes(vNodes, r);
  renderSummaryPills(vNodes, vRelations, vTriangles);
}

function renderSummaryPills(vNodes, vRelations, vTriangles) {
  const el = document.getElementById("summaryPills");
  el.innerHTML = `
    <span class="pill"><span class="dot" style="background:var(--teal)"></span>${vNodes.length} nodes</span>
    <span class="pill"><span class="dot" style="background:var(--gold)"></span>${vRelations.length} visible links</span>
    <span class="pill"><span class="dot" style="background:var(--violet)"></span>${vTriangles.length} triangles</span>
    <span class="pill">source atlas ${DATA.summary.node_count} nodes</span>
  `;
}

function renderSide() {
  const vNodes = visibleNodes();
  const vRelations = visibleRelations(vNodes);
  const vTriangles = visibleTriangles(vNodes);
  renderMetrics(vNodes, vRelations, vTriangles);
  renderDetails();
  renderRelations(vRelations, vTriangles);
  renderLegend(vNodes);
}

function renderMetrics(vNodes, vRelations, vTriangles) {
  const metric = document.getElementById("metricGrid");
  const classes = new Set(vNodes.map(n => n.ara_class)).size;
  const systems = new Set(vNodes.map(n => n.system)).size;
  const rungVals = vNodes.map(n => n.period_phi_rung);
  const rungSpan = rungVals.length ? Math.max(...rungVals) - Math.min(...rungVals) : 0;
  metric.innerHTML = `
    <div class="metric"><div class="k">Visible nodes</div><div class="v">${vNodes.length}</div></div>
    <div class="metric"><div class="k">Systems</div><div class="v">${systems}</div></div>
    <div class="metric"><div class="k">ARA classes</div><div class="v">${classes}</div></div>
    <div class="metric"><div class="k">Phi-rung span</div><div class="v">${fmt(rungSpan, 1)}</div></div>
    <div class="metric"><div class="k">Visible links</div><div class="v">${vRelations.length}</div></div>
    <div class="metric"><div class="k">Triangles</div><div class="v">${vTriangles.length}</div></div>
  `;
}

function selectedNode() {
  return selectedId ? nodeById.get(selectedId) : null;
}

function renderDetails() {
  const el = document.getElementById("details");
  const n = selectedNode() || nodeById.get(hoveredId);
  if (!n) {
    el.innerHTML = `<div class="empty">Select a node to read its period rung, ARA location, nearest boundary, and source layer.</div>`;
    return;
  }
  const boundary = n.nearest_boundary || {};
  const boundaryLabel = boundary.label || titleCase(boundary.name);
  const araCheck = n.ara_position_status && n.ara_position_status !== "bounded_position"
    ? kv("ARA check", n.ara_position_note || titleCase(n.ara_position_status))
    : "";
  const araDisplay = n.ara_position_status === "above_two_diagnostic"
    ? kv("Display Y", "Pinned to 2.0 diagnostic rail")
    : "";
  el.innerHTML = `
    <div class="detail-name" style="color:${nodeColor(n)}">${n.name}</div>
    <div class="detail-sub">${n.system_label} / ${titleCase(n.layer)}</div>
    ${kv("Period", fmtPeriod(n.period_seconds))}
    ${kv("Phi rung", fmt(n.period_phi_rung, 2))}
    ${kv("ARA", fmt(n.ara, 4))}
    ${araDisplay}
    ${araCheck}
    ${kv("Class", titleCase(n.ara_class))}
    ${kv("Boundary", `${boundaryLabel} (${fmt(boundary.distance, 4)})`)}
    ${kv("Distance to phi", fmt(n.distance_to_phi, 4))}
    ${kv("Theta", n.theta_deg == null ? "n/a" : `${fmt(n.theta_deg, 2)} deg`)}
    ${n.orientation ? kv("Orientation", n.orientation) : ""}
    ${n.relation_class ? kv("Relation class", titleCase(n.relation_class)) : ""}
    ${n.measurement_status ? kv("Measurement", titleCase(n.measurement_status)) : ""}
    ${n.source_metric ? kv("Source metric", n.source_metric) : ""}
    ${kv(n.weight_label || "Weight", fmt(n.weight_value, 4))}
    ${kv("Scale", titleCase(n.scale_domain))}
    ${kv("Source", n.source)}
    ${n.notes ? kv("Note", n.notes) : ""}
  `;
}

function kv(key, val) {
  return `<div class="kv"><div class="key">${key}</div><div class="val">${val}</div></div>`;
}

function renderRelations(vRelations, vTriangles) {
  const el = document.getElementById("relationList");
  const n = selectedNode();
  let list = vRelations;
  if (n) list = list.filter(r => r.from === n.id || r.to === n.id);
  list = list.slice().sort((a, b) => (b.score || 0) - (a.score || 0)).slice(0, 12);
  let triList = vTriangles;
  if (n) triList = triList.filter(t => t.nodes.includes(n.id));
  triList = triList.slice().sort((a, b) => (b.score || 0) - (a.score || 0)).slice(0, 8);
  if (!list.length && !triList.length) {
    el.innerHTML = `<div class="empty">No visible relation candidates for the current filters.</div>`;
    return;
  }
  el.innerHTML = "";
  triList.forEach(t => {
    const row = document.createElement("div");
    row.className = "relation";
    const kind = t.type === "state_bridge_face" ? "K-Bridge Triangle" : "Triangle Face";
    row.innerHTML = `
      <div class="kind">${kind}</div>
      <div class="ends">${t.nodes.map(id => nodeById.get(id)?.name || id).join("<br>")}</div>
      <div class="score">score ${fmt(t.score || 0, 3)} / ${t.detail?.interpretation || t.source}</div>
    `;
    row.onclick = () => {
      highlightedTriangle = t;
      highlightedRelation = null;
      selectedId = t.nodes[0];
      render();
      renderSide();
    };
    el.appendChild(row);
  });
  list.forEach(rel => {
    const a = nodeById.get(rel.from), b = nodeById.get(rel.to);
    const row = document.createElement("div");
    row.className = "relation";
    row.innerHTML = `
      <div class="kind">${titleCase(rel.type)}</div>
      <div class="ends">${a ? a.name : rel.from}<br>${b ? b.name : rel.to}</div>
      <div class="score">score ${fmt(rel.score || 0, 3)} / ${rel.source}</div>
    `;
    row.onclick = () => {
      highlightedRelation = rel;
      highlightedTriangle = null;
      selectedId = rel.from;
      render();
      renderSide();
    };
    el.appendChild(row);
  });
}

function renderLegend(vNodes) {
  const mode = document.getElementById("colorMode").value;
  const el = document.getElementById("legendList");
  const counts = {};
  vNodes.forEach(n => {
    const key = mode === "layer" ? n.layer : mode === "domain" ? n.scale_domain : mode === "system" ? n.system : n.ara_class;
    counts[key] = (counts[key] || 0) + 1;
  });
  const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 18);
  el.innerHTML = entries.map(([key, count]) => {
    const sample = vNodes.find(n => {
      if (mode === "layer") return n.layer === key;
      if (mode === "domain") return n.scale_domain === key;
      if (mode === "system") return n.system === key;
      return n.ara_class === key;
    });
    const color = sample ? nodeColor(sample) : "#9aa7b7";
    return `<div class="legend-row"><span class="swatch" style="background:${color}"></span><span>${titleCase(key)}</span><span class="count">${count}</span></div>`;
  }).join("");
}

function resize() {
  const rect = stage.getBoundingClientRect();
  dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  width = Math.floor(rect.width);
  height = Math.floor(rect.height);
  canvas.width = Math.floor(width * dpr);
  canvas.height = Math.floor(height * dpr);
  canvas.style.width = width + "px";
  canvas.style.height = height + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  render();
}

function updateHover(e) {
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  let best = null;
  let bestD = Infinity;
  projectedNodes.forEach(p => {
    const d = Math.hypot(p.x - x, p.y - y) - p.radius;
    if (d < bestD) { bestD = d; best = p; }
  });
  hoveredId = best && bestD < 9 ? best.id : null;
  if (hoveredId) {
    const n = nodeById.get(hoveredId);
    tooltip.innerHTML = `
      <div class="t-name" style="color:${nodeColor(n)}">${n.name}</div>
      <div class="t-line">${n.system_label}</div>
      <div class="t-line">ARA ${fmt(n.ara, 4)} / ${titleCase(n.ara_class)}</div>
      <div class="t-line">${fmtPeriod(n.period_seconds)} / phi rung ${fmt(n.period_phi_rung, 2)}</div>
    `;
    tooltip.style.display = "block";
    tooltip.style.left = Math.min(e.clientX + 14, window.innerWidth - 340) + "px";
    tooltip.style.top = Math.max(12, e.clientY - 18) + "px";
  } else {
    tooltip.style.display = "none";
  }
  render();
  renderDetails();
}

canvas.addEventListener("mousedown", e => {
  isDragging = true;
  lastMouse = {x: e.clientX, y: e.clientY};
});
window.addEventListener("mousemove", e => {
  if (isDragging && lastMouse) {
    yaw += (e.clientX - lastMouse.x) * 0.006;
    pitch += (e.clientY - lastMouse.y) * 0.006;
    pitch = Math.max(-1.25, Math.min(1.25, pitch));
    lastMouse = {x: e.clientX, y: e.clientY};
    render();
  } else if (e.target === canvas) {
    updateHover(e);
  }
});
window.addEventListener("mouseup", () => {
  isDragging = false;
  lastMouse = null;
});
canvas.addEventListener("mouseleave", () => {
  hoveredId = null;
  tooltip.style.display = "none";
  render();
  renderDetails();
});
canvas.addEventListener("click", () => {
  if (hoveredId) {
    selectedId = hoveredId;
    highlightedRelation = null;
    render();
    renderSide();
  }
});
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  zoom *= Math.exp(-e.deltaY * 0.001);
  zoom = Math.max(0.42, Math.min(3.2, zoom));
  render();
}, {passive:false});

function animate() {
  if (autoOrbit) {
    yaw += 0.003;
    render();
  }
  requestAnimationFrame(animate);
}

initControls();
resize();
renderSide();
window.addEventListener("resize", resize);
requestAnimationFrame(animate);
</script>
</body>
</html>
