.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

    }

    function addLine(a, b, attrs = {}) {
      const pa = project(a);
      const pb = project(b);
      svg.appendChild(node(&quot;line&quot;, {
        x1: pa[0], y1: pa[1], x2: pb[0], y2: pb[1], ...attrs
      }));
    }

    function addPoint(v, attrs = {}) {
      const p = project(v);
      svg.appendChild(node(&quot;circle&quot;, { cx: p[0], cy: p[1], r: 4, ...attrs }));
      return p;
    }

    function addText(v, text, attrs = {}) {
      const p = project(v);
      svg.appendChild(node(&quot;text&quot;, {
        x: p[0], y: p[1], fill: &quot;var(--muted-foreground)&quot;,
        &quot;font-size&quot;: 12, &quot;text-anchor&quot;: &quot;middle&quot;, ...attrs
      }, text));
    }

    function ring(z, samples = 100) {
      const points = [];
      for (let i = 0; i &lt;= samples; i++) {
        const a = TAU * i / samples;
        points.push([Math.cos(a), z, Math.sin(a)]);
      }
      return points;
    }

    function guide(heading, samples = 48) {
      const a = TAU * heading;
      const points = [];
      for (let i = 0; i &lt;= samples; i++) {
        const y = -1.18 + 2.36 * i / samples;
        points.push([Math.cos(a), y, Math.sin(a)]);
      }
      return points;
    }

    function pointFor(record, index, records) {
      const a = TAU * record.h;
      const first = records[0].t;
      const last = records[records.length - 1].t;
      const y = last === first ? 0 : -1.08 + 2.16 * (record.t - first) / (last - first);
      return [Math.cos(a), y, Math.sin(a)];
    }

    function arrowHead(from, to) {
      const a = project(from);
      const b = project(to);
      const dx = b[0] - a[0];
      const dy = b[1] - a[1];
      const len = Math.hypot(dx, dy) || 1;
      const ux = dx / len;
      const uy = dy / len;
      const px = -uy;
      const py = ux;
      const tip = [b[0], b[1]];
      const left = [b[0] - ux * 13 + px * 5, b[1] - uy * 13 + py * 5];
      const right = [b[0] - ux * 13 - px * 5, b[1] - uy * 13 - py * 5];
      svg.appendChild(node(&quot;polygon&quot;, {
        points: `${tip[0]},${tip[1]} ${left[0]},${left[1]} ${right[0]},${right[1]}`,
        fill: &quot;var(--viz-series-1)&quot;
      }));
    }

    function drawCylinder(records, data) {
      for (const y of [-1.08, -0.54, 0, 0.54, 1.08]) {
        addPath(ring(y), {
          stroke: &quot;var(--border)&quot;, &quot;stroke-width&quot;: y === 0 ? 1.2 : 0.8,
          opacity: y === 0 ? 0.56 : 0.34
        });
      }
      for (let i = 0; i &lt; 12; i++) {
        addPath(guide(i / 12), {
          stroke: &quot;var(--border)&quot;, &quot;stroke-width&quot;: 0.8, opacity: 0.27
        });
      }

      const h0 = DATA.referenceHeading;
      const h2 = (h0 + 0.5) % 1;
      const hr1 = (h0 + 0.25) % 1;
      const hr2 = (h0 + 0.75) % 1;
      addPath(guide(h0), { stroke: &quot;var(--viz-series-2)&quot;, &quot;stroke-width&quot;: 3, opacity: 0.9 });
      addPath(guide(h2), { stroke: &quot;var(--viz-series-2)&quot;, &quot;stroke-width&quot;: 3, opacity: 0.9 });
      addPath(guide(hr1), {
        stroke: &quot;var(--muted-foreground)&quot;, &quot;stroke-width&quot;: 1.6,
        &quot;stroke-dasharray&quot;: &quot;6 5&quot;, opacity: 0.7
      });
      addPath(guide(hr2), {
        stroke: &quot;var(--muted-foreground)&quot;, &quot;stroke-width&quot;: 1.6,
        &quot;stroke-dasharray&quot;: &quot;6 5&quot;, opacity: 0.7
      });
      addText([Math.cos(TAU * h0), 1.28, Math.sin(TAU * h0)], &quot;ARA 0&quot;);
      addText([Math.cos(TAU * h2), 1.28, Math.sin(TAU * h2)], &quot;ARA 2&quot;);
      addText([Math.cos(TAU * hr1), 1.22, Math.sin(TAU * hr1)], &quot;ridge&quot;);
      addText([Math.cos(TAU * hr2), 1.22, Math.sin(TAU * hr2)], &quot;ridge&quot;);
      addLine([0, -1.2, 0], [0, 1.2, 0], {
        stroke: &quot;var(--muted-foreground)&quot;, &quot;stroke-width&quot;: 1.2, opacity: 0.8
      });
      addText([0, 1.32, 0], &quot;later&quot;);
      addText([0, -1.29, 0], &quot;earlier&quot;);

      if (Number.isFinite(data.boundary)) {
        const first = records[0].t;
        const last = records[records.length - 1].t;
        const y = -1.08 + 2.16 * (data.boundary - first) / (last - first);
        addPath(ring(y), {
          stroke: &quot;var(--viz-series-4)&quot;, &quot;stroke-width&quot;: 2,
          &quot;stroke-dasharray&quot;: &quot;2 5&quot;, opacity: 0.85
        });
        addText([0, y, 1.17], &quot;continuation begins&quot;, { &quot;text-anchor&quot;: &quot;start&quot; });
      }
    }

    function drawTrajectory(records) {
      const points = records.map((r, i) =&gt; pointFor(r, i, records));
      const maxMove = Math.max(...records.map(r =&gt; r.m), Number.EPSILON);

      for (let i = 1; i &lt; points.length; i++) {
        const meanMove = (records[i - 1].m + records[i].m) / 2;
        addPath([points[i - 1], points[i]], {
          stroke: &quot;var(--viz-series-1)&quot;,
          &quot;stroke-width&quot;: 1.2 + 4.2 * Math.sqrt(meanMove / maxMove),
          opacity: i &lt;= state.step ? 0.88 : 0.18
        });
      }

      const p = points[state.step];
      const axis = [0, p[1], 0];
      addLine(axis, p, { stroke: &quot;var(--viz-series-1)&quot;, &quot;stroke-width&quot;: 3.2 });
      arrowHead(axis, p);
      addPoint(p, {
        fill: &quot;var(--viz-series-1)&quot;, stroke: &quot;var(--background)&quot;,
        &quot;stroke-width&quot;: 1.5, r: 5.5
      });
    }

    function draw() {
      const data = DATA.datasets[state.dataset];
      const records = data.points;
      state.step = Math.min(state.step, records.length - 1);
      stepInput.max = String(records.length - 1);
      stepInput.value = String(state.step);
      stepValue.textContent = `${state.step + 1} of ${records.length}`;

      svg.replaceChildren();
      svg.appendChild(node(&quot;title&quot;, {}, `${data.label} partial external direction`));
      svg.appendChild(node(&quot;desc&quot;, {}, &quot;The external heading is wrapped around a cylinder while source time runs vertically. Line thickness represents movement magnitude.&quot;));
      drawCylinder(records, data);
      drawTrajectory(records);

      const r = records[state.step];
      const maxMove = Math.max(...records.map(v =&gt; v.m), Number.EPSILON);
      const xmin = Math.min(...records.map(v =&gt; v.x));
      const xmax = Math.max(...records.map(v =&gt; v.x));
      label.textContent = data.label;
      status.textContent = data.status;
      current.textContent = `Current: ARA x ${r.x.toFixed(3)} · heading ${r.h.toFixed(3)} turn`;
      range.textContent = `Observed x range ${xmin.toFixed(3)}–${xmax.toFixed(3)}`;
      movement.textContent = `Movement ${(100 * r.m / maxMove).toFixed(1)}% of this path’s peak`;
      caption.textContent = data.caption;
    }

    function setPlaying(on) {
      state.playing = on;
      playButton.textContent = on ? &quot;Pause movement&quot; : &quot;Play movement&quot;;
      playButton.setAttribute(&quot;aria-pressed&quot;, on ? &quot;true&quot; : &quot;false&quot;);
      if (state.timer) {
        clearInterval(state.timer);
        state.timer = null;
      }
      if (on) {
        state.timer = setInterval(() =&gt; {
          const count = DATA.datasets[state.dataset].points.length;
          state.step = (state.step + 1) % count;
          draw();
        }, 220);
      }
    }

    for (const id of DATA.order) {
      const data = DATA.datasets[id];
      const option = document.createElement(&quot;option&quot;);
      option.value = id;
      option.textContent = data.label;
      select.appendChild(option);
    }

    select.addEventListener(&quot;change&quot;, () =&gt; {
      state.dataset = select.value;
      state.step = 0;
      draw();
    });
    stepInput.addEventListener(&quot;input&quot;, () =&gt; {
      state.step = Number(stepInput.value);
      draw();
    });
    playButton.addEventListener(&quot;click&quot;, () =&gt; setPlaying(!state.playing));

    function beginDrag(event) {
      state.drag = { id: event.pointerId, x: event.clientX, y: event.clientY };
      svg.setPointerCapture(event.pointerId);
    }
    function moveDrag(event) {
      if (!state.drag || state.drag.id !== event.pointerId) return;
      const dx = event.clientX - state.drag.x;
      const dy = event.clientY - state.drag.y;
      state.drag.x = event.clientX;
      state.drag.y = event.clientY;
      state.yaw += dx * 0.009;
      state.pitch = Math.max(-1.25, Math.min(1.25, state.pitch + dy * 0.009));
      draw();
    }
    function endDrag(event) {
      if (state.drag &amp;&amp; state.drag.id === event.pointerId) state.drag = null;
    }
    svg.addEventListener(&quot;pointerdown&quot;, beginDrag);
    svg.addEventListener(&quot;pointermove&quot;, moveDrag);
    svg.addEventListener(&quot;pointerup&quot;, endDrag);
    svg.addEventListener(&quot;pointercancel&quot;, endDrag);

    select.value = state.dataset;
    draw();
  })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;

(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });

    initialize();

    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
