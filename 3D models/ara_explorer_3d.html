<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARA Explorer — systems on the octave/scale rungs</title>
<style>
  html,body{margin:0;height:100%;background:#070b12;color:#cdd6e0;font-family:system-ui,Segoe UI,Arial,sans-serif;overflow:hidden}
  #c{position:fixed;inset:0}
  #panel{position:fixed;top:0;right:0;height:100%;width:300px;background:rgba(10,16,26,.86);border-left:1px solid #2a3a52;
         padding:12px 14px;box-sizing:border-box;overflow:auto;transition:transform .25s;font-size:12.5px}
  #panel.hidden{transform:translateX(300px)}
  #panel h1{font-size:14px;margin:0 0 4px;color:#f0c878}
  .grp{margin-top:10px;font-size:11px;letter-spacing:.5px;text-transform:uppercase;opacity:.6}
  .item{padding:6px 8px;border-radius:7px;cursor:pointer;margin:3px 0;border:1px solid transparent}
  .item:hover,.item.active{background:rgba(90,160,255,.14);border-color:#3a557e}
  .item .n{font-weight:600}
  .item .meta{opacity:.65;font-size:11px}
  #toggle{position:fixed;top:14px;right:14px;z-index:5;background:#16263c;color:#cdd6e0;border:1px solid #2a3a52;border-radius:8px;padding:7px 11px;cursor:pointer;font-size:12px}
  #info{position:fixed;bottom:14px;left:14px;background:rgba(10,16,26,.8);border:1px solid #2a3a52;border-radius:9px;padding:10px 13px;font-size:12.5px;max-width:330px;min-height:18px}
  #info .t{color:#f0c878;font-weight:600}
  .muted{opacity:.65;font-size:11px}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
</style></head>
<body>
<canvas id="c"></canvas>
<button id="toggle">☰ systems</button>
<div id="panel">
  <h1>ARA Explorer</h1>
  <div class="muted">Rings = scale rungs (period). Height = ARA (0 bottom → 2 top; white=1.0, gold=φ). Bigger node = larger/slower system. Hover a system to light it up; click to pin its details.</div>
  <div id="list"></div>
</div>
<div id="info"><span class="muted">Hover or tap a system in the panel →</span></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const PHI=(1+Math.sqrt(5))/2;
const DOM={heart:0xff6b8a,climate:0x5aa0ff,solar:0xf0c878,stellar:0xc9b3ff};
const systems=[
 {name:"Myocyte action potential",xyz:[1.359,0.240,-0.965],size:0.070,ara:0.27,domain:"heart",source:"measured (HOW_TO)",note:"snap / consumer"},
 {name:"Heartbeat (ventricular pump)",xyz:[1.079,0.905,0.564],size:0.072,ara:1.60,domain:"heart",source:"measured (HOW_TO)",note:"engine, near φ"},
 {name:"Respiratory sinus arrhythmia",xyz:[0.499,1.372,0.735],size:0.074,ara:1.50,domain:"heart",source:"measured",note:"breath modulation"},
 {name:"Circadian HRV",xyz:[-0.271,1.539,-0.900],size:0.085,ara:0.50,domain:"heart",source:"measured",note:"day/night consumer"},
 {name:"ENSO NINO 3.4",xyz:[-1.876,-0.683,-0.367],size:0.093,ara:0.82,domain:"climate",source:"measured (mean)",note:"surface; matched pair w/ SOI"},
 {name:"ENSO SOI (Walker)",xyz:[-1.730,-1.054,-0.367],size:0.093,ara:0.82,domain:"climate",source:"measured",note:"anti-phase partner of NINO"},
 {name:"WWV warm-water volume",xyz:[-1.766,-1.020,0.0],size:0.093,ara:1.00,domain:"climate",source:"measured",note:"subsurface recharge feeder"},
 {name:"PDO decadal",xyz:[-0.711,-1.953,-0.209],size:0.095,ara:0.90,domain:"climate",source:"measured-ish",note:"slow modulation"},
 {name:"Solar Schwabe cycle",xyz:[1.022,-1.770,1.512],size:0.095,ara:1.73,domain:"solar",source:"measured (flywheel)",note:"exothermic donor"},
 {name:"Golden star pulsation (RRc)",xyz:[1.515,-0.875,0.0],size:0.083,ara:2.00,domain:"stellar",source:"ARA illustrative",note:"leanest recyclers; ARA approx"},
 {name:"Classical Cepheid pulsation",xyz:[1.305,-0.730,1.110],size:0.087,ara:2.40,domain:"stellar",source:"ARA from Script 98",note:"relaxation snap >2"},
];
const shells=[{r:0.92,l:"µs"},{r:1.11,l:"ms"},{r:1.30,l:"s"},{r:1.49,l:"ks ~17min"},{r:1.68,l:"Ms ~12d"},{r:1.87,l:"Gs ~32yr"},{r:2.06,l:"Ts ~32kyr"},{r:2.25,l:"Ps"}];

const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,100); cam.position.set(0,1.4,6);
const rnd=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
rnd.setSize(innerWidth,innerHeight); rnd.setPixelRatio(Math.min(devicePixelRatio,2));
scene.add(new THREE.AmbientLight(0xffffff,.6));
const dl=new THREE.DirectionalLight(0xffffff,.7); dl.position.set(3,4,5); scene.add(dl);
const pivot=new THREE.Group(); scene.add(pivot);

// scale-rung reference shells
shells.forEach(s=>{const g=new THREE.SphereGeometry(s.r,40,26);
  pivot.add(new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:0x35506e,wireframe:true,transparent:true,opacity:.10})));});
// ARA axis
pivot.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,-2.5),new THREE.Vector3(0,0,2.5)]),new THREE.LineBasicMaterial({color:0x8fa6c0})));
function mk(z,c,s){const m=new THREE.Mesh(new THREE.SphereGeometry(s,14,14),new THREE.MeshBasicMaterial({color:c}));m.position.set(0,0,z);pivot.add(m);}
mk(0,0xffffff,.05); mk(PHI-1,0xf0c878,.06); mk(1,0x8fa6c0,.04); mk(-1,0x8fa6c0,.04);

// nodes
const meshes=[];
systems.forEach((s,i)=>{
  const m=new THREE.Mesh(new THREE.SphereGeometry(s.size,20,20),
    new THREE.MeshPhongMaterial({color:DOM[s.domain],emissive:DOM[s.domain],emissiveIntensity:.25}));
  m.position.set(...s.xyz); m.userData={i,base:s.size}; pivot.add(m); meshes.push(m);
});

// panel
const list=document.getElementById('list');
const groups={};systems.forEach((s,i)=>{(groups[s.domain]=groups[s.domain]||[]).push(i)});
for(const d in groups){
  const h=document.createElement('div');h.className='grp';h.innerHTML=`<span class="dot" style="background:#${DOM[d].toString(16).padStart(6,'0')}"></span>${d}`;list.appendChild(h);
  groups[d].forEach(i=>{const s=systems[i];const el=document.createElement('div');el.className='item';el.dataset.i=i;
    el.innerHTML=`<div class="n">${s.name}</div><div class="meta">ARA ${s.ara} · ${s.source}</div>`;
    el.onmouseenter=()=>highlight(i); el.onclick=()=>{pin=i;highlight(i)}; list.appendChild(el);});
}
let hi=-1,pin=-1;
function highlight(i){hi=i;
  document.querySelectorAll('.item').forEach(e=>e.classList.toggle('active',+e.dataset.i===i));
  const s=systems[i];
  document.getElementById('info').innerHTML=`<span class="t">${s.name}</span> <span class="muted">(${s.domain})</span><br>ARA = <b>${s.ara}</b> &nbsp;·&nbsp; ${s.note}<br><span class="muted">source: ${s.source}</span>`;
}
document.getElementById('toggle').onclick=()=>document.getElementById('panel').classList.toggle('hidden');

// interaction
let rx=0.35,ry=0.6,down=false,px=0,py=0;
addEventListener('mousedown',e=>{down=true;px=e.clientX;py=e.clientY});
addEventListener('mouseup',()=>down=false);
addEventListener('mousemove',e=>{if(!down)return;ry+=(e.clientX-px)*.008;rx+=(e.clientY-py)*.008;px=e.clientX;py=e.clientY});
addEventListener('wheel',e=>{cam.position.z=Math.max(3,Math.min(12,cam.position.z+e.deltaY*.002))});
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();rnd.setSize(innerWidth,innerHeight)});
let t=0;
function loop(){requestAnimationFrame(loop);t+=0.03;
  meshes.forEach(m=>{const on=(m.userData.i===hi||m.userData.i===pin);
    const sc=on?1.6+0.25*Math.sin(t*3):1; m.scale.setScalar(sc);
    m.material.emissiveIntensity=on?0.9:0.25;});
  pivot.rotation.x=rx; pivot.rotation.y=ry+t*0.02; rnd.render(scene,cam);}
loop();
</script>
</body></html>
