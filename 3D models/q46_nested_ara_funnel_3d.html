  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {

}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {

.btn:focus-visible {

svg {

  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;div id=&quot;q46-nested-ara-funnel&quot;&gt;
  &lt;style&gt;

    &lt;canvas id=&quot;q46-canvas&quot; role=&quot;img&quot; aria-label=&quot;Interactive three-dimensional nested ARA model. The complete double-parent sphere contains a local strand and connected child. The local strand contains Parent 1, Parent 2 and a small handover Other. Expand the model to separate these levels into a funnel.&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;q46-label-layer&quot; aria-hidden=&quot;true&quot;&gt;

      &lt;div class=&quot;q46-label&quot; data-q46-label=&quot;P2&quot;&gt;P2&lt;small&gt;45.76% inside L&lt;/small&gt;&lt;/div&gt;

      &lt;span class=&quot;q46-key&quot;&gt;&lt;i class=&quot;q46-swatch&quot; style=&quot;background:var(--viz-series-2)&quot;&gt;&lt;/i&gt;C 41.08%&lt;/span&gt;
      &lt;span class=&quot;q46-key&quot;&gt;&lt;i class=&quot;q46-swatch&quot; style=&quot;background:var(--viz-series-3)&quot;&gt;&lt;/i&gt;P1 53.68% of L&lt;/span&gt;
      &lt;span class=&quot;q46-key&quot;&gt;&lt;i class=&quot;q46-swatch&quot; style=&quot;background:var(--viz-series-4)&quot;&gt;&lt;/i&gt;P2 45.76% of L&lt;/span&gt;
      &lt;span class=&quot;q46-key&quot;&gt;&lt;i class=&quot;q46-swatch&quot; style=&quot;background:var(--viz-series-5)&quot;&gt;&lt;/i&gt;Other 0.46% of L&lt;/span&gt;

  &lt;p class=&quot;q46-foot text-small&quot;&gt;Sphere size marks a complete identity at its own tier. Thread thickness carries Q46 participation; animated direction is the ARA counterflow reading, not a measured velocity.&lt;/p&gt;

  &lt;script type=&quot;module&quot;&gt;
    import * as THREE from &quot;https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js&quot;;

    const root = document.getElementById(&quot;q46-nested-ara-funnel&quot;);
    const stage = root.querySelector(&quot;.q46-stage&quot;);
    const canvas = document.getElementById(&quot;q46-canvas&quot;);
    const expansion = document.getElementById(&quot;q46-expansion&quot;);
    const expansionValue = document.getElementById(&quot;q46-expansion-value&quot;);
    const thicknessBasis = document.getElementById(&quot;q46-thickness-basis&quot;);
    const focusSelect = document.getElementById(&quot;q46-focus&quot;);
    const flowToggle = document.getElementById(&quot;q46-flow&quot;);
    const resetView = document.getElementById(&quot;q46-reset-view&quot;);
    const loading = document.getElementById(&quot;q46-loading&quot;);
    const detailName = document.getElementById(&quot;q46-detail-name&quot;);
    const detailCopy = document.getElementById(&quot;q46-detail-copy&quot;);
    const labelElements = Object.fromEntries(
      [...root.querySelectorAll(&quot;[data-q46-label]&quot;)].map((el) =&gt; [el.dataset.q46Label, el])
    );

    const data = {
      L: 0.5891667921412194,
      C: 0.4108332078587805,
      P1: 0.5367913677962025,
      P2: 0.45755769128690293,
      O: 0.004593886222489706
    };

    const descriptions = {
      root: [
        &quot;Double-parent identity&quot;,
        &quot;L and C close to one parent TE-ARA of 2; their unequal thread widths retain the measured local asymmetry.&quot;
      ],
      L: [
        &quot;Local parent strand L&quot;,
        &quot;Outer share 58.92%, giving ARA coordinate 1.1783. Expand it to expose P1, P2 and the small handover Other.&quot;
      ],
      C: [
        &quot;Connected child C&quot;,
        &quot;Outer share 41.08%, giving ARA coordinate 0.8217. Together, L + C closes the parent at 2.&quot;
      ],
      P1: [
        &quot;Parent P1 inside L&quot;,
        &quot;53.68% of the lifted local-parent strand. P1 remains a complete TE-ARA identity at its own tier.&quot;
      ],
      P2: [
        &quot;Parent P2 inside L&quot;,
        &quot;45.76% of the lifted local-parent strand. Its smaller contribution is visible without shrinking its own sphere.&quot;
      ],
      O: [
        &quot;Handover Other inside L&quot;,
        &quot;0.46% of the lifted local-parent strand. Its tube is visible because radius encodes the square root of share, so cross-sectional area stays proportional.&quot;
      ]
    };

    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: true,
      powerPreference: &quot;high-performance&quot;
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
    const world = new THREE.Group();
    scene.add(world);

    const sampleCanvas = document.createElement(&quot;canvas&quot;);
    sampleCanvas.width = 1;
    sampleCanvas.height = 1;
    const sampleContext = sampleCanvas.getContext(&quot;2d&quot;, { willReadFrequently: true });
    const colorProbe = document.createElement(&quot;span&quot;);
    colorProbe.setAttribute(&quot;aria-hidden&quot;, &quot;true&quot;);
    colorProbe.style.position = &quot;absolute&quot;;
    colorProbe.style.visibility = &quot;hidden&quot;;
    root.appendChild(colorProbe);

    function cssThreeColor(variable) {
      colorProbe.style.color = `var(${variable})`;
      const value = getComputedStyle(colorProbe).color;
      sampleContext.clearRect(0, 0, 1, 1);
      sampleContext.fillStyle = value;
      sampleContext.fillRect(0, 0, 1, 1);
      const pixel = sampleContext.getImageData(0, 0, 1, 1).data;
      return new THREE.Color(pixel[0] / 255, pixel[1] / 255, pixel[2] / 255);
    }

    const colors = {};
    const tubeMeshes = {};
    const tubeParticles = {};
    const nodeMeshes = {};
    const nodeRings = {};
    const selectableMeshes = [];
    const labelAnchors = {};
    const structureMaterials = [];
    let ambientLight;
    let keyLight;
    let shellFill;
    let shellWire;
    let ridgeMaterial;
    let funnelMaterial;
    let axisMaterial;
    let selectedKey = &quot;root&quot;;
    let currentExpansion = 0;
    let orbitTheta = 0.68;
    let orbitPhi = 1.12;
    let orbitDistance = 15.8;
    let dragging = false;
    let pointerX = 0;
    let pointerY = 0;
    let movedDuringDrag = false;
    let flowClock = 0;
    const reducedMotion = window.matchMedia(&quot;(prefers-reduced-motion: reduce)&quot;).matches;

    function applyTheme() {
      colors.background = cssThreeColor(&quot;--background&quot;);
      colors.foreground = cssThreeColor(&quot;--foreground&quot;);
      colors.border = cssThreeColor(&quot;--border&quot;);
      colors.muted = cssThreeColor(&quot;--muted-foreground&quot;);
      colors.primary = cssThreeColor(&quot;--primary&quot;);
      colors.L = cssThreeColor(&quot;--viz-series-1&quot;);
      colors.C = cssThreeColor(&quot;--viz-series-2&quot;);
      colors.P1 = cssThreeColor(&quot;--viz-series-3&quot;);
      colors.P2 = cssThreeColor(&quot;--viz-series-4&quot;);
      colors.O = cssThreeColor(&quot;--viz-series-5&quot;);

      renderer.setClearColor(colors.background, 0);
      if (ambientLight) ambientLight.color.copy(colors.foreground);
      if (keyLight) keyLight.color.copy(colors.foreground);
      if (shellFill) shellFill.color.copy(colors.primary);
      if (shellWire) shellWire.color.copy(colors.border);
      if (ridgeMaterial) ridgeMaterial.color.copy(colors.foreground);
      if (funnelMaterial) funnelMaterial.color.copy(colors.border);
      if (axisMaterial) axisMaterial.color.copy(colors.muted);

      Object.entries(tubeMeshes).forEach(([key, mesh]) =&gt; {
        mesh.material.color.copy(colors[key]);
        mesh.material.emissive.copy(colors[key]);
      });
      Object.entries(tubeParticles).forEach(([key, particles]) =&gt; {
        particles.forEach((particle) =&gt; particle.material.color.copy(colors[key]));
      });
      Object.entries(nodeMeshes).forEach(([key, mesh]) =&gt; {
        const colorKey = key === &quot;root&quot; ? &quot;primary&quot; : key;
        mesh.material.color.copy(colors[colorKey]);
        mesh.material.emissive.copy(colors[colorKey]);
      });
      Object.entries(nodeRings).forEach(([key, ring]) =&gt; {
        const colorKey = key === &quot;root&quot; ? &quot;primary&quot; : key;
        ring.material.color.copy(colors[colorKey]);
      });
    }

    ambientLight = new THREE.AmbientLight(0xffffff, 1.35);
    scene.add(ambientLight);
    keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
    keyLight.position.set(6, 8, 10);
    scene.add(keyLight);

    shellFill = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.075,
      roughness: 0.55,
      metalness: 0,
      side: THREE.DoubleSide,
      depthWrite: false
    });
    shellWire = new THREE.MeshBasicMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.24,
      wireframe: true,
      depthWrite: false
    });
    const shellGeometry = new THREE.SphereGeometry(4.65, 24, 14);
    const shell = new THREE.Mesh(shellGeometry, shellFill);
    const shellGrid = new THREE.Mesh(shellGeometry, shellWire);
    world.add(shell, shellGrid);
    structureMaterials.push(shellFill, shellWire);

    ridgeMaterial = new THREE.MeshBasicMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.055,
      side: THREE.DoubleSide,
      depthWrite: false
    });
    const ridgeDisk = new THREE.Mesh(new THREE.CircleGeometry(4.62, 72), ridgeMaterial);
    ridgeDisk.rotation.x = -Math.PI / 2;
    world.add(ridgeDisk);
    structureMaterials.push(ridgeMaterial);

    axisMaterial = new THREE.LineBasicMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.42
    });
    const axisGeometry = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(0, -4.65, 0),
      new THREE.Vector3(0, 4.65, 0)
    ]);
    const axisLine = new THREE.Line(axisGeometry, axisMaterial);
    world.add(axisLine);
    structureMaterials.push(axisMaterial);

    funnelMaterial = new THREE.LineBasicMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0
    });
    structureMaterials.push(funnelMaterial);
    const funnelFrame = new THREE.Group();
    world.add(funnelFrame);

    function ringPoints(y, radius, segments = 64) {
      const points = [];
      for (let i = 0; i &lt;= segments; i += 1) {
        const angle = (i / segments) * Math.PI * 2;
        points.push(new THREE.Vector3(Math.cos(angle) * radius, y, Math.sin(angle) * radius));
      }
      return points;
    }

    [
      [3.9, 0.72],
      [0.4, 2.2],
      [-3.5, 4.6]
    ].forEach(([y, radius]) =&gt; {
      const loop = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(ringPoints(y, radius)),
        funnelMaterial
      );
      funnelFrame.add(loop);
    });
    for (let i = 0; i &lt; 10; i += 1) {
      const angle = (i / 10) * Math.PI * 2;
      const points = [
        new THREE.Vector3(Math.cos(angle) * 0.72, 3.9, Math.sin(angle) * 0.72),
        new THREE.Vector3(Math.cos(angle) * 2.2, 0.4, Math.sin(angle) * 2.2),
        new THREE.Vector3(Math.cos(angle) * 4.6, -3.5, Math.sin(angle) * 4.6)
      ];
      funnelFrame.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), funnelMaterial));

    const N = 84;

    function nestedOuter(phase) {
      const points = [];
      for (let i = 0; i &lt; N; i += 1) {
        const t = i / (N - 1);
        const angle = phase + t * Math.PI * 4;
        const radius = 1.22 + 0.11 * Math.sin(t * Math.PI * 2);
        points.push(
          new THREE.Vector3(
            Math.cos(angle) * radius,
            -3.72 + t * 7.44,
            Math.sin(angle) * radius

    const nestedL = nestedOuter(0);
    const nestedC = nestedOuter(Math.PI);

    function nestedChild(phase, lift) {
      return nestedL.map((base, i) =&gt; {
        const t = i / (N - 1);
        const angle = phase + t * Math.PI * 7;
        return new THREE.Vector3(
          base.x + Math.cos(angle) * lift,
          base.y + Math.sin(angle * 0.5) * lift * 0.34,
          base.z + Math.sin(angle) * lift
        );
      });
    }

    function quadratic(a, b, c) {
      const points = [];
      for (let i = 0; i &lt; N; i += 1) {
        const t = i / (N - 1);
        const u = 1 - t;
        points.push(
          new THREE.Vector3(
            u * u * a.x + 2 * u * t * b.x + t * t * c.x,
            u * u * a.y + 2 * u * t * b.y + t * t * c.y,
            u * u * a.z + 2 * u * t * b.z + t * t * c.z
          )
        );
      }
      return points;

    const funnelPositions = {
      root: new THREE.Vector3(0, 3.9, 0),
      L: new THREE.Vector3(-1.62, 0.4, 0),
      C: new THREE.Vector3(3.15, -2.15, -0.15),
      P1: new THREE.Vector3(-4.1, -3.5, 1.45),
      P2: new THREE.Vector3(-2.25, -3.5, -1.75),
      O: new THREE.Vector3(-0.35, -3.5, 1.12)

    const funnelPaths = {
      L: quadratic(
        funnelPositions.L,
        new THREE.Vector3(-1.5, 2.35, 0.5),
        funnelPositions.root

      C: quadratic(
        funnelPositions.C,
        new THREE.Vector3(2.55, 1.1, -0.6),
        funnelPositions.root

      P1: quadratic(
        funnelPositions.P1,
        new THREE.Vector3(-3.4, -1.15, 0.6),
        funnelPositions.L

      P2: quadratic(
        funnelPositions.P2,
        new THREE.Vector3(-2.65, -1.05, -0.65),
        funnelPositions.L

      O: quadratic(
        funnelPositions.O,
        new THREE.Vector3(-1.25, -1.2, 1.15),
        funnelPositions.L

    };

    const nestedPaths = {
      L: nestedL,
      C: nestedC,
      P1: nestedChild(0, 0.33),
      P2: nestedChild(Math.PI, 0.33),
      O: nestedChild(Math.PI * 0.5, 0.18)
    };

    function makeTube(key) {
      const material = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        emissive: 0xffffff,
        emissiveIntensity: 0.15,
        metalness: 0.08,
        roughness: 0.34,
        transparent: true,
        opacity: 0.94

      const mesh = new THREE.Mesh(new THREE.BufferGeometry(), material);
      mesh.userData.q46Key = key;
      tubeMeshes[key] = mesh;
      selectableMeshes.push(mesh);
      world.add(mesh);

      tubeParticles[key] = [];
      for (let i = 0; i &lt; 4; i += 1) {
        const particle = new THREE.Mesh(
          new THREE.SphereGeometry(0.07, 10, 8),
          new THREE.MeshBasicMaterial({ color: 0xffffff })
        );
        particle.userData.q46Key = key;
        particle.userData.offset = i / 4;
        selectableMeshes.push(particle);
        tubeParticles[key].push(particle);

    makeNode(&quot;P2&quot;, 0.43);

    function rebuildTubes() {

        mesh.userData.radius = radius;

        const position = lerpPoint(nestedNodePositions[key], target, currentExpansion);

        nodeRings[key].position.copy(position);

    function setFocus(key) {

      detailCopy.textContent = descriptions[key][1];

        orbitDistance * sinPhi * Math.cos(orbitTheta),
        orbitDistance * Math.cos(orbitPhi),
        orbitDistance * sinPhi * Math.sin(orbitTheta)

    function resize() {

    function updateProjectedLabels() {

          currentExpansion &lt; 0.2 &amp;&amp; (key === &quot;P1&quot; || key === &quot;P2&quot; || key === &quot;O&quot;);

        labelElements[key].style.left = `${(projected.x * 0.5 + 0.5) * rect.width}px`;
        labelElements[key].style.top = `${(-projected.y * 0.5 + 0.5) * rect.height}px`;

    function updateParticles(delta) {
      if (flowToggle.checked &amp;&amp; !reducedMotion) flowClock += delta * 0.12;
      Object.entries(tubeParticles).forEach(([key, particles]) =&gt; {
        const curve = tubeMeshes[key].userData.curve;
        const reverse = key === &quot;C&quot; || key === &quot;P2&quot;;
        particles.forEach((particle) =&gt; {
          particle.visible = flowToggle.checked;
          if (!curve) return;
          let t = (flowClock + particle.userData.offset) % 1;
          if (reverse) t = 1 - t;

      &quot;wheel&quot;,

    thicknessBasis.addEventListener(&quot;change&quot;, rebuildTubes);

    resetView.addEventListener(&quot;click&quot;, resetCamera);
    root.querySelectorAll(&quot;[data-q46-expand]&quot;).forEach((button) =&gt; {

    setFocus(&quot;root&quot;);
    resize();
    loading.hidden = true;
    root.classList.add(&quot;is-ready&quot;);

    let lastTime = performance.now();
    function render(time) {
      const delta = Math.min(50, time - lastTime);
      lastTime = time;
      updateParticles(delta);
      updateProjectedLabels();
      renderer.render(scene, camera);
      requestAnimationFrame(render);

    requestAnimationFrame(render);
